<script>
'use strict';
/* =====================================================================
   WACH?! — prototype mobile · duel vs bot · Standard Bo2 · Échanges + Qaa
   ===================================================================== */
const SEQ=[1,2,3,4,5,6,7,10,11,12];
const SUITS=['B','C','E','D'];
const SN={B:'Bâtons',C:'Coupes',E:'Épées',D:'Deniers'};
const NAMES={10:'Souta',11:'Cabal',12:'Rey'};
const BOTS=[
  {n:'Le Marchand',l:'Facile',a:'ت'},
  {n:'La Crieuse',l:'Moyen',a:'ص'},
  {n:'Le Maalem',l:'Difficile',a:'م'}
];
const BARS={
  Zerba:{ar:'زربة',m:0,d:'Tu résous en premier.'},
  Sber:{ar:'صبر',m:0,d:'Tu résous en dernier.'},
  Aoud:{ar:'عاود',m:1,d:'Deux cartes ce tour. +1 carte.'},
  Fal:{ar:'فال',m:0,d:'Vois 3 cartes écartées.'},
  Qontra:{ar:'كونطرا',m:0,d:'Annule sa Baroud.'},
  Khatf:{ar:'خطف',m:1,d:'Prends une carte libre.'},
  Kelma:{ar:'كلمة',m:0,d:'Annonce une valeur, capture-la plus tard.'},
  Chergui:{ar:'شرقي',m:1,d:'Une zone glisse vers l’autre.'}
};
const ABORT=Symbol('abort');
const $=s=>document.querySelector(s);
const G={cfg:{level:2,exch:true,qaa:true,fmt:'std',makla:false,baroud:false},tok:0,match:null,R:null,tuto:null};
const UI={phase:'idle',sel:null,picked:null,oppReady:false,reveal:null,hl:new Set(),newId:null,allow:null,dragOver:null,sel2:null,bar:null,kv:null,pick:null,pickMsg:''};
let FAST=false,UID=0;

/* ---------- utilitaires ---------- */
function beat(ms){
  const t=G.tok;
  return new Promise(r=>setTimeout(r,FAST?Math.min(ms*.25,140):ms)).then(()=>{if(t!==G.tok)throw ABORT;});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mk(v,s){return {id:++UID,v,s,code:v+s};}
function mkCode(code){const m=/^(\d+)([BCED])$/.exec(code);return mk(+m[1],m[2]);}
function fullDeck(){const d=[];for(const s of SUITS)for(const v of SEQ)d.push(mk(v,s));return d;}
function tot(p){const s=G.R.sc[p];let t=0;for(const k in s)t+=s[k];return t;}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- moteur ---------- */
function newRound(o){
  const z=()=>({base:o.baroud?3:0,ann:0,missa:0,exch:0,qaa:0,moul:0,meche:0,kelma:0,pot:0});
  const R={total:o.total,refresh:o.refresh,exch:o.exch,qaa:o.qaa,moul:o.moul,dealer:o.dealer,turn:1,
    hands:[[],[]],souk:[],medina:[],pile:[[],[]],garee:[[],[]],discard:[],refDeck:[],reserve:[],
    cap:[0,0],sc:[z(),z()],script:o.script||null,makla:!!o.makla,pt:[0,0],
    baroud:!!o.baroud,bar:[[],[]],pot:o.pot||0,kelma:[null,null]};
  if(o.rig){
    const L=o.rig;
    R.hands[0]=L.me.map(mkCode);R.hands[1]=L.bot.map(mkCode);
    R.souk=L.souk.map(mkCode);R.reserve=(L.reserve||[]).map(mkCode);
    if(o.baroud&&L.bar)R.bar=[L.bar[0].slice(),L.bar[1].slice()];
  }else{
    const d=shuffle(fullDeck());
    R.hands[0]=d.splice(0,4);R.hands[1]=d.splice(0,4);R.souk=d.splice(0,4);
    R.refDeck=d.splice(0,R.refresh.length*4);
    R.reserve=(R.exch||R.baroud)?d.splice(0,5):[];
    R.discard=d; // écartées : jamais regardées
    if(R.baroud){const n=shuffle(Object.keys(BARS));R.bar=[n.slice(0,2),n.slice(2,4)];}
  }
  return R;
}
const cOf=(z,x)=>z==='S'?(x.pile!==undefined?x.card:x):x.card;
function soukArr(p){
  const R=G.R;if(!R.makla)return R.souk;
  const ps=[];
  for(const q of [0,1]){if(q!==p&&R.pile[q].length&&R.pt[q]<R.turn)ps.push({pile:q,card:R.pile[q][R.pile[q].length-1]});}
  return [...R.souk,...ps];
}
function canEsc(p){
  const R=G.R;if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (R.hands[p].length-1+comp)+futR>=futT;
}
function calc(p,c,z){
  const R=G.R,S=z==='S',arr=S?soukArr(p):R.medina;
  const eq=arr.filter(x=>cOf(z,x).v===c.v);
  const groups=[];let taken=[];
  if(eq.length){
    groups.push(eq);taken=eq.slice();
    const i=SEQ.indexOf(c.v);
    for(let k=1;k<=2;k++){
      const nv=SEQ[i+k];if(nv===undefined)break;
      const g=arr.filter(x=>cOf(z,x).v===nv);
      if(!g.length)break;
      groups.push(g);taken.push(...g);
    }
  }
  const r={p,c,z,taken,groups,kind:'free',ann:0,missa:false,pair:null,trio:null,gi:-1,own:null};
  if(S){
    if(taken.length){r.kind='cap';const pl=taken.filter(x=>x.pile===undefined).length;r.missa=pl>0&&pl===R.souk.length;}
  }else{
    const gi=R.garee[p].findIndex(g=>g.v===c.v);
    const own=eq.find(x=>x.owner===p);
    // jeu défensif : une carte de même valeur déjà en Médina (ou jouée ce tour avec l’échange) bloque la Tringa
    const simul=!!(R.exch&&R.curPlays&&R.curPlays.some(pl=>!pl.done&&pl.card.id!==c.id&&pl.zone==='M'&&pl.card.v===c.v&&pl.p!==p));
    if(gi>=0&&eq.length===0&&!simul){r.kind='tringa';r.gi=gi;r.ann=3;}
    else if(own){r.kind='ronda';r.own=own;r.ann=2;}
    else if(taken.length){r.kind='cap';}
  }
  return r;
}
function addPts(p,kind,pts){
  const R=G.R;let g=pts;
  if(kind==='ann'){g=Math.min(pts,6-R.cap[p]);R.cap[p]+=g;}
  R.sc[p][kind]+=g;
  pop(p,g>0?'+'+g:'plafond');
  if(g>0)vib(p===0?25:0);
  return g;
}
function remFrom(arr,ids){for(let i=arr.length-1;i>=0;i--){const x=arr[i];if(ids.has(x.card?x.card.id:x.id))arr.splice(i,1);}}

async function applyRes(r){
  const R=G.R,p=r.p,S=r.z==='S';
  const tkCards=r.taken.map(x=>cOf(r.z,x));
  const done=()=>{if(r.play)r.play.done=true;};
  noteCap(p,[...tkCards,...((r.kind==='ronda'||r.kind==='tringa')?[r.c]:[])]);
  if(r.groups.length){
    UI.hl=new Set();
    for(const g of r.groups){g.forEach(x=>UI.hl.add(cOf(r.z,x).id));render();await beat(430);}
  }
  if(r.kind==='free'){
    r.c.own=p;if(S)R.souk.push(r.c);else R.medina.push({card:r.c,owner:p});
    UI.newId=r.c.id;done();render();await beat(420);UI.newId=null;return;
  }
  const idsAll=new Set(tkCards.map(c=>c.id));
  if(S){
    const plainE=r.taken.filter(x=>x.pile===undefined),pileE=r.taken.filter(x=>x.pile!==undefined);
    await fly([...idsAll,r.c.id],document.querySelector('[data-pile="'+p+'"]'));
    remFrom(R.souk,new Set(plainE.map(c=>c.id)));
    const stolen=pileE.flatMap(e=>R.pile[e.pile].splice(0));
    R.pile[p].push(...stolen,...plainE,r.c);R.pt[p]=R.turn;
    if(stolen.length)pop(p,'+'+stolen.length+' pile');
    UI.hl=new Set();done();UI.bump=p;render();UI.bump=null;
    if(r.missa){addPts(p,'missa',1);await banner('Missa ! +1',p?'bot':'pt');}
    else await beat(250);
    return;
  }
  // Médina : les captures sortent du jeu (sauf paire garée / trio)
  if(r.kind==='ronda'){
    const exit=tkCards.filter(c=>c.id!==r.own.card.id);
    await fly([...exit.map(c=>c.id)],null);
    remFrom(R.medina,idsAll);R.discard.push(...exit);
    R.garee[p].push({v:r.c.v,cards:[r.own.card,r.c]});
    UI.hl=new Set();done();render();
    const g=addPts(p,'ann',2);
    await banner(g<2?'Ronda ! plafond':'Ronda ! +2',p?'bot':'pt');return;
  }
  if(r.kind==='tringa'){
    const pr=R.garee[p][r.gi];
    await fly([...idsAll],null);
    remFrom(R.medina,idsAll);R.discard.push(...tkCards);
    R.garee[p].splice(r.gi,1);
    await fly([r.c.id],document.querySelector('[data-pile="'+p+'"]'));
    R.pile[p].push(...pr.cards,r.c);R.pt[p]=R.turn;
    UI.hl=new Set();done();UI.bump=p;render();UI.bump=null;
    const g=addPts(p,'ann',3);
    await banner(g<3?'Tringa ! plafond':'Tringa ! +3',p?'bot':'pt',900);return;
  }
  // capture défensive en Médina
  await fly([...idsAll,r.c.id],null);
  remFrom(R.medina,idsAll);R.discard.push(...tkCards,r.c);
  UI.hl=new Set();done();render();await beat(300);
}

async function doExchange(f,s){
  const R=G.R,S=f.zone==='S';
  // la carte libre du premier quitte la zone
  const fid=new Set([f.card.id]);
  if(S)remFrom(R.souk,fid);else remFrom(R.medina,fid);
  const pool=[f.card,s.card];
  let last=s.p,pts=1,name='Bouahd';
  render();
  await banner('Bouahd ! +1',s.p?'bot':'ex',800);
  const stages=[{p:f.p,name:'Btlata',pts:3},{p:s.p,name:'Bkhmsa',pts:5}];
  for(const st of stages){
    const extra=R.hands[st.p].find(c=>c.v===f.card.v);
    if(!extra||!canEsc(st.p))break;
    let yes;
    if(st.p===0)yes=await promptEscalate(extra,st);
    else yes=botEscalate(S);

    R.hands[st.p]=R.hands[st.p].filter(c=>c.id!==extra.id);
    pool.push(extra);last=st.p;pts=st.pts;name=st.name;
    let comp=false;

    render();
    await banner(name+' ! +'+pts,st.p?'bot':'ex',850);
    if(comp)pop(st.p,'+1 carte');
  }
  addPts(last,'exch',pts);noteCap(last,pool);
  const ids=pool.map(c=>c.id);
  if(S){
    if(f.play)f.play.done=true;if(s.play)s.play.done=true;
    await fly(ids,document.querySelector('[data-pile="'+last+'"]'));
    R.pile[last].push(...pool);R.pt[last]=R.turn;UI.bump=last;
  }else{
    if(f.play)f.play.done=true;if(s.play)s.play.done=true;
    await fly(ids,null);R.discard.push(...pool);
  }
  render();UI.bump=null;
  await banner((last?'Il':'Tu')+' prend l’échange',last?'bot':'ex',650);
  return last;
}

function noteCap(p,cards){

function onBoard(card){
  const R=G.R;return R.souk.some(c=>c.id===card.id)||R.medina.some(x=>x.card.id===card.id);

function freeTargets(){
  const R=G.R,t=[];
  R.souk.forEach(c=>t.push({card:c,zone:'S',owner:c.own===undefined?null:c.own}));
  R.medina.forEach(x=>t.push({card:x.card,zone:'M',owner:x.owner}));

function canAoud(p){
  const R=G.R,h=R.hands[p].length;
  if(h<2)return false;
  if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (h-2+comp)+futR>=futT;
}
function pickTarget(T,only){

function botKhatfTarget(bi,T){

}

async function resolveTurn(h,b){
  const R=G.R,pk=[h,b];
  const plays=[];
  pk.forEach((x,p)=>x.cards.forEach(c=>{
    R.hands[p]=R.hands[p].filter(y=>y.id!==c.card.id);
    plays.push({p,card:c.card,zone:c.zone,done:false});
  }));
  UI.sel=null;UI.sel2=null;UI.picked=null;
  R.curPlays=plays;
  UI.reveal={plays,flip:false,order:null,active:null,bars:[null,null]};
  // Baroud : paiement de la mèche
  const live=[null,null];
  for(const p of [0,1]){
    const nm=pk[p].bar;if(!nm)continue;
    const cost=BARS[nm].m;
    if(tot(p)>=cost){
      R.bar[p]=R.bar[p].filter(x=>x!==nm);
      if(cost){R.sc[p].meche-=cost;R.pot+=cost;}
      live[p]=nm;UI.reveal.bars[p]={name:nm,x:false};
    }
  }
  render();
  await beat(120);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('#board .flip').forEach(e=>e.classList.add('on'));
    if(UI.reveal)UI.reveal.flip=true;
  }));
  vib(15);
  await banner('Wach !','wach',650);
  for(const p of [0,1]){
    if(live[p]){
      const cost=BARS[live[p]].m;
      if(cost)pop(p,'−'+cost);
      await banner(live[p]+' !',p?'bot':'ex',700);
    }
  }
  // Qontra d'abord
  const qs=[0,1].filter(p=>live[p]==='Qontra');
  if(qs.length===2){
    UI.reveal.bars[0].x=UI.reveal.bars[1].x=true;live[0]=live[1]=null;render();
    await banner('Qontra × Qontra','info',800);
  }else if(qs.length===1){
    const q=qs[0],o=1-q;
    if(live[o]){UI.reveal.bars[o].x=true;const nm=live[o];live[o]=null;render();await banner('Qontra ! annule '+nm,q?'bot':'ex',950);}
    else await banner('Qontra… dans le vide','info',700);
    live[q]=null;
  }
  // effets immédiats
  for(const p of [0,1]){
    if(live[p]==='Kelma'){
      R.kelma[p]={v:pk[p].kv,turn:R.turn,held:false};
      await banner('Kelma ! « '+pk[p].kv+' »',p?'bot':'ex',1000);
    }
    if(live[p]==='Fal'){
      if(p===0)await showFal();else await banner('Fal !','bot',600);
    }
  }
  // initiative
  const last=R.turn===R.total;
  const prio=p=>Math.max(...plays.filter(x=>x.p===p).map(x=>x.card.v));
  let zr=[0,1].find(p=>live[p]==='Zerba'),sb=[0,1].find(p=>live[p]==='Sber');
  if(zr!==undefined&&sb!==undefined&&zr!==sb){
    await banner('Zerba × Sber','info',800);zr=sb=undefined;
  }
  let first;
  if(zr!==undefined)first=zr;
  else if(sb!==undefined)first=1-sb;
  else if(last)first=1-R.dealer;
  else{
    const v0=prio(0),v1=prio(1);
    first=v0!==v1?(v0>v1?0:1):1-R.dealer;
  }
  UI.reveal.order={[first]:1,[1-first]:2};
  render();await beat(520);
  // résolutions par créneau
  const fresh=[],lastKind={0:'free',1:'free'};
  for(const p of [first,1-first]){
    for(const m of plays.filter(x=>x.p===p)){
      UI.reveal.active=p;render();
      const f=R.exch?fresh.find(x=>x.p!==p&&x.zone===m.zone&&x.card.v===m.card.v&&onBoard(x.card)):null;
      if(f){
        const w=await doExchange({p:f.p,card:f.card,zone:f.zone,play:f.play},{p,card:m.card,zone:m.zone,play:m});
        fresh.splice(fresh.indexOf(f),1);
        lastKind[w]='exch';if(w!==p)lastKind[p]='free';
        continue;
      }
      const r=calc(p,m.card,m.zone);r.play=m;
      await applyRes(r);
      if(r.kind==='free')fresh.push({p,card:m.card,zone:m.zone,play:m});
      lastKind[p]=r.kind;
    }
    if(live[p]==='Khatf')await doKhatf(p,pk[p].kt);
    if(live[p]==='Aoud'&&R.reserve.length){
      R.hands[p].push(R.reserve.pop());render();pop(p,'+1 carte');await beat(350);
    }
  }
  for(const p of [first,1-first]){
    if(live[p]==='Chergui')await doChergui(p,pk[p].cz);
  }
  R.curPlays=null;UI.reveal=null;UI.hl=new Set();render();
  if(last&&R.qaa&&lastKind[R.dealer]!=='free'){
    addPts(R.dealer,'qaa',2);
    await banner('Qaa ! +2',R.dealer?'bot':'pt',900);
  }
}

function botPick(bi){
  const R=G.R,hand=R.hands[bi];
  if(R.script){
    const sc=R.script.bot[R.turn-1];
    const c=hand.find(x=>x.code===sc.code);
    return {card:c,zone:sc.zone};
  }
  const lvl=G.cfg.level;
  const wS=[1.35,.8,1][lvl],wM=[.5,1.4,1][lvl],noise=[.55,.4,.18][lvl];
  const lastT=R.turn===R.total;
  let best=null,bv=-1e9;
  for(const c of hand){
    for(const z of ['S','M']){
      const r=calc(bi,c,z);let v=0;
      const same=hand.filter(h=>h.id!==c.id&&h.v===c.v).length;
      if(z==='S'){
        if(r.kind==='cap'){const n=r.taken.reduce((a,x)=>a+(x.pile!==undefined?R.pile[x.pile].length:1),0);v+=wS*0.9*(n+1);if(r.missa)v+=1.4;}
        else v+=-.25;
        if(lvl===2&&R.turn>=R.total-3&&R.pile[1-bi].length>R.pile[bi].length+2)v+=.35*wS;
      }else{
        if(r.kind==='tringa')v+=(R.cap[bi]>=4?.8:3.6)*wM;
        else if(r.kind==='ronda')v+=(R.cap[bi]>=5?.6:2.6)*wM;
        else if(r.kind==='cap'){v+=.8*wM+.1*r.taken.length;}
        else v+=wM*(same&&R.cap[bi]<6?1:.15)-.6;
        if(r.kind==='free'&&lvl===2&&R.medina.some(x=>x.owner!==bi&&x.card.v===c.v))v-=.2;
      }
      // garder le 3e exemplaire pour la Tringa
      if(R.garee[bi].some(g=>g.v===c.v)&&r.kind!=='tringa')v-=3;
      if(lastT&&R.qaa&&bi===R.dealer&&r.kind!=='free')v+=2;
      v+=(Math.random()*2-1)*noise;
      if(v>bv){bv=v;best={card:c,zone:z};}
    }
  }
  return best;
}
function botBaroud(bi,pick){
  const R=G.R,hand=R.hands[bi];
  const base={cards:[{card:pick.card,zone:pick.zone}],bar:null};
  if(!R.baroud||!R.bar[bi].length)return base;
  if(R.script){
    const e=R.script.bb[R.turn-1]||{};
    return e.bar?{...base,bar:e.bar,kv:e.kv,kt:e.kt,cz:e.cz}:base;
  }
  const lvl=G.cfg.level,k=[.4,.65,.95][lvl],last=R.turn===R.total,sc=tot(bi);
  for(const n of shuffle(R.bar[bi].slice())){
    const m=BARS[n].m;if(sc<m)continue;
    if(n==='Kelma'&&!last&&R.turn<R.total-1){
      let best=null,bc=0;
      for(const v of SEQ){
        const c=hand.filter(x=>x.v===v&&x.id!==pick.card.id).length+R.souk.filter(x=>x.v===v).length+R.medina.filter(x=>x.card.v===v).length;
        if(c>bc){bc=c;best=v;}
      }
      if(best&&bc>=2&&Math.random()<.8*k+.1)return {...base,bar:'Kelma',kv:best};
    }
    if(n==='Qontra'&&R.bar[0].length&&Math.random()<.2*k)return {...base,bar:'Qontra'};
    if(n==='Zerba'){const r=calc(bi,pick.card,pick.zone);if(r.kind!=='free'&&Math.random()<.45*k)return {...base,bar:'Zerba'};}
    if(n==='Sber'){const r=calc(bi,pick.card,pick.zone);if(r.kind==='free'&&Math.random()<.3*k)return {...base,bar:'Sber'};}
    if(n==='Khatf'&&sc>=m+2&&freeTargets().length&&Math.random()<.5*k)return {...base,bar:'Khatf'};
    if(n==='Aoud'&&sc>=m+1&&canAoud(bi)&&R.cap[bi]<5){
      let pair=null;
      for(const a of hand)for(const c of hand)if(!pair&&a.id<c.id&&a.v===c.v)pair=[a,c];
      if(pair&&Math.random()<.85*k)return {cards:[{card:pair[0],zone:'M'},{card:pair[1],zone:'M'}],bar:'Aoud'};
    }
    if(n==='Fal'&&Math.random()<.12*k)return {...base,bar:'Fal'};
    if(n==='Chergui'&&!last&&sc>=m+2&&R.medina.some(x=>x.owner===1-bi)&&Math.random()<.4*k)return {...base,bar:'Chergui'};
  }
  return base;
}
function botEscalate(isSouk){
  const R=G.R;
  if(R.script){const e=R.script.esc;return e===undefined?true:e;}
  const pr=[.7,.85,1][G.cfg.level];
  return Math.random()<pr;
}

const FMT={

  light:{n:'Light',t:8,ref:[3,5,7],moul:4,rounds:2,tag:'Light · 8 tours · Bo2'},

};

  return {total:F.t,refresh:F.ref,exch:G.cfg.exch,qaa:G.cfg.qaa,moul:F.moul,dealer,makla:G.cfg.makla,baroud:G.cfg.baroud};

function startMatch(){

async function playRound(){
  const m=G.match;
  G.R=newRound({...stdCfg(m.dealer),pot:m.potCarry||0});m.potCarry=0;
  UI.sel=null;UI.reveal=null;UI.phase='busy';render();

}
function tableRows(){
  const R=G.R,s=R.sc,rows=[];
  if(R.baroud)rows.push(['Départ','base']);
  rows.push(['Annonces','ann'],['Missa','missa']);
  if(R.exch)rows.push(['Échanges','exch']);
  if(R.qaa)rows.push(['Qaa','qaa']);
  if(R.baroud)rows.push(['Mèches','meche'],['Kelma','kelma']);
  if(R.moul)rows.push(['Moul Souk','moul']);
  if(R.baroud)rows.push(['Poudrière','pot']);
  return rows.map(([l,k])=>({l,k,a:s[0][k],b:s[1][k]}));
}
async function roundSummary(){
  const R=G.R,m=G.match;
  if(G.tuto)return lessonEnd();
  const t0=tot(0),t1=tot(1);
  m.hist.push([t0,t1]);
  const cum=m.hist.reduce((a,h)=>[a[0]+h[0],a[1]+h[1]],[0,0]);
  const over=m.round>=m.rounds&&cum[0]!==cum[1]&&!(m.tie&&false);
  const isLast=m.round>=m.rounds;
  let rowsHTML=tableRows().map(r=>`<tr class="fade"><td>${r.l}${r.k==='moul'?'<small>pile '+R.pile[0].length+' – '+R.pile[1].length+'</small>':''}</td><td>${r.a||'–'}</td><td>${r.b||'–'}</td></tr>`).join('');
  rowsHTML+=`<tr class="tot"><td>Manche ${m.round}${m.tie?' · départage':''}</td><td>${t0}</td><td>${t1}</td></tr>`;
  let btn,act;
  if(!isLast){btn='Manche '+(m.round+1);act='next';}
  else if(cum[0]===cum[1]){btn='Départage';act='tie';}
  else{btn='Résultat';act='end';}
  openSheet(`<h2>Fin de manche</h2><table class="sum"><tr><th></th><th>Toi</th><th>${BOTS[G.cfg.level].n.split(' ')[1]}</th></tr>${rowsHTML}</table><button class="btn pri" id="sNext" style="width:100%;background:var(--saf);color:#2A1D00">${btn}</button>`);
  const t=G.tok;
  await new Promise(res=>{$('#sNext').onclick=res;});
  if(t!==G.tok)throw ABORT;
  closeSheet();
  if(act==='next'){m.round++;m.dealer=1-m.dealer;m.tie=false;await playRound();}
  else if(act==='tie'){m.round++;m.dealer=1-m.dealer;m.tie=true;m.rounds=m.round;
    // la manche de départage est jouée seule : rondes cumulées déjà prises en compte
    await playRound();}
  else{matchEnd(cum);}
}
function matchEnd(cum){
  const m=G.match;

function cardHTML(c,cls,extra){

}
function flipHTML(c,on,ord,cur,bb){

function zoneHTML(z){
  const R=G.R,S=z==='S',arr=S?R.souk:R.medina;
  const cards=arr.map(x=>{
    const c=cOf(z,x);
    const cls='zc'+(UI.hl.has(c.id)?' hl':'')+(UI.newId===c.id?' new':'')+(UI.pick?(UI.pick.ids.has(c.id)?' pickable':' dim'):'');
    return `<div class="card s${c.s} ${cls}" data-cid="${c.id}">${cardInner(c)}${(S||x.owner==null)?'':'<span class="tok own'+x.owner+'"></span>'}</div>`;
  }).join('');
  let ptiles='';
  if(S&&R.makla)for(const q of [0,1]){
    const pl=R.pile[q];if(!pl.length)continue;const t=pl[pl.length-1];
    ptiles+=`<div class="card s${t.s} zc ptile own${q}${R.pt[q]>=R.turn&&UI.phase!=='select'?' cool':''}${UI.hl.has(t.id)?' hl':''}" data-cid="${t.id}">${cardInner(t)}<span class="pbadge">${pl.length}</span><span class="tok own${q}"></span></div>`;
  }
  let corner='';
  if(!S){
    const gp=[0,1].flatMap(p=>R.garee[p].map(g=>`<span class="gp own${p}">${g.v}×2</span>`)).join('');
    corner=`<div class="corner"><span class="lbl">Ronda</span>${gp}</div>`;
  }
  // emplacements
  let mine='',opp='';
  const rv=UI.reveal;
  let placed=false;
  if(rv){
    const ord=rv.order,seen=[false,false];
    rv.plays.forEach(pl=>{
      let bb='';
      if(!seen[pl.p]){seen[pl.p]=true;const b=rv.bars[pl.p];if(b&&rv.flip)bb='<span class="bb'+(b.x?' x':'')+'">'+BARS[b.name].ar+'</span>';}
      if(pl.zone!==z||pl.done)return;
      const f=flipHTML(pl.card,rv.flip,ord&&ord[pl.p],rv.active===pl.p,bb);
      if(pl.p===0)mine+=f;else opp+=f;
    });
  }else if(UI.phase==='select'){
    [[1,UI.sel],[2,UI.sel2]].forEach(([i,s])=>{
      if(s&&s.zone===z){
        placed=true;
        const bb=(i===1&&UI.bar)?'<span class="bb">'+BARS[UI.bar].ar+'</span>':'';
        mine+=`<div class="sealed" data-placed="${i}" role="button" tabindex="0" aria-label="Reprendre la carte"><div class="card back"></div>${bb}</div>`;
      }
    });
  }
  const mineCls='slot mine'+(placed?' placed':'')+(UI.phase==='select'&&!placed?' target':'');
  const ready=UI.phase==='select'&&(UI.picked||UI.dragOver)&&(!UI.sel||(UI.bar==='Aoud'&&!UI.sel2))?' ready':'';
  const over=UI.dragOver===z?' over':'';
  const hint=UI.allow&&UI.allow.zone===z&&UI.phase==='select'?' hint':'';
  return `<div class="zone ${S?'souk':'med'}${ready}${over}${hint}" data-zone="${z}" tabindex="0" role="button" aria-label="${S?'Souk':'Médina'}">
    <div class="zh"><span>${S?'Souk':'Médina'}</span><span class="cnt">${arr.length}</span></div>
    <div class="zfree ${arr.length+(ptiles?2:0)>8?'dense':''}">${cards}${ptiles}</div>${corner}
    <div class="slots"><div class="slot opp">${opp}</div><div class="${mineCls}">${mine}</div></div></div>`;
}
function readySel(){
  return !!(UI.sel&&(UI.bar!=='Aoud'||UI.sel2)&&(UI.bar!=='Kelma'||UI.kv));
}
function trayHTML(){
  const R=G.R;
  if(!R.baroud||UI.phase!=='select')return '';
  const last=R.turn===R.total,A=UI.allow;
  return '<div class="btray">'+R.bar[0].map(n=>{
    const B=BARS[n];
    const dis=tot(0)<B.m||(last&&(n==='Kelma'||n==='Chergui'))||(n==='Aoud'&&!canAoud(0))||!!(A&&A.bar!==n);
    const on=UI.bar===n;
    return `<button class="bcard${on?' on':''}${dis?' dis':''}${(A&&A.bar===n&&!on)?' hint':''}" data-b="${n}"><b>${B.ar}</b><small>${n}${on&&n==='Kelma'&&UI.kv?' · '+UI.kv:''}</small><i>${'●'.repeat(B.m)}</i></button>`;
  }).join('')+'<button class="binfo" id="binfo" aria-label="Cartes Baroud">?</button></div>';
}
function meHTML(){
  const R=G.R;
  const used=new Set([UI.sel&&UI.sel.card.id,UI.sel2&&UI.sel2.card.id]);
  const hand=R.hands[0].slice().sort((a,b)=>a.v-b.v||a.s.localeCompare(b.s)).filter(c=>!used.has(c.id));

}

/* ---------- effets ---------- */
async function banner(txt,kind,ms){
  const el=$('#banner');
  el.innerHTML='<div class="bn '+(kind||'')+'">'+txt+'</div>';
  try{await beat(ms||750);}finally{el.innerHTML='';}
}
function pop(p,text){
  const sc=document.querySelector('[data-score="'+p+'"]');if(!sc)return;
  const r=sc.getBoundingClientRect(),a=$('#app').getBoundingClientRect();
  const d=document.createElement('div');d.className='pop'+(p?' bot':'');d.textContent=text;
  d.style.left=(r.left-a.left-(text.length>3?30:0))+'px';d.style.top=(r.top-a.top-4)+'px';
  $('#fx').appendChild(d);setTimeout(()=>d.remove(),1200);
  sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump');
}
function fly(ids,target){
  const fx=$('#fx'),ar=$('#app').getBoundingClientRect(),tr=target?target.getBoundingClientRect():null;
  const ps=[];
  ids.forEach(id=>{
    const el=document.querySelector('[data-cid="'+id+'"]');if(!el)return;
    const r=el.getBoundingClientRect();
    const g=el.cloneNode(true);
    g.removeAttribute('data-cid');
    Object.assign(g.style,{position:'absolute',left:(r.left-ar.left)+'px',top:(r.top-ar.top)+'px',width:r.width+'px',height:r.height+'px',margin:'0',pointerEvents:'none',animation:'none'});
    g.style.setProperty('--cw',r.width+'px');g.style.setProperty('--ch',r.height+'px');
    g.classList.remove('hl');
    fx.appendChild(g);el.style.visibility='hidden';
    const dx=tr?(tr.left+tr.width/2)-(r.left+r.width/2):0,dy=tr?(tr.top+tr.height/2)-(r.top+r.height/2):-16;
    const kf=[{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+(tr?.35:.5)+')',opacity:tr?.85:0}];
    let a;
    try{a=g.animate(kf,{duration:FAST?120:480,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});ps.push(a.finished.catch(()=>{}).then(()=>g.remove()));}
    catch(e){g.remove();}
  });
  return Promise.all(ps);
}

  $('#lvl').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;G.cfg.level=+b.dataset.l;renderHome();};
  $('#fmt').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;G.cfg.fmt=b.dataset.f;renderHome();};
  document.querySelectorAll('#home .tgl').forEach(b=>b.onclick=()=>{G.cfg[b.dataset.t]=!G.cfg[b.dataset.t];renderHome();});
  $('#play').onclick=startMatch;
  if($('#gal'))$('#gal').onclick=openGallery;
  $('#tuto').onclick=()=>{
    openSheet('<h2>Tutoriel</h2><div class="lsn">'+LESSONS.map((L,i)=>`<button class="btn" data-ls="${i}"><span>${i+1}. ${L.name}</span>${store('wach.l'+i)?'<em>✓</em>':''}</button>`).join('')+'</div><button class="btn" id="lsX" style="width:100%;background:var(--panel2);color:var(--fg)">Fermer</button>');
    document.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{closeSheet();startLesson(+b.dataset.ls);});
    $('#lsX').onclick=closeSheet;
  };
}

/* ---------- interactions de jeu ---------- */
function nudge(){const el=$('#coach');if(el.hidden)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function tryPlace(cid,zone){
  const R=G.R;if(!R||UI.phase!=='select')return;
  const c=R.hands[0].find(x=>x.id===cid);if(!c)return;
  const A=UI.allow,second=UI.bar==='Aoud'&&!!UI.sel;
  if(A){
    const ec=second?A.c2:A.code,ez=second?A.z2:A.zone;
    if(c.code!==ec||zone!==ez){UI.picked=null;render();nudge();return;}
  }
  if(second)UI.sel2={card:c,zone};else UI.sel={card:c,zone};
  UI.picked=null;UI.dragOver=null;render();vib(10);
}
function toggleBar(n){
  if(UI.phase!=='select')return;
  const R=G.R,B=BARS[n],A=UI.allow,last=R.turn===R.total;
  const dis=tot(0)<B.m||(last&&(n==='Kelma'||n==='Chergui'))||(n==='Aoud'&&!canAoud(0))||!!(A&&A.bar!==n);
  if(dis){nudge();return;}
  if(UI.bar===n){
    if(n==='Kelma'){pickValue();return;}
    UI.bar=null;UI.kv=null;UI.sel2=null;render();return;
  }
  UI.bar=n;UI.kv=null;UI.sel2=null;render();
  if(n==='Kelma')pickValue();
}
function pickValue(){
  const A=UI.allow;
  openSheet('<h2>Kelma</h2><div class="sub">Quelle valeur ?</div><div class="vgrid">'+SEQ.map(v=>`<button class="vb" data-v="${v}">${v}</button>`).join('')+'</div><button class="btn" id="vNo" style="width:100%;background:var(--panel2);color:var(--fg)">Retirer</button>');
  document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v;
    if(A&&A.kv&&v!==A.kv){nudge();return;}
    UI.kv=v;closeSheet();render();
  });
  $('#vNo').onclick=()=>{UI.bar=null;UI.kv=null;closeSheet();render();};
}
function galleryHTML(){
  return '<h2>Cartes Baroud</h2><div class="gal">'+Object.keys(BARS).map(n=>{
    const B=BARS[n];
    return `<div class="grow"><div class="gcard"><b>${B.ar}</b></div><div><b>${n}</b> <span class="sub" style="display:inline">· ${B.m?B.m+' jeton':'gratuite'}</span><div class="sub">${B.d}</div></div></div>`;
  }).join('')+'</div><button class="btn" id="gX" style="width:100%;background:var(--panel2);color:var(--fg)">Fermer</button>';
}
function openGallery(){openSheet(galleryHTML());$('#gX').onclick=closeSheet;}
let drag=null;
$('#me').addEventListener('pointerdown',e=>{
  if(UI.phase!=='select')return;
  const el=e.target.closest('.hcard');if(!el)return;
  drag={id:+el.dataset.cid,el,x:e.clientX,y:e.clientY,moved:false,ghost:null,pid:e.pointerId};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.onpointermove=ev=>{
    if(!drag)return;
    if(!drag.moved&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>9){
      drag.moved=true;
      const g=el.cloneNode(true);g.classList.remove('picked','hint');g.classList.add('dragging-ghost');
      g.style.setProperty('--cw','68px');g.style.setProperty('--ch','96px');g.style.width='68px';g.style.height='96px';
      document.body.appendChild(g);drag.ghost=g;el.style.opacity='.25';
      UI.picked=null;
    }
    if(drag.moved){
      drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';
      const z=document.elementFromPoint(ev.clientX,ev.clientY);
      const zn=z&&z.closest?z.closest('.zone'):null;
      const zk=zn?zn.dataset.zone:null;
      if(zk!==UI.dragOver){
        UI.dragOver=zk;
        document.querySelectorAll('#board .zone').forEach(n=>n.classList.toggle('over',n.dataset.zone===zk));
      }
    }
  };
  const fin=ev=>{
    if(!drag)return;
    const d=drag;drag=null;el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null;
    if(d.ghost)d.ghost.remove();
    el.style.opacity='';
    if(d.moved){
      const z=document.elementFromPoint(ev.clientX,ev.clientY);
      const zn=z&&z.closest?z.closest('.zone'):null;
      UI.dragOver=null;
      if(zn&&ev.type==='pointerup')tryPlace(d.id,zn.dataset.zone);else render();
    }else{
      UI.picked=UI.picked===d.id?null:d.id;render();
    }
  };
  el.onpointerup=fin;el.onpointercancel=fin;
});
$('#board').addEventListener('click',e=>{
  if(UI.pick){
    const el=e.target.closest('[data-cid]');
    if(el){
      const id=+el.dataset.cid;
      if(UI.pick.ids.has(id)){const t=UI.pick.list.find(x=>x.card.id===id),r=UI.pick.res;UI.pick=null;UI.pickMsg='';r(t);}
    }
    return;
  }
  if(UI.phase!=='select')return;
  const pl=e.target.closest('[data-placed]');
  if(pl){
    if(+pl.dataset.placed===2)UI.sel2=null;else{UI.sel=UI.sel2;UI.sel2=null;}
    render();return;
  }
  const z=e.target.closest('.zone');
  if(z&&UI.picked)tryPlace(UI.picked,z.dataset.zone);
});
$('#me').addEventListener('click',e=>{
  const bc=e.target.closest('.bcard');
  if(bc){toggleBar(bc.dataset.b);return;}
  if(e.target.closest('#binfo')){openGallery();return;}
  if(e.target.closest('#wach')&&UI.phase==='select'&&readySel()){
    const A=UI.allow;
    const cards=[{card:UI.sel.card,zone:UI.sel.zone}];
    if(UI.bar==='Aoud')cards.push({card:UI.sel2.card,zone:UI.sel2.zone});
    const pay={cards,bar:UI.bar,kv:UI.kv,kt:A&&A.kt,cz:A&&A.cz};
    UI.phase='busy';UI.resolveSel&&UI.resolveSel(pay);UI.resolveSel=null;
  }
});
$('#game').addEventListener('click',e=>{
  if(UI.phase==='busy'&&!e.target.closest('button')&&!e.target.closest('[data-pile]'))FAST=true;
  const pl=e.target.closest('[data-pile]');
  if(pl&&G.R&&!document.querySelector('#sheet.on')){
    const p=+pl.dataset.pile;
    const cs=G.R.pile[p].map(c=>cardHTML(c,'')).join('')||'<div class="sub">Vide</div>';
    openSheet('<h2>Pile · '+G.R.pile[p].length+'</h2><div class="pgrid">'+cs+'</div><button class="btn" id="pX" style="width:100%;background:var(--panel2);color:var(--fg)">Fermer</button>');
    $('#pX').onclick=closeSheet;
  }
  if(e.target.closest('#menuBtn')){
    openSheet('<h2>Pause</h2><div class="xbtns"><button class="btn" id="mQ">Quitter</button><button class="btn pri" id="mR">Reprendre</button></div>');
    $('#mR').onclick=closeSheet;$('#mQ').onclick=goHome;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const t=e.target;
  if(t.classList&&t.classList.contains('hcard')&&UI.phase==='select'){e.preventDefault();const id=+t.dataset.cid;UI.picked=UI.picked===id?null:id;render();}
  else if(t.classList&&t.classList.contains('zone')&&UI.picked&&UI.phase==='select'){e.preventDefault();tryPlace(UI.picked,t.dataset.zone);}
  else if(t.dataset&&t.dataset.placed){e.preventDefault();if(+t.dataset.placed===2)UI.sel2=null;else{UI.sel=UI.sel2;UI.sel2=null;}render();}
});


/* =====================================================================
   HISTORIQUE DES COUPS — depuis la pause, la fin de manche et la fin de match
   ===================================================================== */
const HL={log:[],pending:[],cur:null};
const HFR={B:'♣',C:'♥',E:'♠',D:'♦'},HFV={1:'A',10:'J',11:'Q',12:'K'},HSH={B:'Bât.',C:'Cou.',E:'Ép.',D:'Den.'};
function Hn(p){
  if(typeof seatName==='function')return seatName(p);
  return p===0?'Toi':(G.tuto?'Le Marchand':BOTS[G.cfg.level].n);
}
function HEn(e){return (typeof entName==='function')?entName(e):Hn(e);}
function Hcard(c){
  if(G.R&&G.R.baroud)return (HFV[c.v]||c.v)+HFR[c.s];
  return c.v+' '+HSH[c.s];
}
const HZ={S:'Souk',M:'Médina'};
const HK={ann:'annonce',missa:'Missa',exch:'échange',qaa:'Qaa',moul:'Moul Souk',meche:'mèche',kelma:'Kelma',pot:'Poudrière'};
function Hround(){return G.match?G.match.round:0;}
function Hesc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function HLpts(e,k,g){
  const t=(g>0?'+':'')+g+' '+(HK[k]||k)+(k==='ann'&&g===0?' (plafond)':'')+' — '+HEn(e);
  if(g===0&&k!=='ann')return;
  if(HL.cur)HL.cur.pts.push(t);else HL.pending.push({k:'pts',t});
}
const _Hap=addPts;
addPts=function(a,b,c){const g=_Hap(a,b,c);HLpts(a,b,g);return g;};
if(typeof addAnn==='function'){
  const _Haa=addAnn;
  addAnn=function(p,pts){const g=_Haa(p,pts);HLpts(ent(p),'ann',g);return g;};
}
const _Hap2=applyRes;
applyRes=async function(r){
  if(HL.cur){
    HL.cur.res.push({p:r.p,t:Hcard(r.c),z:r.z,kind:r.kind,missa:!!r.missa,
      taken:r.taken.map(x=>(x.pile!==undefined?'pile ('+Hcard(x.card)+')':Hcard(cOf(r.z,x))))});
  }
  return _Hap2(r);
};
const HSKIP=/^((Zerba|Sber|Aoud|Fal|Qontra|Khatf|Kelma|Chergui) !$)|^(Wach|Refresh|Le Donneur distribue|Tu donnes|.+ donne$|Ronda|Tringa|Missa|Qaa|Moul Souk|Kelma tenue|Kelma rompue|Poudrière|Poudre)/;
const _Hbn=banner;
banner=function(txt,kd,ms){
  try{
    const t=String(txt).replace(/<[^>]+>/g,'');
    if(kd!=='wach'&&!HSKIP.test(t)){
      if(HL.cur)HL.cur.notes.push(t);else HL.pending.push({k:'note',t});
    }
  }catch(e){}
  return _Hbn(txt,kd,ms);
};
const _Hrf=doRefresh;
doRefresh=async function(){HL.pending.push({k:'note',t:'Le Donneur distribue 2 cartes à chaque joueur'});return _Hrf();};
const _Hrt=resolveTurn;
resolveTurn=async function(...a){
  const pays=(a.length===1&&Array.isArray(a[0]))?a[0]:a,R=G.R;
  const e={round:Hround(),turn:R.turn,total:R.total,
    plays:pays.map((x,p)=>({p,n:Hn(p),cards:x.cards.map(c=>({t:Hcard(c.card),z:c.zone})),bar:x.bar||null,kv:x.kv||null})),
    res:[],pts:[],notes:[],pre:HL.pending.filter(x=>x.k==='note').map(x=>x.t),done:false};
  HL.pending=HL.pending.filter(x=>x.k==='pts');
  HL.cur=e;HL.log.push(e);
  try{return await _Hrt(...a);}finally{e.done=true;HL.cur=null;}
};
const _Hrs=roundSummary;
roundSummary=async function(){
  const R=G.R;
  if(HL.pending.length||true){
    const e={round:Hround(),turn:null,end:true,res:[],pts:HL.pending.filter(x=>x.k==='pts').map(x=>x.t),
      notes:HL.pending.filter(x=>x.k==='note').map(x=>x.t),plays:[],pre:[],done:true};
    HL.pending=[];
    if(e.pts.length||e.notes.length)HL.log.push(e);
  }
  return _Hrs();
};
const _Hsm=startMatch;
startMatch=function(){HL.log=[];HL.pending=[];HL.cur=null;_Hsm();};
if(typeof startLesson==='function'){
  const _Hsl=startLesson;
  startLesson=function(i){HL.log=[];HL.pending=[];HL.cur=null;_Hsl(i);};
}
function Hhtml(round){
  const rounds=[...new Set(HL.log.map(e=>e.round))].sort((a,b)=>a-b);
  if(!rounds.length)return '<div class="sub">Aucun coup joué pour l’instant.</div>';
  if(round===undefined||!rounds.includes(round))round=rounds[rounds.length-1];
  const chips=rounds.length>1?'<div class="hchips">'+rounds.map(r=>`<button class="hchip${r===round?' on':''}" data-r="${r}">Manche ${r||1}</button>`).join('')+'</div>':'';
  const body=HL.log.filter(e=>e.round===round&&(e.done||e.end)).map(e=>{
    if(e.end)return `<div class="he"><div class="hh">Fin de manche</div>${e.pts.map(t=>'<div class="hp">'+Hesc(t)+'</div>').join('')}${e.notes.map(t=>'<div class="hn">'+Hesc(t)+'</div>').join('')}</div>`;
    const pl=e.plays.map(p=>`<div class="hl"><b>${Hesc(p.n)}</b> · ${p.cards.map(c=>Hesc(c.t)+' → '+HZ[c.z]).join(' et ')}${p.bar?' · <i>✦ '+Hesc(p.bar)+(p.kv?' '+p.kv:'')+'</i>':''}</div>`).join('');
    const rs=e.res.map(r=>{
      const who=Hesc(Hn(r.p)),z=HZ[r.z];
      let t;
      if(r.kind==='free')t=`${Hesc(r.t)} reste libre (${z})`;
      else if(r.kind==='ronda')t=`${Hesc(r.t)} fait une Ronda (${z})`;
      else if(r.kind==='tringa')t=`${Hesc(r.t)} fait une Tringa (${z})`;
      else t=`${Hesc(r.t)} capture ${r.taken.length?Hesc(r.taken.join(', ')):'—'} (${z})${r.missa?' · Missa':''}`;
      return `<div class="hr"><b>${who}</b> : ${t}</div>`;
    }).join('');
    const pts=e.pts.map(t=>'<div class="hp">'+Hesc(t)+'</div>').join('');
    const nt=e.pre.concat(e.notes).map(t=>'<div class="hn">'+Hesc(t)+'</div>').join('');
    return `<div class="he"><div class="hh">Tour ${e.turn}/${e.total}</div>${nt?nt:''}${pl}${rs}${pts}</div>`;
  }).join('')||'<div class="sub">Aucun coup terminé dans cette manche.</div>';
  return chips+'<div class="hbody">'+body+'</div>';
}
function Hopen(round){
  let el=document.getElementById('hist');
  if(!el){el=document.createElement('div');el.id='hist';el.className='sheet on';$('#app').appendChild(el);}
  const draw=r=>{
    el.innerHTML='<div class="sc"><h2>Historique des coups</h2>'+Hhtml(r)+'<button class="btn" id="hX" style="width:100%;margin-top:12px;background:var(--panel2);color:var(--fg)">Fermer</button></div>';
    el.querySelectorAll('.hchip').forEach(b=>b.onclick=()=>draw(+b.dataset.r));
    el.querySelector('#hX').onclick=()=>el.remove();
    const bd=el.querySelector('.hbody');if(bd)bd.scrollTop=bd.scrollHeight;
  };
  draw(round);
}
const _Hos=openSheet;
openSheet=function(html,mid){
  _Hos(html,mid);
  try{
    const sc=document.querySelector('#sheet .sc');if(!sc)return;
    const mk=()=>{const b=document.createElement('button');b.className='btn';b.id='histBtn';b.style.cssText='width:100%;background:var(--panel2);color:var(--fg);margin-bottom:10px';b.textContent='Historique des coups';b.onclick=()=>Hopen(Hround());return b;};
    if(html.indexOf('<h2>Pause</h2>')===0){sc.insertBefore(mk(),sc.querySelector('.xbtns'));}
    else if(html.indexOf('<h2>Fin de manche</h2>')===0){const n=sc.querySelector('#sNext');n.parentNode.insertBefore(mk(),n);}
    else if(html.indexOf('id="sAgain"')>0){const r=sc.querySelector('.row');r.parentNode.insertBefore(mk(),r);}
  }catch(e){}
};

/* =====================================================================
   PWA : bouton « Installer l’app » + retour au menu principal
   ===================================================================== */
(function(){
  let ip=null;
  const standalone=()=>(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;try{renderHome();}catch(x){}});
  window.addEventListener('appinstalled',()=>{ip=null;try{renderHome();}catch(x){}});
  const _rh=renderHome;
  renderHome=function(){
    _rh();
    const play=document.querySelector('#play');if(!play)return;
    const box=play.parentNode;
    if(!standalone()&&(ip||ios)){
      const b=document.createElement('button');b.className='btn';b.id='pwaBtn';b.textContent='Installer l’app';
      b.onclick=()=>{
        if(ip){ip.prompt();ip.userChoice.then(()=>{ip=null;try{renderHome();}catch(x){}});return;}
        openSheet('<h2>Installer</h2><div class="sub">Touche Partager, puis « Sur l’écran d’accueil ».</div><button class="btn" id="pwX" style="width:100%;background:var(--panel2);color:var(--fg)">Fermer</button>');
        const x=document.querySelector('#pwX');if(x)x.onclick=closeSheet;
      };
      box.appendChild(b);
    }
    if(window.__PWA){
      const a=document.createElement('a');a.className='btn';a.href='index.html';a.textContent='Menu principal';a.style.textDecoration='none';
      box.appendChild(a);
    }
  };
  const h=document.getElementById('home');
  if(h&&h.classList.contains('on'))renderHome();
})();

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}

renderHome();


/* ===== affichage adaptatif : tablette et ordinateur ===== */
(function(){
  let last=0,lw=0;
  function apply(){
    const vw=window.innerWidth,vh=window.innerHeight;
    let u=Math.min(vh/780,vw/400);u=Math.max(1,Math.min(u,1.7));u=Math.round(u*100)/100;
    let wf=Math.max(1,Math.min(1.7,(vw/vh)/0.72));wf=Math.round(wf*100)/100;
    if(Math.abs(u-last)<0.02&&Math.abs(wf-lw)<0.03)return;
    last=u;lw=wf;
    const s=document.documentElement.style;
    s.setProperty('--u',u+'px');s.setProperty('--wf',String(wf));
  }
  window.addEventListener('resize',apply);window.addEventListener('orientationchange',apply);apply();
})();
</script>
