<script>
'use strict';
/* =====================================================================
   WACH?! — prototype mobile · duel vs bot · Standard Bo2 · Échanges + Qaa
   ===================================================================== */
const SEQ=[1,2,3,4,5,6,7,10,11,12];
const SUITS=['B','C','E','D'];
const SN={B:'Trèfle',C:'Cœur',E:'Pique',D:'Carreau'};
const NAMES={10:'Valet',11:'Dame',12:'Roi'};
const BOTS=[
  {n:'Louis',l:'Facile',a:'L'},
  {n:'Emma',l:'Moyen',a:'E'},
  {n:'Hugo',l:'Difficile',a:'H'}
];
const BARS={
  Hâte:{ar:'8♣',m:0,d:'Tu résous en premier.'},
  Patience:{ar:'8♥',m:0,d:'Tu résous en dernier.'},
  Encore:{ar:'9♣',m:1,d:'Deux cartes ce tour. +1 carte.'},
  Présage:{ar:'9♥',m:0,d:'Vois 3 cartes écartées.'},
  Contre:{ar:'8♠',m:0,d:'Annule sa carte.'},
  Rafle:{ar:'9♠',m:1,d:'Prends une carte libre.'},
  Parole:{ar:'8♦',m:0,d:'Annonce une valeur, capture-la plus tard.'},
  Vent:{ar:'9♦',m:1,d:'Une zone glisse vers l’autre.'}
};
const ABORT=Symbol('abort');
const $=s=>document.querySelector(s);
const G={cfg:{level:0,exch:false,qaa:false,fmt:'light',makla:false,baroud:false},tok:0,match:null,R:null,tuto:null};
const UI={phase:'idle',sel:null,picked:null,oppReady:false,reveal:null,hl:new Set(),newId:null,allow:null,dragOver:null,sel2:null,bar:null,kv:null,pick:null,pickMsg:''};
let FAST=false,UID=0;

/* ---------- utilitaires ---------- */
function beat(ms){
  const t=G.tok;
  return new Promise(r=>setTimeout(r,FAST?Math.min(ms*.25,140):ms)).then(()=>{if(t!==G.tok)throw ABORT;});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mk(v,s){return {id:++UID,v,s,code:v+s};}
function mkCode(code){const m=/^(\d+)([BCED])$/.exec(code);return mk(+m[1],m[2]);}
function fullDeck(){const d=[];for(const s of SUITS)for(const v of SEQ)d.push(mk(v,s));return d;}
function tot(p){const s=G.R.sc[p];let t=0;for(const k in s)t+=s[k];return t;}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- moteur ---------- */
function newRound(o){
  const z=()=>({base:o.baroud?3:0,ann:0,missa:0,exch:0,qaa:0,moul:0,meche:0,kelma:0,pot:0});
  const R={total:o.total,refresh:o.refresh,exch:o.exch,qaa:o.qaa,moul:o.moul,dealer:o.dealer,turn:1,
    hands:[[],[]],souk:[],medina:[],pile:[[],[]],garee:[[],[]],discard:[],refDeck:[],reserve:[],
    cap:[0,0],sc:[z(),z()],script:o.script||null,makla:!!o.makla,pt:[0,0],
    baroud:!!o.baroud,bar:[[],[]],pot:o.pot||0,kelma:[null,null]};
  if(o.rig){
    const L=o.rig;
    R.hands[0]=L.me.map(mkCode);R.hands[1]=L.bot.map(mkCode);
    R.souk=L.souk.map(mkCode);R.reserve=(L.reserve||[]).map(mkCode);
    if(o.baroud&&L.bar)R.bar=[L.bar[0].slice(),L.bar[1].slice()];
  }else{
    const d=shuffle(fullDeck());
    R.hands[0]=d.splice(0,4);R.hands[1]=d.splice(0,4);R.souk=d.splice(0,4);
    R.refDeck=d.splice(0,R.refresh.length*4);
    R.reserve=(R.exch||R.baroud)?d.splice(0,5):[];
    R.discard=d; // écartées : jamais regardées
    if(R.baroud){const n=shuffle(Object.keys(BARS));R.bar=[n.slice(0,2),n.slice(2,4)];}
  }
  return R;
}
const cOf=(z,x)=>z==='S'?(x.pile!==undefined?x.card:x):x.card;
function soukArr(p){
  const R=G.R;if(!R.makla)return R.souk;
  const ps=[];
  for(const q of [0,1]){if(q!==p&&R.pile[q].length&&R.pt[q]<R.turn)ps.push({pile:q,card:R.pile[q][R.pile[q].length-1]});}
  return [...R.souk,...ps];
}
function canEsc(p){
  const R=G.R;if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (R.hands[p].length-1+comp)+futR>=futT;
}
function calc(p,c,z){
  const R=G.R,S=z==='S',arr=S?soukArr(p):R.medina;
  const eq=arr.filter(x=>cOf(z,x).v===c.v);
  const groups=[];let taken=[];
  if(eq.length){
    groups.push(eq);taken=eq.slice();
    const i=SEQ.indexOf(c.v);
    for(let k=1;k<=2;k++){
      const nv=SEQ[i+k];if(nv===undefined)break;
      const g=arr.filter(x=>cOf(z,x).v===nv);
      if(!g.length)break;
      groups.push(g);taken.push(...g);
    }
  }
  const r={p,c,z,taken,groups,kind:'free',ann:0,missa:false,pair:null,trio:null,gi:-1,own:null};
  if(S){
    if(taken.length){r.kind='cap';const pl=taken.filter(x=>x.pile===undefined).length;r.missa=pl>0&&pl===R.souk.length;}
  }else{
    const gi=R.garee[p].findIndex(g=>g.v===c.v);
    const own=eq.find(x=>x.owner===p);
    // jeu défensif : une carte de même valeur déjà en Médina (ou jouée ce tour avec l’échange) bloque la Tringa
    const simul=!!(R.exch&&R.curPlays&&R.curPlays.some(pl=>!pl.done&&pl.card.id!==c.id&&pl.zone==='M'&&pl.card.v===c.v&&pl.p!==p));
    if(gi>=0&&eq.length===0&&!simul){r.kind='tringa';r.gi=gi;r.ann=3;}
    else if(own){r.kind='ronda';r.own=own;r.ann=2;}
    else if(taken.length){r.kind='cap';}
  }
  return r;
}
function addPts(p,kind,pts){
  const R=G.R;let g=pts;
  if(kind==='ann'){g=Math.min(pts,6-R.cap[p]);R.cap[p]+=g;}
  R.sc[p][kind]+=g;
  pop(p,g>0?'+'+g:'plafond');
  if(g>0)vib(p===0?25:0);
  return g;
}
function remFrom(arr,ids){for(let i=arr.length-1;i>=0;i--){const x=arr[i];if(ids.has(x.card?x.card.id:x.id))arr.splice(i,1);}}

async function applyRes(r){
  const R=G.R,p=r.p,S=r.z==='S';
  const tkCards=r.taken.map(x=>cOf(r.z,x));
  const done=()=>{if(r.play)r.play.done=true;};
  noteCap(p,[...tkCards,...((r.kind==='ronda'||r.kind==='tringa')?[r.c]:[])]);
  if(r.groups.length){
    UI.hl=new Set();
    for(const g of r.groups){g.forEach(x=>UI.hl.add(cOf(r.z,x).id));render();await beat(430);}
  }
  if(r.kind==='free'){
    r.c.own=p;if(S)R.souk.push(r.c);else R.medina.push({card:r.c,owner:p});
    UI.newId=r.c.id;done();render();await beat(420);UI.newId=null;return;
  }
  const idsAll=new Set(tkCards.map(c=>c.id));
  if(S){
    const plainE=r.taken.filter(x=>x.pile===undefined),pileE=r.taken.filter(x=>x.pile!==undefined);
    await fly([...idsAll,r.c.id],document.querySelector('[data-pile="'+p+'"]'));
    remFrom(R.souk,new Set(plainE.map(c=>c.id)));
    const stolen=pileE.flatMap(e=>R.pile[e.pile].splice(0));
    R.pile[p].push(...stolen,...plainE,r.c);R.pt[p]=R.turn;
    if(stolen.length)pop(p,'+'+stolen.length+' pile');
    UI.hl=new Set();done();UI.bump=p;render();UI.bump=null;
    if(r.missa){addPts(p,'missa',1);await banner('Missa ! +1',p?'bot':'pt');}
    else await beat(250);
    return;
  }
  // Médina : les captures sortent du jeu (sauf paire garée / trio)
  if(r.kind==='ronda'){
    const exit=tkCards.filter(c=>c.id!==r.own.card.id);
    await fly([...exit.map(c=>c.id)],null);
    remFrom(R.medina,idsAll);R.discard.push(...exit);
    R.garee[p].push({v:r.c.v,cards:[r.own.card,r.c]});
    UI.hl=new Set();done();render();
    const g=addPts(p,'ann',2);
    await banner(g<2?'Ronda ! plafond':'Ronda ! +2',p?'bot':'pt');return;
  }
  if(r.kind==='tringa'){
    const pr=R.garee[p][r.gi];
    await fly([...idsAll],null);
    remFrom(R.medina,idsAll);R.discard.push(...tkCards);
    R.garee[p].splice(r.gi,1);
    await fly([r.c.id],document.querySelector('[data-pile="'+p+'"]'));
    R.pile[p].push(...pr.cards,r.c);R.pt[p]=R.turn;
    UI.hl=new Set();done();UI.bump=p;render();UI.bump=null;
    const g=addPts(p,'ann',3);
    await banner(g<3?'Tringa ! plafond':'Tringa ! +3',p?'bot':'pt',900);return;
  }
  // capture défensive en Médina
  await fly([...idsAll,r.c.id],null);
  remFrom(R.medina,idsAll);R.discard.push(...tkCards,r.c);
  UI.hl=new Set();done();render();await beat(300);
}

async function doExchange(f,s){
  const R=G.R,S=f.zone==='S';
  // la carte libre du premier quitte la zone
  const fid=new Set([f.card.id]);
  if(S)remFrom(R.souk,fid);else remFrom(R.medina,fid);
  const pool=[f.card,s.card];
  let last=s.p,pts=1,name='Un';
  render();
  await banner('Un ! +1',s.p?'bot':'ex',800);
  const stages=[{p:f.p,name:'Trois',pts:3},{p:s.p,name:'Cinq',pts:5}];
  for(const st of stages){
    const extra=R.hands[st.p].find(c=>c.v===f.card.v);
    if(!extra||!canEsc(st.p))break;
    let yes;
    if(st.p===0)yes=await promptEscalate(extra,st);
    else yes=botEscalate(S);
    if(!yes)break;
    R.hands[st.p]=R.hands[st.p].filter(c=>c.id!==extra.id);
    pool.push(extra);last=st.p;pts=st.pts;name=st.name;
    let comp=false;
    if(R.reserve.length){R.hands[st.p].push(R.reserve.pop());comp=true;}
    render();
    await banner(name+' ! +'+pts,st.p?'bot':'ex',850);
    if(comp)pop(st.p,'+1 carte');
  }
  addPts(last,'exch',pts);noteCap(last,pool);
  const ids=pool.map(c=>c.id);
  if(S){
    if(f.play)f.play.done=true;if(s.play)s.play.done=true;
    await fly(ids,document.querySelector('[data-pile="'+last+'"]'));
    R.pile[last].push(...pool);R.pt[last]=R.turn;UI.bump=last;
  }else{
    if(f.play)f.play.done=true;if(s.play)s.play.done=true;
    await fly(ids,null);R.discard.push(...pool);
  }
  render();UI.bump=null;
  await banner((last?'Il':'Tu')+' prend l’échange',last?'bot':'ex',650);
  return last;
}

function noteCap(p,cards){
  const R=G.R,k=R.kelma&&R.kelma[p];
  if(!k||R.turn<=k.turn)return;
  if(cards.some(c=>c.v===k.v))k.held=true;
}
function onBoard(card){
  const R=G.R;return R.souk.some(c=>c.id===card.id)||R.medina.some(x=>x.card.id===card.id);
}
function freeTargets(){
  const R=G.R,t=[];
  R.souk.forEach(c=>t.push({card:c,zone:'S',owner:c.own===undefined?null:c.own}));
  R.medina.forEach(x=>t.push({card:x.card,zone:'M',owner:x.owner}));
  return t;
}
function canAoud(p){
  const R=G.R,h=R.hands[p].length;
  if(h<2)return false;
  if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (h-2+comp)+futR>=futT;
}
function pickTarget(T,only){
  return new Promise((res,rej)=>{
    UI.pick={ids:new Set(T.filter(t=>!only||t.card.code===only).map(t=>t.card.id)),res,list:T};
    UI.pickMsg='Rafle : touche une carte libre.';
    UI.rejectP=rej;render();
  });
}
function botKhatfTarget(bi,T){
  let best=null,bv=0;
  for(const t of T){
    let v;
    if(t.zone==='S')v=t.owner===bi?.2:1;
    else v=t.owner===bi?-5:(t.owner===null?.6:1.4);
    v+=Math.random()*.3;
    if(v>bv){bv=v;best=t;}
  }
  return best;
}
async function doKhatf(p,kt){
  const R=G.R,T=freeTargets();
  if(!T.length){await banner('Rafle : rien à prendre','info',700);return;}
  let tgt=null;
  if(R.script&&kt)tgt=T.find(t=>t.card.code===kt)||null;
  if(!tgt&&p===0){
    tgt=await pickTarget(T,null);
    UI.pick=null;UI.pickMsg='';
  }
  if(!tgt)tgt=botKhatfTarget(p,T)||T[0];
  await banner('Rafle !',p?'bot':'ex',600);
  UI.hl=new Set([tgt.card.id]);render();await beat(380);
  const ids=new Set([tgt.card.id]);
  if(tgt.zone==='S'){
    await fly([tgt.card.id],document.querySelector('[data-pile="'+p+'"]'));
    remFrom(R.souk,ids);R.pile[p].push(tgt.card);R.pt[p]=R.turn;UI.bump=p;
  }else{
    await fly([tgt.card.id],null);remFrom(R.medina,ids);R.discard.push(tgt.card);
  }
  UI.hl=new Set();render();UI.bump=null;
  noteCap(p,[tgt.card]);
}

async function resolveTurn(h,b){
  const R=G.R,pk=[h,b];
  const plays=[];
  pk.forEach((x,p)=>x.cards.forEach(c=>{
    R.hands[p]=R.hands[p].filter(y=>y.id!==c.card.id);
    plays.push({p,card:c.card,zone:c.zone,done:false});
  }));
  UI.sel=null;UI.sel2=null;UI.picked=null;
  R.curPlays=plays;
  UI.reveal={plays,flip:false,order:null,active:null,bars:[null,null]};
  // Baroud : paiement de la mèche
  const live=[null,null];
  for(const p of [0,1]){
    const nm=pk[p].bar;if(!nm)continue;
    const cost=BARS[nm].m;
    if(tot(p)>=cost){
      R.bar[p]=R.bar[p].filter(x=>x!==nm);
      if(cost){R.sc[p].meche-=cost;R.pot+=cost;}
      live[p]=nm;UI.reveal.bars[p]={name:nm,x:false};
    }
  }
  render();
  await beat(120);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('#board .flip').forEach(e=>e.classList.add('on'));
    if(UI.reveal)UI.reveal.flip=true;
  }));
  vib(15);
  await banner('Retournez !','wach',650);
  for(const p of [0,1]){
    if(live[p]){
      const cost=BARS[live[p]].m;
      if(cost)pop(p,'−'+cost);
      await banner(live[p]+' !',p?'bot':'ex',700);
    }
  }
  // Contre d'abord
  const qs=[0,1].filter(p=>live[p]==='Contre');
  if(qs.length===2){
    UI.reveal.bars[0].x=UI.reveal.bars[1].x=true;live[0]=live[1]=null;render();
    await banner('Contre × Contre','info',800);
  }else if(qs.length===1){
    const q=qs[0],o=1-q;
    if(live[o]){UI.reveal.bars[o].x=true;const nm=live[o];live[o]=null;render();await banner('Contre ! annule '+nm,q?'bot':'ex',950);}
    else await banner('Contre… dans le vide','info',700);
    live[q]=null;
  }
  // effets immédiats
  for(const p of [0,1]){
    if(live[p]==='Parole'){
      R.kelma[p]={v:pk[p].kv,turn:R.turn,held:false};
      await banner('Parole ! « '+pk[p].kv+' »',p?'bot':'ex',1000);
    }
    if(live[p]==='Présage'){
      if(p===0)await showFal();else await banner('Présage !','bot',600);
    }
  }
  // initiative
  const last=R.turn===R.total;
  const prio=p=>Math.max(...plays.filter(x=>x.p===p).map(x=>x.card.v));
  let zr=[0,1].find(p=>live[p]==='Hâte'),sb=[0,1].find(p=>live[p]==='Patience');
  if(zr!==undefined&&sb!==undefined&&zr!==sb){
    await banner('Hâte × Patience','info',800);zr=sb=undefined;
  }
  let first;
  if(zr!==undefined)first=zr;
  else if(sb!==undefined)first=1-sb;
  else if(last)first=1-R.dealer;
  else{
    const v0=prio(0),v1=prio(1);
    first=v0!==v1?(v0>v1?0:1):1-R.dealer;
  }
  UI.reveal.order={[first]:1,[1-first]:2};
  render();await beat(520);
  // résolutions par créneau
  const fresh=[],lastKind={0:'free',1:'free'};
  for(const p of [first,1-first]){
    for(const m of plays.filter(x=>x.p===p)){
      UI.reveal.active=p;render();
      const f=R.exch?fresh.find(x=>x.p!==p&&x.zone===m.zone&&x.card.v===m.card.v&&onBoard(x.card)):null;
      if(f){
        const w=await doExchange({p:f.p,card:f.card,zone:f.zone,play:f.play},{p,card:m.card,zone:m.zone,play:m});
        fresh.splice(fresh.indexOf(f),1);
        lastKind[w]='exch';if(w!==p)lastKind[p]='free';
        continue;
      }
      const r=calc(p,m.card,m.zone);r.play=m;
      await applyRes(r);
      if(r.kind==='free')fresh.push({p,card:m.card,zone:m.zone,play:m});
      lastKind[p]=r.kind;
    }
    if(live[p]==='Rafle')await doKhatf(p,pk[p].kt);
    if(live[p]==='Encore'&&R.reserve.length){
      R.hands[p].push(R.reserve.pop());render();pop(p,'+1 carte');await beat(350);
    }
  }
  for(const p of [first,1-first]){
    if(live[p]==='Vent')await doChergui(p,pk[p].cz);
  }
  R.curPlays=null;UI.reveal=null;UI.hl=new Set();render();
  if(last&&R.qaa&&lastKind[R.dealer]!=='free'){
    addPts(R.dealer,'qaa',2);
    await banner('Dernière capture ! +2',R.dealer?'bot':'pt',900);
  }
}

/* ---------- IA ---------- */
function botPick(bi){
  const R=G.R,hand=R.hands[bi];
  if(R.script){
    const sc=R.script.bot[R.turn-1];
    const c=hand.find(x=>x.code===sc.code);
    return {card:c,zone:sc.zone};
  }
  const lvl=G.cfg.level;
  const wS=[1.35,.8,1][lvl],wM=[.5,1.4,1][lvl],noise=[.55,.4,.18][lvl];
  const lastT=R.turn===R.total;
  let best=null,bv=-1e9;
  for(const c of hand){
    for(const z of ['S','M']){
      const r=calc(bi,c,z);let v=0;
      const same=hand.filter(h=>h.id!==c.id&&h.v===c.v).length;
      if(z==='S'){
        if(r.kind==='cap'){const n=r.taken.reduce((a,x)=>a+(x.pile!==undefined?R.pile[x.pile].length:1),0);v+=wS*0.9*(n+1);if(r.missa)v+=1.4;}
        else v+=-.25;
        if(lvl===2&&R.turn>=R.total-3&&R.pile[1-bi].length>R.pile[bi].length+2)v+=.35*wS;
      }else{
        if(r.kind==='tringa')v+=(R.cap[bi]>=4?.8:3.6)*wM;
        else if(r.kind==='ronda')v+=(R.cap[bi]>=5?.6:2.6)*wM;
        else if(r.kind==='cap'){v+=.8*wM+.1*r.taken.length;}
        else v+=wM*(same&&R.cap[bi]<6?1:.15)-.6;
        if(r.kind==='free'&&lvl===2&&R.medina.some(x=>x.owner!==bi&&x.card.v===c.v))v-=.2;
      }
      // garder le 3e exemplaire pour la Tringa
      if(R.garee[bi].some(g=>g.v===c.v)&&r.kind!=='tringa')v-=3;
      if(lastT&&R.qaa&&bi===R.dealer&&r.kind!=='free')v+=2;
      v+=(Math.random()*2-1)*noise;
      if(v>bv){bv=v;best={card:c,zone:z};}
    }
  }
  return best;
}
function botBaroud(bi,pick){
  const R=G.R,hand=R.hands[bi];
  const base={cards:[{card:pick.card,zone:pick.zone}],bar:null};
  if(!R.baroud||!R.bar[bi].length)return base;
  if(R.script){
    const e=R.script.bb[R.turn-1]||{};
    return e.bar?{...base,bar:e.bar,kv:e.kv,kt:e.kt,cz:e.cz}:base;
  }
  const lvl=G.cfg.level,k=[.4,.65,.95][lvl],last=R.turn===R.total,sc=tot(bi);
  for(const n of shuffle(R.bar[bi].slice())){
    const m=BARS[n].m;if(sc<m)continue;
    if(n==='Parole'&&!last&&R.turn<R.total-1){
      let best=null,bc=0;
      for(const v of SEQ){
        const c=hand.filter(x=>x.v===v&&x.id!==pick.card.id).length+R.souk.filter(x=>x.v===v).length+R.medina.filter(x=>x.card.v===v).length;
        if(c>bc){bc=c;best=v;}
      }
      if(best&&bc>=2&&Math.random()<.8*k+.1)return {...base,bar:'Parole',kv:best};
    }
    if(n==='Contre'&&R.bar[0].length&&Math.random()<.2*k)return {...base,bar:'Contre'};
    if(n==='Hâte'){const r=calc(bi,pick.card,pick.zone);if(r.kind!=='free'&&Math.random()<.45*k)return {...base,bar:'Hâte'};}
    if(n==='Patience'){const r=calc(bi,pick.card,pick.zone);if(r.kind==='free'&&Math.random()<.3*k)return {...base,bar:'Patience'};}
    if(n==='Rafle'&&sc>=m+2&&freeTargets().length&&Math.random()<.5*k)return {...base,bar:'Rafle'};
    if(n==='Encore'&&sc>=m+1&&canAoud(bi)&&R.cap[bi]<5){
      let pair=null;
      for(const a of hand)for(const c of hand)if(!pair&&a.id<c.id&&a.v===c.v)pair=[a,c];
      if(pair&&Math.random()<.85*k)return {cards:[{card:pair[0],zone:'M'},{card:pair[1],zone:'M'}],bar:'Encore'};
    }
    if(n==='Présage'&&Math.random()<.12*k)return {...base,bar:'Présage'};
    if(n==='Vent'&&!last&&sc>=m+2&&R.medina.some(x=>x.owner===1-bi)&&Math.random()<.4*k)return {...base,bar:'Vent'};
  }
  return base;
}

  const pr=[.7,.85,1][G.cfg.level];
  return Math.random()<pr;
}

  UI.phase='busy';render();

async function runRound(){
  const R=G.R;
  for(R.turn=1;R.turn<=R.total;R.turn++){await turn();}
  UI.phase='busy';
  if(R.baroud){
    for(const p of [0,1]){
      const k=R.kelma[p];if(!k)continue;
      if(k.held){addPts(p,'kelma',1);await banner('Parole tenue ! +1',p?'bot':'pt',900);}
      else{addPts(1-p,'kelma',2);await banner('Parole rompue ! +2',p?'pt':'bot',900);}
    }
  }
  const a=R.pile[0].length,b=R.pile[1].length;
  if(R.moul){
    render();
    await beat(300);
    if(a>b){addPts(0,'moul',R.moul);await banner('Moul Souk ! +'+R.moul,'pt',1000);}
    else if(b>a){addPts(1,'moul',R.moul);await banner('Moul Souk ! +'+R.moul,'bot',1000);}
    else await banner('Moul Souk : égalité','info',800);
  }
  if(R.baroud&&R.pot>0){
    const t0=tot(0),t1=tot(1);
    if(t0!==t1){const w=t0>t1?0:1;addPts(w,'pot',R.pot);await banner('Poudrière ! +'+R.pot,w?'bot':'pt',1000);}
    else{if(G.match)G.match.potCarry=R.pot;await banner('Poudre mouillée','info',900);}
  }
  render();await beat(300);
  await roundSummary();
}
async function safe(fn){
  try{await fn();}catch(e){if(e!==ABORT)console.error(e);}
}

const FMT={
  cafe:{n:'Café',t:6,ref:[3,5],moul:3,rounds:1,tag:'Coup du Café · 6 tours · 1 manche'},
  light:{n:'Light',t:8,ref:[3,5,7],moul:4,rounds:2,tag:'Light · 8 tours · Bo2'},
  std:{n:'Standard',t:12,ref:[3,5,7,9,11],moul:5,rounds:2,tag:'Standard · 12 tours · Bo2'},
  kbira:{n:'Grande',t:14,ref:[3,5,7,9,11],moul:5,rounds:2,tag:'Grande · 14 tours · Bo2'}
};
function stdCfg(dealer){
  const F=FMT[G.cfg.fmt];
  return {total:F.t,refresh:F.ref,exch:G.cfg.exch,qaa:G.cfg.qaa,moul:F.moul,dealer,makla:G.cfg.makla,baroud:G.cfg.baroud};
}
function startMatch(){
  G.tok++;G.tuto=null;
  G.match={round:1,rounds:FMT[G.cfg.fmt].rounds,dealer:Math.random()<.5?0:1,hist:[],tie:false};
  showGame();
  safe(playRound);
}
async function playRound(){
  const m=G.match;
  G.R=newRound({...stdCfg(m.dealer),pot:m.potCarry||0});m.potCarry=0;
  UI.sel=null;UI.reveal=null;UI.phase='busy';render();
  await banner(m.dealer===0?'Tu donnes':BOTS[G.cfg.level].n+' donne','info',900);
  await runRound();
}
function tableRows(){
  const R=G.R,s=R.sc,rows=[];
  if(R.baroud)rows.push(['Départ','base']);
  rows.push(['Annonces','ann'],['Missa','missa']);
  if(R.exch)rows.push(['Échanges','exch']);
  if(R.qaa)rows.push(['Dernière capture','qaa']);
  if(R.baroud)rows.push(['Mèches','meche'],['Parole','kelma']);
  if(R.moul)rows.push(['Moul Souk','moul']);
  if(R.baroud)rows.push(['Poudrière','pot']);
  return rows.map(([l,k])=>({l,k,a:s[0][k],b:s[1][k]}));
}
async function roundSummary(){
  const R=G.R,m=G.match;
  if(G.tuto)return lessonEnd();
  const t0=tot(0),t1=tot(1);
  m.hist.push([t0,t1]);
  const cum=m.hist.reduce((a,h)=>[a[0]+h[0],a[1]+h[1]],[0,0]);
  const over=m.round>=m.rounds&&cum[0]!==cum[1]&&!(m.tie&&false);
  const isLast=m.round>=m.rounds;
  let rowsHTML=tableRows().map(r=>`<tr class="fade"><td>${r.l}${r.k==='moul'?'<small>pile '+R.pile[0].length+' – '+R.pile[1].length+'</small>':''}</td><td>${r.a||'–'}</td><td>${r.b||'–'}</td></tr>`).join('');
  rowsHTML+=`<tr class="tot"><td>Manche ${m.round}${m.tie?' · départage':''}</td><td>${t0}</td><td>${t1}</td></tr>`;
  let btn,act;
  if(!isLast){btn='Manche '+(m.round+1);act='next';}
  else if(cum[0]===cum[1]){btn='Départage';act='tie';}
  else{btn='Résultat';act='end';}
  openSheet(`<h2>Fin de manche</h2><table class="sum"><tr><th></th><th>Toi</th><th>${BOTS[G.cfg.level].n}</th></tr>${rowsHTML}</table><button class="btn pri" id="sNext" style="width:100%;background:var(--saf);color:#140908">${btn}</button>`);
  const t=G.tok;
  await new Promise(res=>{$('#sNext').onclick=res;});
  if(t!==G.tok)throw ABORT;
  closeSheet();
  if(act==='next'){m.round++;m.dealer=1-m.dealer;m.tie=false;await playRound();}
  else if(act==='tie'){m.round++;m.dealer=1-m.dealer;m.tie=true;m.rounds=m.round;
    // la manche de départage est jouée seule : rondes cumulées déjà prises en compte
    await playRound();}
  else{matchEnd(cum);}
}
function matchEnd(cum){
  const m=G.match;
  const w=cum[0]>cum[1]?'Victoire':cum[0]<cum[1]?'Défaite':'Égalité';
  const lines=m.hist.map((h,i)=>`<tr><td>Manche ${i+1}</td><td>${h[0]}</td><td>${h[1]}</td></tr>`).join('');
  openSheet(`<div class="big" style="color:${w==='Victoire'?'var(--saf-d)':'var(--fg)'}">${w}</div><table class="sum"><tr><th></th><th>Toi</th><th>${BOTS[G.cfg.level].n}</th></tr>${lines}<tr class="tot"><td>Total</td><td>${cum[0]}</td><td>${cum[1]}</td></tr></table>
    <div class="row"><button class="btn" id="sMenu" style="flex:1;background:var(--panel2);color:var(--fg)">Menu</button><button class="btn pri" id="sAgain" style="flex:1.6;background:var(--saf);color:#140908">Rejouer</button></div>`,true);
  $('#sMenu').onclick=()=>{closeSheet();goHome();};
  $('#sAgain').onclick=()=>{closeSheet();startMatch();};
}

function zoneHTML(z){
  const R=G.R,S=z==='S',arr=S?R.souk:R.medina;
  const cards=arr.map(x=>{
    const c=cOf(z,x);
    const cls='zc'+(UI.hl.has(c.id)?' hl':'')+(UI.newId===c.id?' new':'')+(UI.pick?(UI.pick.ids.has(c.id)?' pickable':' dim'):'');
    return `<div class="card s${c.s} ${cls}" data-cid="${c.id}">${cardInner(c)}${(S||x.owner==null)?'':'<span class="tok own'+x.owner+'"></span>'}</div>`;
  }).join('');
  let ptiles='';
  if(S&&R.makla)for(const q of [0,1]){
    const pl=R.pile[q];if(!pl.length)continue;const t=pl[pl.length-1];
    ptiles+=`<div class="card s${t.s} zc ptile own${q}${R.pt[q]>=R.turn&&UI.phase!=='select'?' cool':''}${UI.hl.has(t.id)?' hl':''}" data-cid="${t.id}">${cardInner(t)}<span class="pbadge">${pl.length}</span><span class="tok own${q}"></span></div>`;
  }
  let corner='';

    corner=`<div class="corner"><span class="lbl">Ronda</span>${gp}</div>`;
  }
  // emplacements
  let mine='',opp='';
  const rv=UI.reveal;
  let placed=false;
  if(rv){
    const ord=rv.order,seen=[false,false];
    rv.plays.forEach(pl=>{
      let bb='';
      if(!seen[pl.p]){seen[pl.p]=true;const b=rv.bars[pl.p];if(b&&rv.flip)bb='<span class="bb'+(b.x?' x':'')+'">'+BARS[b.name].ar+'</span>';}
      if(pl.zone!==z||pl.done)return;
      const f=flipHTML(pl.card,rv.flip,ord&&ord[pl.p],rv.active===pl.p,bb);
      if(pl.p===0)mine+=f;else opp+=f;
    });
  }else if(UI.phase==='select'){
    [[1,UI.sel],[2,UI.sel2]].forEach(([i,s])=>{
      if(s&&s.zone===z){
        placed=true;

      }
    });
  }
  const mineCls='slot mine'+(placed?' placed':'')+(UI.phase==='select'&&!placed?' target':'');
  const ready=UI.phase==='select'&&(UI.picked||UI.dragOver)&&(!UI.sel||(UI.bar==='Encore'&&!UI.sel2))?' ready':'';
  const over=UI.dragOver===z?' over':'';
  const hint=UI.allow&&UI.allow.zone===z&&UI.phase==='select'?' hint':'';
  return `<div class="zone ${S?'souk':'med'}${ready}${over}${hint}" data-zone="${z}" tabindex="0" role="button" aria-label="${S?'Souk':'Médina'}">
    <div class="zh"><span>${S?'Souk':'Médina'}</span><span class="cnt">${arr.length}</span></div>
    <div class="zfree ${arr.length+(ptiles?2:0)>8?'dense':''}">${cards}${ptiles}</div>${corner}
    <div class="slots"><div class="slot opp">${opp}</div><div class="${mineCls}">${mine}</div></div></div>`;
}
function readySel(){

function trayHTML(){

async function banner(txt,kind,ms){

function pop(p,text){
  const sc=document.querySelector('[data-score="'+p+'"]');if(!sc)return;
  const r=sc.getBoundingClientRect(),a=$('#app').getBoundingClientRect();
  const d=document.createElement('div');d.className='pop'+(p?' bot':'');d.textContent=text;
  d.style.left=(r.left-a.left-(text.length>3?30:0))+'px';d.style.top=(r.top-a.top-4)+'px';
  $('#fx').appendChild(d);setTimeout(()=>d.remove(),1200);
  sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump');
}
function fly(ids,target){
  const fx=$('#fx'),ar=$('#app').getBoundingClientRect(),tr=target?target.getBoundingClientRect():null;
  const ps=[];
  ids.forEach(id=>{
    const el=document.querySelector('[data-cid="'+id+'"]');if(!el)return;
    const r=el.getBoundingClientRect();
    const g=el.cloneNode(true);
    g.removeAttribute('data-cid');
    Object.assign(g.style,{position:'absolute',left:(r.left-ar.left)+'px',top:(r.top-ar.top)+'px',width:r.width+'px',height:r.height+'px',margin:'0',pointerEvents:'none',animation:'none'});
    g.style.setProperty('--cw',r.width+'px');g.style.setProperty('--ch',r.height+'px');
    g.classList.remove('hl');
    fx.appendChild(g);el.style.visibility='hidden';
    const dx=tr?(tr.left+tr.width/2)-(r.left+r.width/2):0,dy=tr?(tr.top+tr.height/2)-(r.top+r.height/2):-16;
    const kf=[{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+(tr?.35:.5)+')',opacity:tr?.85:0}];
    let a;
    try{a=g.animate(kf,{duration:FAST?120:480,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});ps.push(a.finished.catch(()=>{}).then(()=>g.remove()));}
    catch(e){g.remove();}
  });
  return Promise.all(ps);
}

function tryPlace(cid,zone){
  const R=G.R;if(!R||UI.phase!=='select')return;
  const c=R.hands[0].find(x=>x.id===cid);if(!c)return;
  const A=UI.allow,second=UI.bar==='Encore'&&!!UI.sel;
  if(A){
    const ec=second?A.c2:A.code,ez=second?A.z2:A.zone;
    if(c.code!==ec||zone!==ez){UI.picked=null;render();nudge();return;}
  }
  if(second)UI.sel2={card:c,zone};else UI.sel={card:c,zone};
  UI.picked=null;UI.dragOver=null;render();vib(10);
}
function toggleBar(n){
  if(UI.phase!=='select')return;
  const R=G.R,B=BARS[n],A=UI.allow,last=R.turn===R.total;
  const dis=tot(0)<B.m||(last&&(n==='Parole'||n==='Vent'))||(n==='Encore'&&!canAoud(0))||!!(A&&A.bar!==n);
  if(dis){nudge();return;}
  if(UI.bar===n){
    if(n==='Parole'){pickValue();return;}
    UI.bar=null;UI.kv=null;UI.sel2=null;render();return;
  }
  UI.bar=n;UI.kv=null;UI.sel2=null;render();
  if(n==='Parole')pickValue();
}

function Hhtml(round){

/* =====================================================================

   ===================================================================== */
(function(){
  const KEY='wach_pace',M={fast:{k:.7,pre:260,post:380,read:350,lab:'Rapide'},normal:{k:1.3,pre:800,post:1100,read:1300,lab:'Normal'},step:{k:1.3,pre:900,post:0,read:0,lab:'Pas à pas'}};
  let mode='normal';try{const v=localStorage.getItem(KEY);if(M[v])mode=v;}catch(e){}
  let waiter=null,expl=true;
  try{if(localStorage.getItem('wach_expl')==='0')expl=false;}catch(e){}
  const PACE=window.PACE={
    get mode(){return mode;},
    set(m){mode=M[m]?m:'normal';try{localStorage.setItem(KEY,mode);}catch(e){}},
    get expl(){return expl;},
    setExpl(v){expl=!!v;try{localStorage.setItem('wach_expl',expl?'1':'0');}catch(e){}if(!expl)hide();},
    labels:{fast:'Rapide',normal:'Normal',step:'Pas à pas'},
    go(){if(waiter){const w=waiter;waiter=null;w();}},
    cancel(){PACE.go();hide();}
  };
  const _beat=beat;
  beat=function(ms){return _beat(Math.round(ms*M[mode].k));};
  const col=p=>(typeof AD!=='undefined'&&AD.col)?AD.col(p):(typeof colOf==='function'?colOf(p):p);
  function box(){
    let e=document.getElementById('expl');
    if(!e){
      e=document.createElement('div');e.id='expl';
      e.innerHTML='<div class="xo"></div><div class="xs"></div><button class="btn pri exn" id="exNext">Suivant ▶</button>';
      (document.getElementById('app')||document.body).appendChild(e);
      e.querySelector('#exNext').onclick=()=>PACE.go();
    }
    return e;
  }
  function hide(){const e=document.getElementById('expl');if(e){e.classList.remove('on','wait','min');}}
  async function wait(){
    const e=box();e.classList.add('wait');
    await new Promise(r=>{waiter=r;});
    e.classList.remove('wait');
    await _beat(1);
  }
  const off=()=>(typeof G==='undefined'||!G.R||G.tuto);
  let cur=null;
  /* ---------- éléments visuels ---------- */
  const cof=(r,x)=>x.pile!==undefined?x.card:cOf(r.z,x);
  function mini(c,cls,d){return '<div class="card s'+c.s+' mini'+(cls?' '+cls:'')+'" style="--d:'+(d||0)+'ms">'+cardInner(c)+'</div>';}
  function pill(p,rk){return '<span class="xp own'+col(p)+'">'+(rk?'<i>'+rk+'</i>':'')+Hesc(Hn(p))+'</span>';}
  function zone(z){return '<span class="xz '+(z==='S'?'s':'m')+'">'+(z==='S'?'Souk':'Médina')+'</span>';}
  const arrow='<span class="xarr"><i></i><i></i><i></i></span>';
  const eq='<span class="xeq">=</span>';
  function pileIc(n){return '<span class="xpile"><b></b><b></b><b></b><em>+'+n+'</em></span>';}
  const outIc='<span class="xout"><b></b><u>✕</u><small>hors jeu</small></span>';
  function ptsHTML(rec){
    if(!rec||!rec.pts||!rec.pts.length)return '';
    return rec.pts.map(t=>{const n=String(t).split(' ')[0];return /^[+-]\d/.test(n)?'<span class="xpts">'+Hesc(n)+'</span>':'';}).join('');
  }
  /* bandeau d’ordre : cartes dans l’ordre de résolution, « = » si valeurs égales, D = Donneur */
  function orderHTML(done,now,big){
    const rv=UI.reveal;if(!rv||!rv.order)return '';
    const ps=Object.keys(rv.order).map(Number).sort((a,b)=>rv.order[a]-rv.order[b]);
    const val={};ps.forEach(p=>{val[p]=Math.max(...rv.plays.filter(x=>x.p===p).map(x=>x.card.v));});
    let h='';
    ps.forEach((p,i)=>{
      if(i){const q=ps[i-1],b=rv.bars&&rv.bars[q],b2=rv.bars&&rv.bars[p],hasEff=(b&&!b.x&&(b.name==='Hâte'||b.name==='Patience'))||(b2&&!b2.x&&(b2.name==='Hâte'||b2.name==='Patience'));
        h+=(!hasEff&&val[q]===val[p])?'<span class="xeq">=</span>':'<span class="xgt">›</span>';}
      const cs=rv.plays.filter(x=>x.p===p).map(x=>mini(x.card,'',big?i*110:0)).join('');
      const bar=rv.bars&&rv.bars[p],ef=(bar&&!bar.x&&(bar.name==='Hâte'||bar.name==='Patience'))?'<u class="xf">'+bar.name+'</u>':'';
      h+='<span class="xo1 own'+col(p)+(now===p?' cur':'')+(done.has(p)?' done':'')+'"><b class="xrk">'+rv.order[p]+'</b>'+(G.R.dealer===p?'<u class="xd">D</u>':'')+cs+'<em>'+Hesc(Hn(p))+'</em>'+ef+'</span>';
    });
    return h;
  }
  function actionHTML(r,rk){
    return '<div class="xr a own'+col(r.p)+'">'+pill(r.p,rk)+mini(r.c,'play',0)+arrow+zone(r.z)+'</div>';
  }
  function resultHTML(r){
    const g=r.groups||[];let h='';
    if(r.kind==='free'){
      h=mini(r.c,'stay',0)+(r.z==='M'?'<span class="xtok own'+col(r.p)+'"></span>':'')+'<span class="xl">libre</span>';
    }else if(r.kind==='ronda'){
      h=mini(r.own.card,'',0)+eq+mini(r.c,'',120)+'<span class="xl">Ronda</span>';
    }else if(r.kind==='tringa'){
      const pr=G.R.garee[r.p][r.gi];
      h=pr.cards.map((c,i)=>mini(c,'',i*100)).join('')+mini(r.c,'',200)+'<span class="xl">Tringa</span>';
    }else{
      g.forEach((grp,i)=>{
        h+=i===0?eq:'<span class="xch">chaîne</span>';
        h+=grp.map((x,j)=>mini(cof(r,x),i?'chain':'same',(i*2+j)*110)).join('');
      });
      h+=arrow+(r.z==='S'?pileIc(1+r.taken.length):outIc);
      if(r.missa)h+='<span class="xl gold">Missa</span>';
    }
    return '<div class="xr b own'+col(r.p)+'">'+h+'</div>';
  }
  PACE.dbg={resultHTML,actionHTML};
  const _ap=applyRes;
  applyRes=async function(r){
    if(off()||!UI.reveal)return _ap(r);
    const e=box(),m=M[mode],rv=UI.reveal,ex=expl,pre=ex?m.pre:0,post=ex?m.post:0,read=ex?m.read:0;
    const xo=e.querySelector('.xo'),xs=e.querySelector('.xs');
    const minWait=async()=>{if(ex){await wait();return;}e.classList.add('on','min');await wait();e.classList.remove('on','min');};
    if(!cur||cur.turn!==G.R.turn||cur.round!==(G.match?G.match.round:0)){
      cur={turn:G.R.turn,round:G.match?G.match.round:0,done:new Set()};
      if(ex){
        e.classList.add('on');xo.className='xo big';xo.innerHTML=orderHTML(cur.done,null,true);
        xs.innerHTML='<div class="xcap">Ordre de résolution</div>';
      }
      if(mode==='step')await minWait();else if(read)await beat(read);
    }
    let res='';
    if(ex){
      e.classList.add('on');
      xo.className='xo';xo.innerHTML=orderHTML(cur.done,r.p,false);
      xs.innerHTML=actionHTML(r,rv.order&&rv.order[r.p])+'<div class="xr b"></div>';
      try{res=resultHTML(r);}catch(x){res='';}
    }
    if(pre)await beat(pre);
    const out=await _ap(r);
    const rec=HL.cur&&HL.cur.res[HL.cur.res.length-1];
    cur.done.add(r.p);
    if(ex){
      const b=xs.querySelector('.xr.b');
      if(b){b.outerHTML=res.replace('</div>',ptsHTML(rec)+'</div>');}
      xo.innerHTML=orderHTML(cur.done,null,false);
    }
    if(mode==='step')await minWait();else if(post)await beat(post);
    return out;
  };
  const _rt=resolveTurn;
  resolveTurn=async function(...a){
    try{return await _rt(...a);}finally{cur=null;hide();}
  };
  ['goHome','startMatch','startLesson'].forEach(n=>{
    if(typeof window[n]!=='function')return;
    const o=window[n];window[n]=function(){PACE.cancel();return o.apply(this,arguments);};
  });
})();

/* =====================================================================
   MANUEL DU JOUEUR — accessible depuis l'accueil (et le menu pause), un onglet par module
   ===================================================================== */
const MAN_TABS=[
 {id:'base',t:'Bases',h:`
<h3>Le jeu en 30 secondes</h3>
<p>À chaque tour, chaque joueur pose une carte en secret sur l’une des deux zones du plateau : le <b>Souk</b> (le volume) ou la <b>Médina</b> (les cris). Les cartes sont retournées ensemble. La plus haute valeur résout en premier. Une carte de même valeur qu’une carte de la zone la capture. En fin de manche, la plus grosse pile gagne le jeton <b>Moul Souk</b>.</p>
<h3>Matériel</h3>
<ul><li><b>40 cartes du jeu français</b> : As, 2 à 7, Valet, Dame, Roi. On retire les 8, 9 et 10 : ils restent écartés, sauf en Baroud où les 8 et les 9 deviennent les cartes d’action.</li>
<li>Un plateau : Souk, Médina, coin Ronda, zone neutre.</li>
<li>Jetons de 1 point (pois chiches) et <b>bâtonnets</b> qui valent 5 points.</li>
<li>14 jetons de couleur par joueur, un jeton Moul Souk (+3, +4 ou +5), un jeton de Donneur, un sablier de 15 s (facultatif).</li></ul>
<h3>Mise en place</h3>
<ol><li><b>Le Donneur.</b> Chacun coupe le paquet : la carte la plus haute désigne le Donneur. Égalité : on recommence.</li>
<li><b>La donne.</b> Le Donneur mélange et donne 4 cartes à chacun, face cachée.</li>
<li><b>La table.</b> Il pose des cartes face visible, toutes au Souk (4 à deux joueurs, 6 à trois ou quatre). La Médina est vide.</li>
<li><b>Le paquet du Donneur.</b> Il met de côté les cartes des distributions. Tout le reste est <b>écarté</b>, face cachée, sans être regardé.</li>
<li><b>La Réserve</b> (modules Échanges et Baroud). Il prélève 5 cartes sur les écartées (1 seule à quatre joueurs) et les pose à part, face cachée, près de lui. Voir l’onglet « Échanges ».</li>
<li><b>Les jetons.</b> Banque au centre, jeton Moul Souk au centre, jetons de couleur devant chacun. Tout le monde part de zéro.</li></ol>
<h3>Un tour</h3>
<ol><li><b>Sélection.</b> Je choisis ma carte en secret.</li>
<li><b>Pose en zone neutre.</b> « 3, 2, 1 » : je pose ma carte, face cachée, sur la zone neutre. Elle est alors <b>scellée</b>.</li>
<li><b>Glissement.</b> Quand tout le monde a posé, je glisse ma carte sur la zone de mon choix.</li>
<li><b>Révélation.</b> On annonce « Retournez ! » et chacun retourne sa carte.</li>
<li><b>Résolution.</b> Dans l’ordre d’initiative.</li>
<li><b>Fin de tour.</b> On passe au suivant.</li></ol>
<div class="note"><b>Règle de la zone neutre.</b> À chaque tour, <b>tous les joueurs, sans exception, doivent d’abord poser leur carte sur la zone neutre</b> : la carte est scellée et <b>ne revient jamais en main</b>. Ce n’est qu’ensuite, une fois toutes les cartes posées, que chacun peut la glisser sur la zone de son choix. Personne ne glisse avant que tout le monde ait posé.</div>
<div class="note"><b>Dans l’app.</b> Touche une carte, puis « Poser » (ou glisse-la sur le plateau). Les autres joueurs posent aussi, le compte à rebours « 3, 2, 1 » passe, puis tu glisses ta carte scellée vers le Souk ou la Médina. Tout le monde se révèle d’un coup.</div>
<h3>Qui résout en premier ? L’ordre d’initiative</h3>
<ol><li><b>Chaque zone se résout de son côté.</b> Dans une zone, la carte de plus haute valeur passe en premier : <b>Roi · Dame · Valet · 7 · 6 · 5 · 4 · 3 · 2 · As</b>.</li>
<li><b>À valeur égale</b>, le Donneur résout en dernier (à plusieurs, l’ordre complet est dans l’onglet « À plusieurs »).</li>
<li><b>Au dernier tour</b>, le Donneur résout toujours en dernier, <b>quelle que soit sa carte, même sans aucune égalité</b>.</li></ol>
<p>Une carte résolue modifie la zone : celle qui suit joue sur la zone mise à jour.</p>
<h3>Capturer</h3>
<p><b>Capture directe, obligatoire.</b> Si votre carte a la même valeur qu’une ou plusieurs cartes de sa zone, vous ramassez toutes les cartes de cette valeur.</p>
<p><b>Chaîne, automatique.</b> Vous ramassez aussi les cartes des valeurs immédiatement supérieures dans la suite <b>As → 2 → 3 → 4 → 5 → 6 → 7 → Valet → Dame → Roi</b>, sur 2 marches au plus. Jamais vers le bas. Un trou dans la suite arrête la chaîne.</p>
<p>Au Souk, les cartes ramassées vont dans votre pile. En Médina, elles sortent du jeu (sauf le trio d’une Tringa). Sans capture, votre carte reste face visible dans sa zone et devient capturable par tous.</p>
<h3>Souk et Médina</h3>
<table><tr><th></th><th>Souk</th><th>Médina</th></tr>
<tr><td>On y cherche</td><td>remplir sa pile</td><td>annoncer</td></tr>
<tr><td>Une capture</td><td>va dans votre pile</td><td>sort du jeu</td></tr>
<tr><td>2 cartes identiques</td><td>capture ordinaire</td><td>Ronda +2</td></tr>
<tr><td>3 cartes identiques</td><td>capture ordinaire</td><td>Tringa +3</td></tr>
<tr><td>Bonus de zone</td><td>Missa +1 (vider le Souk)</td><td>—</td></tr>
<tr><td>Plafond</td><td>—</td><td>6 points d’annonces par joueur et par manche</td></tr>
<tr><td>Jetons de couleur</td><td>inutiles</td><td>sur toutes vos cartes libres</td></tr></table>
<h3>Ronda et Tringa (Médina seulement)</h3>
<p><b>Ronda +2.</b> Votre 1ʳᵉ carte reste en Médina sous votre jeton. À un tour ultérieur, votre 2ᵉ carte identique, jouée en Médina, la capture : « Ronda ! » La paire se gare au coin Ronda. Si l’adversaire capture votre carte libre avant, votre Ronda est perdue.</p>
<p><b>Tringa +3.</b> Votre 3ᵉ carte identique, jouée en Médina, avec la paire garée : « Tringa ! » Le trio rejoint votre pile.</p>
<p><b>Plafond.</b> 6 points d’annonces au plus par joueur et par manche. Au-delà, la Tringa ne rapporte rien mais le trio est quand même ramassé.</p>
<h3>Jeu défensif en Médina</h3>
<p>Capturer la carte libre d’un adversaire en Médina ne rapporte rien, mais lui coûte sa Ronda en préparation.</p>
<div class="note">Vous avez une Ronda en place et un autre joueur a déjà posé une carte de même valeur en Médina : votre 4ᵉ carte la capture. <b>Les deux cartes sortent du jeu et la Tringa n’est pas complétée</b> ; votre paire reste au coin Ronda. Avec le module Échanges, c’est vrai aussi quand cette carte est jouée au même tour : l’échange a lieu et les deux cartes sortent.</div>
<h3>Distributions du Donneur</h3>
<p>Aux tours indiqués par le format, le Donneur donne 2 cartes à chaque joueur, prises dans son paquet. Personne ne se sert seul.</p>
<h3>Fin de manche : le décompte</h3>
<p><b>Déjà acquis.</b> Rondas, Tringas et Missas sont déjà dans vos jetons. <b>Dernière capture</b> (module). <b>Moul Souk</b> : la plus grosse pile prend le jeton et marque sa valeur ; égalité au sommet : personne.</p>
<p><b>Lecture d’un score :</b> bâtonnets × 5 + jetons. Dès que vous avez 5 jetons devant vous, échangez-les contre un bâtonnet. On ne retire jamais de points.</p>
<h3>Gagner</h3>
<p>Une manche par joueur : 2 manches à deux, 3 à trois, 4 à quatre. Le Donneur tourne : chacun donne une fois. Le score cumulé le plus élevé gagne. Égalité parfaite : une manche de départage.</p>`},
 {id:'formats',t:'Formats',h:`
<h3>Choisir son format</h3>
<p>Tous les formats partagent les mêmes règles : on ne change que la durée, les distributions et le jeton Moul Souk.</p>
<table><tr><th>Format</th><th>Tours</th><th>Distributions</th><th>Moul Souk</th><th>Match</th></tr>
<tr><td>Coup du Café</td><td>6</td><td>tours 3, 5</td><td>+3</td><td>1 manche</td></tr>
<tr><td>Light</td><td>8</td><td>tours 3, 5, 7</td><td>+4</td><td>2 manches</td></tr>
<tr><td>Standard</td><td>12</td><td>tours 3, 5, 7, 9, 11</td><td>+5</td><td>2 manches</td></tr>
<tr><td>Grande</td><td>14</td><td>tours 3, 5, 7, 9, 11</td><td>+5</td><td>2 manches</td></tr></table>
<div class="note"><b>Première partie ?</b> Joue Light, sans module. Les modules s’ajoutent ensuite, un seul à la fois.</div>
<h3>Grande (14 tours)</h3>
<p>On joue toutes ses cartes : les mains finissent vides. Votre dernière carte est un secret à planifier. Avec Échanges, on ne peut surenchérir que si l’on garde assez de cartes pour les tours restants.</p>
<h3>Plusieurs joueurs</h3>
<p>À trois ou à quatre : 6 tours, distributions aux tours 3 et 5, jeton Moul Souk +3 (en 2 contre 2 : +4). Voir l’onglet « À plusieurs ».</p>`},
 {id:'qaa',t:'Dernière capture',h:`
<h3>Dernière capture : le dernier mot du Donneur</h3>
<p>Au dernier tour, si la carte du Donneur <b>capture</b>, il marque <b>+2</b>.</p>
<ul><li>Le Donneur résout toujours en dernier au dernier tour, quelle que soit sa carte : il choisit sa zone en sachant ce qu’il reste.</li>
<li>Compte comme capture : une capture directe ou en chaîne, une Ronda, une Tringa, ou une enchère d’échange gagnée par sa carte.</li>
<li>Une carte qui reste libre ne rapporte rien.</li>
<li>Avec le Baroud, la Dernière capture se juge sur la dernière carte résolue du Donneur.</li></ul>
<div class="note">Les +2 sont ajoutés au décompte de fin de manche, avant le Moul Souk. Ils ne sont pas soumis au plafond de 6 points.</div>`},
 {id:'echanges',t:'Échanges',h:`
<h3>Un duel d’enchères</h3>
<p>Quand deux joueurs révèlent la <b>même valeur dans la même zone</b> et que la <b>première carte reste libre</b> (elle n’a rien capturé, pas même par Ronda), un échange s’ouvre au lieu de la capture ordinaire.</p>
<table><tr><th>Cri</th><th>Cartes</th><th>Points</th></tr>
<tr><td>Un</td><td>la 2ᵉ carte posée</td><td>+1</td></tr>
<tr><td>Trois</td><td>une 3ᵉ carte identique</td><td>+3</td></tr>
<tr><td>Cinq</td><td>une 4ᵉ carte, la dernière</td><td>+5</td></tr></table>
<ul><li>Le deuxième résolveur crie <b>Un</b>. Le premier peut alors <b>abattre</b> de sa main une 3ᵉ carte identique (<b>Trois</b>) ; le deuxième peut répondre avec la 4ᵉ (<b>Cinq</b>).</li>
<li>Le dernier mot l’emporte : seuls ses points comptent, et il ramasse toutes les cartes de l’échange.</li>
<li>Au Souk, ces cartes vont dans sa pile. En Médina, elles sortent du jeu.</li>
<li>Les points d’échange sont hors plafond. Les cartes d’un échange ne font jamais de Ronda ni de Tringa.</li></ul>
<div class="note"><b>Dans l’app.</b> Une invite de 8 secondes te propose de surenchérir quand tu peux abattre une carte.</div>
<h3>La Réserve</h3>
<p>Le module ajoute une pile à la mise en place : la <b>Réserve</b>. Elle ne sert qu’à <b>compenser les cartes abattues depuis la main</b>.</p>
<ul><li><b>Combien.</b> 5 cartes, prélevées sur les écartées avant le début de la manche. <b>1 seule carte à quatre joueurs et en 2 contre 2</b>, où la pioche ne laisse rien de plus.</li>
<li><b>Où.</b> À part, face cachée, près du Donneur. Personne ne la regarde.</li>
<li><b>Comment.</b> Chaque carte abattue (Trois ou Cinq) donne droit à <b>1 carte de la Réserve</b>, que <b>le Donneur remet immédiatement</b> : on ne se sert jamais soi-même.</li>
<li><b>Réserve vide.</b> La carte de compensation est perdue, mais les points et les cartes de l’échange sont conservés.</li>
<li><b>Jamais le paquet.</b> On ne compense jamais depuis le paquet du Donneur : les deux piles ne se mélangent pas.</li>
<li><b>Partagée avec le Baroud.</b> La Réserve est unique : le Baroud met toujours en place la sienne (5 cartes) pour compenser Encore. Elle est distincte de la poudre, qui est une réserve de jetons.</li></ul>
<h3>Cas particuliers</h3>
<ul><li><b>Ronda en place.</b> Si tu as une paire garée et qu’un adversaire joue la même valeur au même tour, l’échange a lieu : ta carte compte comme libre, les deux cartes sortent du jeu, et la Tringa n’est pas complétée.</li>
<li><b>À trois joueurs.</b> Une 3ᵉ carte identique révélée au même tour est un Trois automatique pour son joueur.</li>
<li><b>2 contre 2.</b> Voir ci-dessous.</li></ul>
<h3>Échanges en 2 contre 2</h3>
<ul><li>L’échange ne se joue <b>qu’entre adversaires</b>, jamais entre coéquipiers : si deux partenaires posent la même valeur, c’est une capture ordinaire, sans échange.</li>
<li><b>Un coéquipier peut soutenir son partenaire, mais seulement avec une carte révélée au même tour</b>, de même valeur et dans la même zone : elle rejoint l’échange comme 3ᵉ ou 4ᵉ exemplaire (cri automatique pour son équipe).</li>
<li>Un coéquipier qui n’a <b>pas</b> révélé de carte dans cet échange ne peut pas abattre une carte de sa main pour aider : seuls les joueurs engagés dans l’échange surenchérissent.</li>
<li>Le butin rejoint la <b>pile commune</b> de l’équipe (au Souk) ou sort du jeu (en Médina).</li></ul>`},
 {id:'makla',t:'Makla',h:`
<h3>Votre pile reste en jeu</h3>
<p>Votre pile n’est plus cachée : elle reste au Souk, <b>coiffée, face visible, par la dernière carte ajoutée</b>. Quiconque capture cette carte au Souk emporte <b>la pile entière</b>.</p>
<ul><li><b>Refroidissement.</b> Une pile qui vient de grossir ne peut pas être prise pendant ce tour. Elle devient vulnérable au tour suivant.</li>
<li><b>Se protéger.</b> Ajouter une carte plus haute change la carte du dessus, donc la valeur à viser.</li>
<li><b>Les chaînes mordent dans les piles.</b> Une pile coiffée d’une valeur de la suite sert de marche (2 marches au plus) et part avec la chaîne.</li>
<li>Une Tringa et le butin d’un échange rejoignent votre pile et la coiffent. Une Ronda garée n’est jamais volable.</li>
<li>Les points déjà marqués ne se volent pas : seules les cartes changent de pile. On ne vole pas sa propre pile.</li></ul>
<h3>Jeton Moul Souk</h3>
<p>+5 en duel Standard et en 2 contre 2, +4 à quatre joueurs sans Baroud, +3 à trois joueurs.</p>`},
 {id:'baroud',t:'Baroud',h:`
<h3>Huit cartes d’action : les 8 et les 9</h3>
<p>Ce sont les 8 et les 9 du jeu français, écartés hors Baroud. Chaque joueur en reçoit, et les joue <b>glissées sous sa carte du tour</b> (une seule par tour), face cachée jusqu’à la révélation.</p>
<table><tr><th>Carte</th><th>Effet</th></tr>
<tr><td><b>Hâte</b> · 8♣</td><td>Tu résous en premier.</td></tr>
<tr><td><b>Patience</b> · 8♥</td><td>Tu résous en dernier.</td></tr>
<tr><td><b>Contre</b> · 8♠</td><td>Annule la carte Baroud adverse (se résout avant tout). Deux Contre qui se visent s’annulent.</td></tr>
<tr><td><b>Parole</b> · 8♦</td><td>Annonce une valeur (pas au dernier tour). Capture-la plus tard : +1 (à trois : +3). Sinon l’adversaire marque +2 (à trois : +1 chacun).</td></tr>
<tr><td><b>Encore</b> · 9♣</td><td>Deux cartes ce tour, +1 carte de la Réserve.</td></tr>
<tr><td><b>Présage</b> · 9♥</td><td>Regarde 3 cartes écartées.</td></tr>
<tr><td><b>Rafle</b> · 9♠</td><td>Après ta carte, prends une carte libre du plateau (jamais une carte d’échange).</td></tr>
<tr><td><b>Vent</b> · 9♦</td><td>En fin de tour (pas au dernier), toutes les cartes libres d’une zone glissent vers l’autre.</td></tr></table>
<h3>Baroud et mèches</h3>
<ul><li>En duel : 2 cartes Baroud chacun et 3 jetons de poudre. Une mèche se paie avec ses jetons, dans la <b>Poudrière</b> : Encore 1, Rafle 1, Vent 1, les autres sont gratuites. Une carte Baroud impayable ne peut pas être jouée.</li>
<li>Fin de manche : le plus riche prend la Poudrière. Égalité : le pot est reporté.</li>
<li>Parole est évaluée au décompte, avant le Moul Souk.</li>
<li>La Réserve de 5 cartes est toujours mise en place avec le Baroud (pour Encore) : voir « Échanges ».</li></ul>
<h3>À trois et à quatre</h3>

<li><b>À quatre.</b> 6 cartes (sans Encore ni Présage), 1 chacune, mèches gratuites, pas de Poudrière. Parole : +1 si tenue, +2 à chaque adversaire sinon.</li>
<li>Moul Souk : il garde la valeur du jeu de base avec le Baroud.</li></ul>`},
 {id:'multi',t:'À plusieurs',h:`
<h3>À trois ou à quatre joueurs</h3>
<ul><li><b>Plateau.</b> 6 cartes au Souk, 4 cartes par joueur, distributions de 2 cartes aux tours 3 et 5, 6 tours.</li>
<li><b>Chacun pour soi</b> (3 ou 4 joueurs) ou <b>2 contre 2</b> : une pile commune par équipe, un plafond de 6 points d’annonces par joueur.</li>
<li><b>Moul Souk.</b> +3 à trois et à quatre joueurs, +4 en 2 contre 2.</li>
<li>Une manche par joueur : 3 manches à trois, 4 manches à quatre.</li></ul>
<h3>L’ordre d’initiative à plusieurs</h3>
<ol><li><b>La plus haute valeur d’abord</b>, zone par zone : Roi · Dame · Valet · 7 · 6 · 5 · 4 · 3 · 2 · As.</li>
<li><b>À valeur égale</b>, l’ordre suit la <b>rotation du Donneur</b> : le premier à résoudre est celui qui <b>suit le Donneur dans le sens inverse des aiguilles d’une montre</b>, puis le suivant, et ainsi de suite. <b>Le Donneur est toujours le dernier.</b></li>
<li><b>Au dernier tour</b>, le Donneur résout en dernier, quelle que soit sa carte, même sans égalité.</li></ol>
<p>Le Donneur change à chaque manche (chacun donne une fois) : <b>l’ordre de priorité tourne avec lui</b>. Exemple à quatre joueurs A, B, C, D, dans le sens inverse des aiguilles d’une montre. Si A donne, la priorité à égalité est B, C, D, A. Si B donne à la manche suivante, elle devient C, D, A, B.</p>
<div class="note"><b>Dans l’app.</b> Le petit numéro sur chaque joueur est sa priorité à égalité de valeur (1 = premier). Il change quand le Donneur change.</div>
<h3>Le plateau à quatre côtés</h3>
<p>Chaque type de zone est divisé en deux parties : la <b>Médina</b> (haut gauche et bas droite) et le <b>Souk</b> (haut droite et bas gauche). Devant chaque joueur : une partie de Médina et une partie de Souk.</p>
<ul><li>Tu glisses ta carte de la zone neutre vers le <b>type</b> de zone voulu.</li>
<li>Une carte libre est déposée sur la partie de ce type qui est devant toi.</li>
<li>Si une capture est possible dans l’une des deux parties du même type (devant toi ou plus loin), elle se fait normalement.</li>
<li>À trois joueurs, une place reste libre.</li></ul>
<h3>2 contre 2</h3>
<ul><li>Les partenaires sont face à face. La Ronda se fait avec ses propres cartes, jouées en Médina à deux tours différents.</li>
<li>Capturer la carte de son partenaire est une capture ordinaire.</li>
<li>Échanges : seulement entre adversaires. Un coéquipier ne soutient son partenaire qu’avec une carte révélée au même tour (voir « Échanges »).</li>
<li>Jeton Moul Souk +4 (+5 en Makla sans Baroud).</li></ul>`},

<tr><td>Dernière capture : la carte du Donneur capture au dernier tour</td><td>+2</td><td>dernier tour</td></tr>

<h3>Ordres à retenir</h3>
<p><b>Valeurs :</b> Roi · Dame · Valet · 7 · 6 · 5 · 4 · 3 · 2 · As.</p>
<p><b>Chaîne :</b> As → 2 → 3 → 4 → 5 → 6 → 7 → Valet → Dame → Roi, deux marches, jamais vers le bas.</p>
<p><b>Score :</b> 5 jetons = un bâtonnet.</p>
<p><b>Tour :</b> sélection · pose en zone neutre (tous, scellée) · glissement · Retournez ! · résolution.</p>
<h3>Voir et comprendre les coups</h3>
<p>Après « Retournez ! », un panneau montre en images l’<b>ordre de résolution</b> : les cartes alignées du premier au dernier, avec « = » quand deux valeurs sont égales et la pastille <b>D</b> sur le Donneur. Puis chaque coup est illustré : la carte jouée et sa zone, ce qu’elle <b>prend</b> (même valeur, puis <b>chaîne</b> en jaune), sa destination (pile avec le nombre de cartes, ou « hors jeu ») et les points gagnés. La carte qui joue est mise en avant sur le plateau, et à plusieurs chaque carte porte le <b>nom de son joueur</b>.</p>
<p>Dans <b>Réglages</b> (accueil) ou dans la pause, le menu <b>Rythme de résolution</b> propose <b>Rapide</b>, <b>Normal</b> et <b>Pas à pas</b> : en pas à pas, un appui sur « Suivant » fait passer au coup suivant. L’interrupteur <b>Commentaires des coups</b> masque ce panneau (en pas à pas, seul le bouton « Suivant » reste).</p>
<p>L’<b>Historique des coups</b> (pause et fin de manche) garde ces explications, dans l’ordre d’initiative, avec le <b>score final de chaque manche</b>.</p>`}

  };
  function upd(b){
    if(b.classList.contains('tgl')){b.classList.toggle('on',S.on);b.setAttribute('aria-pressed',S.on);}
    else b.textContent=S.on?'Sons : activés':'Sons : coupés';
  }
  /* texte d’une bannière → son */
  S.banner=function(txt,kind){
    const t=String(txt).replace(/<[^>]+>/g,''),mine=kind!=='bot';
    if(/^Retournez/.test(t))return S.play('reveal');
    if(/Ronda/.test(t))return S.play('ronda',mine);
    if(/Tringa/.test(t))return S.play('tringa',mine);
    if(/Missa/.test(t))return S.play('missa');
    if(/Dernière capture/.test(t))return S.play('last');
    if(/Moul Souk/.test(t))return S.play('moul');
    if(/^Un !/.test(t))return S.play('cry',0);
    if(/^Trois !/.test(t))return S.play('cry',1);
    if(/^Cinq !/.test(t))return S.play('cry',2);
    if(/prend l’échange/.test(t))return S.play('cry',1);
    if(/Poudr/.test(t))return S.play('powder');
    if(/Contre/.test(t))return S.play('qontra');
    if(/Parole/.test(t))return S.play('kelma');
    if(/Hâte|Patience|Encore|Présage|Rafle|Vent/.test(t))return S.play('baroud');
    if(/distribue|Refresh|donne/.test(t))return S.play('deal');
  };
  const wrap=(name,fn)=>{if(typeof window[name]!=='function')return;const o=window[name];window[name]=fn(o);};
  wrap('banner',o=>function(txt,kind){try{S.banner(txt,kind);}catch(e){}return o.apply(this,arguments);});
  wrap('pop',o=>function(p,text){try{const n=parseInt(String(text).replace(/[^0-9]/g,''),10)||1;S.play('coin',n,p===0);}catch(e){}return o.apply(this,arguments);});
  wrap('fly',o=>function(ids,target){try{if(ids&&ids.length)S.play(target?'cap':'whoosh');}catch(e){}return o.apply(this,arguments);});
  if(typeof Tselect==='function')wrap('Tselect',o=>function(){try{S.play('select');}catch(e){}return o.apply(this,arguments);});
  else wrap('tryPlace',o=>function(){try{S.play('place');}catch(e){}return o.apply(this,arguments);});
  wrap('Tseal',o=>function(){try{if(UI.phase==='select'&&UI.stage==='pick'&&readySel())S.play('seal');}catch(e){}return o.apply(this,arguments);});
  wrap('Tslide',o=>function(){try{if(UI.stage==='slide')S.play('slide');}catch(e){}return o.apply(this,arguments);});
  wrap('Tdeal',o=>function(){try{S.play('deal');}catch(e){}return o.apply(this,arguments);});
  /* compte à rebours 3·2·1 de la pose */
  const pz=document.getElementById('pose');
  if(pz&&window.MutationObserver)new MutationObserver(ms=>{
    ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.classList&&n.classList.contains('num'))S.play('count',parseInt(n.textContent,10)||3);}));
  }).observe(pz,{childList:true});
  /* clics sur les boutons */
  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('button,.btn,.seg,.tgl,a.btn');
    if(b&&!b.hasAttribute('data-snd'))S.play('click');
  },true);
  /* fins de manche / de match */
  wrap('openSheet',o=>function(html,mid){
    const r=o.apply(this,arguments);
    try{
      if(/Victoire/.test(html))S.play('win');else if(/Défaite/.test(html))S.play('lose');else if(/Égalité/.test(html))S.play('draw');else S.play('sheet');
    }catch(e){}
    return r;
  });
})();

/* =====================================================================
   ACCUEIL ALLÉGÉ : Jouer, Réglages, Apprendre. Format, adversaire, modules, aides, son et rythme
   sont regroupés dans la fenêtre « Réglages » (menus déroulants et interrupteurs).
   ===================================================================== */
(function(){
  const one=typeof FMT!=='undefined',multi=typeof MODES!=='undefined';
  const skin=typeof T!=='undefined'&&T&&('guide' in T);
  const MODS=[['exch','Échanges','Duel d’enchères sur les cartes identiques'],['qaa','Dernière capture','+2 si la carte du Donneur capture au dernier tour'],['makla','Makla','Les piles restent en jeu et peuvent être prises'],['baroud','Baroud','Cartes d’action, poudre et mèches']];
  function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
  function sw(label,desc,get,set,id){
    const b=document.createElement('button');b.type='button';if(id)b.id=id;
    b.className='sw'+(get()?' on':'');b.setAttribute('role','switch');b.setAttribute('aria-checked',!!get());
    b.innerHTML='<span class="sl"><b>'+esc(label)+'</b>'+(desc?'<small>'+esc(desc)+'</small>':'')+'</span><i></i>';
    b.onclick=()=>{set(!get());b.classList.toggle('on',!!get());b.setAttribute('aria-checked',!!get());};
    return b;
  }
  function sel(label,opts,get,set,id){
    const w=document.createElement('label');w.className='ss';
    w.innerHTML='<span>'+esc(label)+'</span><select'+(id?' id="'+id+'"':'')+'>'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(get())?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
    w.querySelector('select').onchange=e=>set(e.target.value);
    return w;
  }
  function head(t){const h=document.createElement('div');h.className='stgh';h.textContent=t;return h;}
  const paceOpts=()=>[['fast','Rapide'],['normal','Normal'],['step','Pas à pas']];
  const sndSw=()=>sw('Effets sonores','',()=>window.SND?SND.on:false,v=>{if(window.SND)SND.set(v);});
  const exSw=()=>sw('Commentaires des coups','Panneau qui explique chaque coup',()=>PACE.expl,v=>PACE.setExpl(v));
  const paceSel=()=>sel('Rythme de résolution',paceOpts(),()=>PACE.mode,v=>PACE.set(v));
  function summary(){
    const c=G.cfg;let s='';
    if(one)s=FMT[c.fmt].n+' · '+BOTS[c.level].n;
    else if(multi)s='Niveau '+LEVELS[c.level];
    const n=MODS.filter(m=>c[m[0]]).length;
    return s+(n?' · '+n+' module'+(n>1?'s':''):'');
  }
  /* ---------- fenêtre Réglages ---------- */
  window.Hsettings=function(){
    openSheet('<h2>Réglages</h2><div id="stg"></div><button class="btn pri" id="stgX" style="width:100%;margin-top:12px">Terminé</button>');
    const root=document.getElementById('stg'),c=G.cfg,again=()=>{try{renderHome();}catch(e){}};
    root.append(head('Partie'));
    if(one){
      root.append(sel('Format',Object.keys(FMT).map(k=>[k,FMT[k].n+' · '+FMT[k].t+' tours']),()=>c.fmt,v=>{c.fmt=v;again();}));
      root.append(sel('Adversaire',BOTS.map((b,i)=>[i,b.n+' · '+b.l]),()=>c.level,v=>{c.level=+v;again();}));
    }else if(multi){
      root.append(sel('Niveau des adversaires',LEVELS.map((n,i)=>[i,n]),()=>c.level,v=>{c.level=+v;again();}));
    }
    root.append(head('Modules'));
    MODS.forEach(m=>root.append(sw(m[1],m[2],()=>c[m[0]],v=>{c[m[0]]=v;if(m[0]==='baroud'){const g=document.getElementById('stgGal');if(g)g.style.display=v?'':'none';}again();})));
    const g=document.createElement('button');g.type='button';g.id='stgGal';g.className='btn';g.textContent='Voir les cartes Baroud';g.style.display=c.baroud?'':'none';
    g.onclick=()=>{closeSheet();if(typeof openGallery==='function')openGallery();};root.append(g);
    root.append(head('Aide et affichage'));
    if(skin)root.append(sw('Mise en place guidée','Coupe et distribution étape par étape',()=>T.guide,v=>{T.guide=v;again();}));
    root.append(exSw(),paceSel());
    root.append(head('Son'));root.append(sndSw());
    const pw=window.__pwa,ml=window.__PWA;
    if(pw||ml){
      root.append(head('Application'));
      if(pw){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='Installer l’app';b.onclick=()=>{closeSheet();pw();};root.append(b);}
      if(ml){const a=document.createElement('a');a.className='btn';a.href='index.html';a.textContent='Menu principal';a.style.textDecoration='none';root.append(a);}
    }
    document.getElementById('stgX').onclick=closeSheet;
  };
  /* ---------- fenêtre Apprendre ---------- */
  window.Hlearn=function(){
    openSheet('<h2>Apprendre</h2><div id="lrn" class="lsn"></div><button class="btn" id="lrX" style="width:100%;background:var(--panel2);color:var(--fg)">Fermer</button>');
    const root=document.getElementById('lrn');
    const add=(t,d,f)=>{const b=document.createElement('button');b.type='button';b.className='btn';b.innerHTML='<span>'+esc(t)+'<small style="display:block;font-weight:500;opacity:.7">'+esc(d)+'</small></span>';b.onclick=f;root.append(b);};
    if(window.__tuto)add('Tutoriel guidé','Des leçons pas à pas',()=>window.__tuto());
    if(typeof Mopen==='function')add('Manuel du joueur','Les règles, module par module',()=>{closeSheet();Mopen();});
    if(window.__PWA&&typeof Vopen==='function')add('Vidéo explicative','Une manche en 60 secondes',()=>{closeSheet();Vopen();});
    document.getElementById('lrX').onclick=closeSheet;
  };
  /* ---------- accueil ---------- */
  const _rh=renderHome;
  renderHome=function(){
    _rh();
    try{
      const box=document.querySelector('#home .hbox');if(!box)return;
      const tuto=box.querySelector('#tuto'),pwa=box.querySelector('#pwaBtn');
      window.__tuto=tuto?tuto.onclick:null;window.__pwa=pwa?pwa.onclick:null;
      [...box.children].forEach(n=>{
        const keepRow=n.classList.contains('row')&&n.id==='mode';
        if(keepRow||n.id==='play')return;
        n.remove();
      });
      const row=document.createElement('div');row.className='row hmore';
      row.innerHTML='<button type="button" class="btn" id="hSet">Réglages<small>'+esc(summary())+'</small></button><button type="button" class="btn" id="hLearn">Apprendre<small>Tutoriel, manuel'+(window.__PWA?', vidéo':'')+'</small></button>';
      box.appendChild(row);
      row.querySelector('#hSet').onclick=()=>Hsettings();
      row.querySelector('#hLearn').onclick=()=>Hlearn();
    }catch(e){}
  };
  /* ---------- pause : rythme, commentaires et son ---------- */
  const _os=openSheet;
  openSheet=function(html,mid){
    _os(html,mid);
    try{
      if(html.indexOf('<h2>Pause</h2>')===0){
        const sc=document.querySelector('#sheet .sc'),x=sc&&sc.querySelector('.xbtns');
        if(x&&!sc.querySelector('#pauseOpts')){
          const d=document.createElement('div');d.id='pauseOpts';d.className='stgp';
          d.append(paceSel(),exSw(),sndSw());
          sc.insertBefore(d,x);
          const m=sc.querySelector('#manBtn2'),v=sc.querySelector('#vidBtn2');
          if(m&&v){const r=document.createElement('div');r.className='row hmore2';m.parentNode.insertBefore(r,m);r.append(m,v);m.style.marginBottom=v.style.marginBottom='0';}
        }
      }
    }catch(e){}
  };
  const h=document.getElementById('home');
  if(h&&h.classList.contains('on'))renderHome();
})();

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  var had=!!navigator.serviceWorker.controller,rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!rl){rl=true;location.reload();}});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){try{r.update();}catch(e){}}).catch(function(){});});
}

renderHome();


/* ===== affichage adaptatif : tablette et ordinateur ===== */
(function(){
  let last=0,lw=0;
  function apply(){
    const vw=window.innerWidth,vh=window.innerHeight;
    let u=Math.min(vh/780,vw/400);u=Math.max(1,Math.min(u,1.7));u=Math.round(u*100)/100;
    let wf=Math.max(1,Math.min(1.7,(vw/vh)/0.72));wf=Math.round(wf*100)/100;
    if(Math.abs(u-last)<0.02&&Math.abs(wf-lw)<0.03)return;
    last=u;lw=wf;
    const s=document.documentElement.style;
    s.setProperty('--u',u+'px');s.setProperty('--wf',String(wf));
  }
  window.addEventListener('resize',apply);window.addEventListener('orientationchange',apply);apply();
})();
</script>
