<script>
'use strict';
/* =====================================================================
   WACH?! — prototype mobile · 3 et 4 joueurs (toi + IA)
   1v1v1 · 1v1v1v1 · 2v2 · Échanges · Qaa · Makla · Baroud
   ===================================================================== */
const SEQ=[1,2,3,4,5,6,7,10,11,12];
const SUITS=['B','C','E','D'];
const SN={B:'Bâtons',C:'Coupes',E:'Épées',D:'Deniers'};
const NAMES={10:'Souta',11:'Cabal',12:'Rey'};
const BARS={
  Zerba:{ar:'زربة',d:'Tu résous en premier.'},
  Sber:{ar:'صبر',d:'Tu résous en dernier.'},
  Aoud:{ar:'عاود',d:'Deux cartes ce tour. +1 carte. (à trois)'},
  Fal:{ar:'فال',d:'Vois 3 cartes écartées. (à trois)'},
  Qontra:{ar:'كونطرا',d:'Annule la Baroud d’un adversaire.'},
  Khatf:{ar:'خطف',d:'Prends une carte libre.'},
  Kelma:{ar:'كلمة',d:'Annonce une valeur, capture-la plus tard.'},
  Chergui:{ar:'شرقي',d:'Une zone glisse vers l’autre.'}
};
const M3={Zerba:0,Sber:0,Aoud:1,Fal:1,Qontra:0,Khatf:2,Kelma:0,Chergui:1};
const MODES={
  ffa3:{n:3,teams:false,rounds:3,tag:'1v1v1 · Bo3'},
  ffa4:{n:4,teams:false,rounds:4,tag:'1v1v1v1 · 4 manches'},
  duo:{n:4,teams:true,rounds:4,tag:'2v2 · 4 manches'}
};
const AIS=[{n:'Yassine',a:'ي'},{n:'Salma',a:'س'},{n:'Karim',a:'ك'}];
const LEVELS=['Facile','Moyen','Difficile'];
const ABORT=Symbol('abort');
const $=s=>document.querySelector(s);
const G={cfg:{mode:'ffa3',level:0,exch:true,qaa:true,makla:false,baroud:false},tok:0,match:null,R:null,tuto:null};
const UI={phase:'idle',sel:null,sel2:null,bar:null,kv:null,picked:null,ready:[],reveal:null,hl:new Set(),newId:null,allow:null,dragOver:null,pick:null,pickMsg:'',bump:null};
let FAST=false,UID=0;

/* ---------- utilitaires ---------- */
function beat(ms){
  const t=G.tok;
  return new Promise(r=>setTimeout(r,FAST?Math.min(ms*.25,140):ms)).then(()=>{if(t!==G.tok)throw ABORT;});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mk(v,s){return {id:++UID,v,s,code:v+s};}
function mkCode(code){const m=/^(\d+)([BCED])$/.exec(code);return mk(+m[1],m[2]);}
function fullDeck(){const d=[];for(const s of SUITS)for(const v of SEQ)d.push(mk(v,s));return d;}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
const ent=p=>G.R.teams?p%2:p;
const kind=p=>ent(p)===0?'pt':'bot';
function seatName(p){
  if(p===0)return 'Toi';
  const R=G.R;
  if(R&&R.teams&&p===2)return AIS[1].n;
  return AIS[p-1].n;
}
function seatAv(p){return p===0?'ا':AIS[p-1].a;}
function entName(e){const R=G.R;if(R.teams)return e===0?'Nous':'Eux';return seatName(e);}
function tot(e){const s=G.R.sc[e];let t=0;for(const k in s)t+=s[k];return t;}
function mech(n){return G.R.poudre?M3[n]:0;}

/* ---------- moteur ---------- */
function moulValue(R){
  if(R.N===3)return 3;
  if(R.teams)return (R.makla&&!R.baroud)?5:4;
  return (R.makla&&!R.baroud)?4:3;
}
function newRound(o){
  const N=o.N,E=o.teams?2:N;
  const z=()=>({base:(o.baroud&&N===3)?3:0,ann:0,missa:0,exch:0,qaa:0,moul:0,meche:0,kelma:0,pot:0});
  const R={N,E,teams:!!o.teams,total:o.total||6,refresh:o.refresh||[3,5],exch:o.exch,qaa:o.qaa,makla:!!o.makla,baroud:!!o.baroud,
    poudre:!!o.baroud&&N===3,dealer:o.dealer,turn:1,moul:o.moul,
    hands:Array.from({length:N},()=>[]),souk:[],medina:[],pile:Array.from({length:E},()=>[]),garee:Array.from({length:N},()=>[]),
    discard:[],refDeck:[],reserve:[],cap:Array(N).fill(0),pt:Array(E).fill(0),sc:Array.from({length:E},z),
    bar:Array.from({length:N},()=>[]),pot:o.pot||0,kelma:Array(N).fill(null),script:o.script||null};
  if(o.rig){
    const L=o.rig;
    for(let p=0;p<N;p++)R.hands[p]=L.hands[p].map(mkCode);
    R.souk=L.souk.map(mkCode);R.reserve=(L.reserve||[]).map(mkCode);
    if(o.baroud&&L.bar)R.bar=L.bar.map(a=>a.slice());
  }else{
    const d=shuffle(fullDeck());
    for(let p=0;p<N;p++)R.hands[p]=d.splice(0,4);
    R.souk=d.splice(0,6);
    R.refDeck=d.splice(0,R.refresh.length*2*N);
    const need=o.exch?(N===3?5:1):((R.baroud&&N===3)?5:0);
    R.reserve=d.splice(0,need);
    R.discard=d;
  }
  if(R.baroud&&!o.rig){
    const pool=N===3?Object.keys(BARS):['Zerba','Sber','Qontra','Khatf','Kelma','Chergui'];
    const n=shuffle(pool.slice());
    for(let p=0;p<N;p++)R.bar[p]=[n[p]];
  }
  return R;
}
const cOf=(z,x)=>z==='S'?(x.pile!==undefined?x.card:x):x.card;
function soukArr(p){
  const R=G.R;if(!R.makla)return R.souk;
  const ps=[];
  for(let e=0;e<R.E;e++){
    if(e!==ent(p)&&R.pile[e].length&&R.pt[e]<R.turn)ps.push({pile:e,card:R.pile[e][R.pile[e].length-1]});
  }
  return [...R.souk,...ps];
}
function canEsc(p){
  const R=G.R;if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (R.hands[p].length-1+comp)+futR>=futT;
}
function canAoud(p){
  const R=G.R,h=R.hands[p].length;
  if(!R.baroud||R.N!==3||h<2)return false;
  if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (h-2+comp)+futR>=futT;
}
function calc(p,c,z){
  const R=G.R,S=z==='S',arr=S?soukArr(p):R.medina;
  const eq=arr.filter(x=>cOf(z,x).v===c.v);
  const groups=[];let taken=[];
  if(eq.length){
    groups.push(eq);taken=eq.slice();
    const i=SEQ.indexOf(c.v);
    for(let k=1;k<=2;k++){
      const nv=SEQ[i+k];if(nv===undefined)break;
      const g=arr.filter(x=>cOf(z,x).v===nv);
      if(!g.length)break;
      groups.push(g);taken.push(...g);
    }
  }
  const r={p,c,z,taken,groups,kind:'free',ann:0,missa:false,gi:-1,own:null};
  if(S){
    if(taken.length){r.kind='cap';const pl=taken.filter(x=>x.pile===undefined).length;r.missa=pl>0&&pl===R.souk.length;}
  }else{
    const gi=R.garee[p].findIndex(g=>g.v===c.v);
    const own=eq.find(x=>x.owner===p);
    // jeu défensif : une carte de même valeur déjà en Médina (ou jouée ce tour avec l’échange) bloque la Tringa
    const simul=!!(R.exch&&R.curPlays&&R.curPlays.some(pl=>!pl.done&&pl.card.id!==c.id&&pl.zone==='M'&&pl.card.v===c.v&&ent(pl.p)!==ent(p)));
    if(gi>=0&&eq.length===0&&!simul){r.kind='tringa';r.gi=gi;r.ann=3;}
    else if(own){r.kind='ronda';r.own=own;r.ann=2;}
    else if(taken.length){r.kind='cap';}
  }
  return r;
}
function addPts(e,k,pts){
  const R=G.R;R.sc[e][k]+=pts;
  pop(e,pts>0?'+'+pts:String(pts));
  return pts;
}
function addAnn(p,pts){
  const R=G.R;const g=Math.min(pts,6-R.cap[p]);
  R.cap[p]+=g;R.sc[ent(p)].ann+=g;
  pop(ent(p),g>0?'+'+g:'plafond');
  if(g>0&&ent(p)===0)vib(25);
  return g;
}
function remFrom(arr,ids){for(let i=arr.length-1;i>=0;i--){const x=arr[i];if(ids.has(x.card?x.card.id:x.id))arr.splice(i,1);}}
function noteCap(p,cards){
  const R=G.R,k=R.kelma[p];
  if(!k||R.turn<=k.turn)return;
  if(cards.some(c=>c.v===k.v))k.held=true;
}
function pileEl(e){return document.querySelector('[data-pile="'+e+'"]');}

async function applyRes(r){
  const R=G.R,p=r.p,e=ent(p),S=r.z==='S';
  const tkCards=r.taken.map(x=>cOf(r.z,x));
  const done=()=>{if(r.play)r.play.done=true;};
  noteCap(p,[...tkCards,...((r.kind==='ronda'||r.kind==='tringa')?[r.c]:[])]);
  if(r.groups.length){
    UI.hl=new Set();
    for(const g of r.groups){g.forEach(x=>UI.hl.add(cOf(r.z,x).id));render();await beat(430);}
  }
  if(r.kind==='free'){
    r.c.own=p;
    if(S)R.souk.push(r.c);else R.medina.push({card:r.c,owner:p});
    UI.newId=r.c.id;done();render();await beat(380);UI.newId=null;return;
  }
  const idsAll=new Set(tkCards.map(c=>c.id));
  if(S){
    const plainE=r.taken.filter(x=>x.pile===undefined),pileE=r.taken.filter(x=>x.pile!==undefined);
    await fly([...idsAll,r.c.id],pileEl(e));
    remFrom(R.souk,new Set(plainE.map(c=>c.id)));
    const stolen=pileE.flatMap(x=>R.pile[x.pile].splice(0));
    R.pile[e].push(...stolen,...plainE,r.c);R.pt[e]=R.turn;
    if(stolen.length)pop(e,'+'+stolen.length+' pile');
    UI.hl=new Set();done();UI.bump=e;render();UI.bump=null;
    if(r.missa){addPts(e,'missa',1);await banner('Missa ! +1',kind(p));}
    else await beat(220);
    return;
  }
  if(r.kind==='ronda'){
    const exit=tkCards.filter(c=>c.id!==r.own.card.id);
    await fly(exit.map(c=>c.id),null);
    remFrom(R.medina,idsAll);R.discard.push(...exit);
    R.garee[p].push({v:r.c.v,cards:[r.own.card,r.c]});
    UI.hl=new Set();done();render();
    const g=addAnn(p,2);
    await banner(g<2?'Ronda ! plafond':'Ronda ! +2',kind(p));return;
  }
  if(r.kind==='tringa'){
    const pr=R.garee[p][r.gi];
    await fly([...idsAll],null);
    remFrom(R.medina,idsAll);R.discard.push(...tkCards);
    R.garee[p].splice(r.gi,1);
    await fly([r.c.id],pileEl(e));
    R.pile[e].push(...pr.cards,r.c);R.pt[e]=R.turn;
    UI.hl=new Set();done();UI.bump=e;render();UI.bump=null;
    const g=addAnn(p,3);
    await banner(g<3?'Tringa ! plafond':'Tringa ! +3',kind(p),900);return;
  }
  await fly([...idsAll,r.c.id],null);
  remFrom(R.medina,idsAll);R.discard.push(...tkCards,r.c);
  UI.hl=new Set();done();render();await beat(280);
}

/* ---------- échanges à plusieurs ---------- */
function onBoard(card){
  const R=G.R;return R.souk.some(c=>c.id===card.id)||R.medina.some(x=>x.card.id===card.id);
}
async function finalizeExchange(ex){
  const R=G.R,S=ex.zone==='S';
  while(ex.pool.length<4){
    const parts=ex.parts,li=parts.indexOf(ex.last);
    let cand=null,extra=null;
    for(let k=1;k<=parts.length;k++){
      const q=parts[(li+k)%parts.length];
      if(ent(q)===ent(ex.last))continue;
      const c=R.hands[q].find(x=>x.v===ex.v);
      if(c&&canEsc(q)){cand=q;extra=c;break;}
    }
    if(cand===null)break;
    const pts=ex.pool.length===2?3:5,name=ex.pool.length===2?'Btlata':'Bkhmsa';
    const yes=cand===0?await promptEscalate(extra,{name,pts}):botEscalate(cand);
    if(!yes)break;
    R.hands[cand]=R.hands[cand].filter(c=>c.id!==extra.id);
    ex.pool.push(extra);ex.last=cand;
    if(R.reserve.length)R.hands[cand].push(R.reserve.pop());
    render();
    await banner(name+' ! +'+pts,kind(cand),850);
  }
  const pts=[0,0,1,3,5][ex.pool.length],w=ex.last,e=ent(w);
  addPts(e,'exch',pts);noteCap(w,ex.pool);
  ex.plays.forEach(pl=>pl.done=true);
  const ids=ex.pool.map(c=>c.id);
  if(S){
    await fly(ids,pileEl(e));
    R.pile[e].push(...ex.pool);R.pt[e]=R.turn;UI.bump=e;
  }else{
    await fly(ids,null);R.discard.push(...ex.pool);
  }
  render();UI.bump=null;
  await banner(seatName(w)+(w===0?' prends':' prend')+' l’échange',kind(w),650);
  return w;
}

/* ---------- Baroud : aides ---------- */
function freeTargets(){
  const R=G.R,t=[];
  R.souk.forEach(c=>t.push({card:c,zone:'S',owner:c.own===undefined?null:c.own}));
  R.medina.forEach(x=>t.push({card:x.card,zone:'M',owner:x.owner}));
  return t;
}
function pickTarget(T,only){
  return new Promise((res,rej)=>{
    UI.pick={ids:new Set(T.filter(t=>!only||t.card.code===only).map(t=>t.card.id)),res,list:T};
    UI.pickMsg='Khatf : touche une carte libre.';
    UI.rejectP=rej;render();
  });
}
function botKhatfTarget(p,T){
  let best=null,bv=0;
  for(const t of T){
    let v;
    const same=t.owner!==null&&ent(t.owner)===ent(p);
    if(t.zone==='S')v=same?.1:1;
    else v=same?-5:(t.owner===null?.6:1.4);
    v+=Math.random()*.3;
    if(v>bv){bv=v;best=t;}
  }
  return best;
}
async function doKhatf(p,kt){
  const R=G.R,T=freeTargets(),e=ent(p);
  if(!T.length){await banner('Khatf : rien à prendre','info',700);return;}
  let tgt=null;
  if(R.script&&kt)tgt=T.find(t=>t.card.code===kt)||null;
  if(!tgt&&p===0){tgt=await pickTarget(T,null);UI.pick=null;UI.pickMsg='';}
  if(!tgt)tgt=botKhatfTarget(p,T)||T[0];
  await banner('Khatf !',kind(p),600);
  UI.hl=new Set([tgt.card.id]);render();await beat(380);
  const ids=new Set([tgt.card.id]);
  if(tgt.zone==='S'){
    await fly([tgt.card.id],pileEl(e));
    remFrom(R.souk,ids);R.pile[e].push(tgt.card);R.pt[e]=R.turn;UI.bump=e;
  }else{
    await fly([tgt.card.id],null);remFrom(R.medina,ids);R.discard.push(tgt.card);
  }
  UI.hl=new Set();render();UI.bump=null;
  noteCap(p,[tgt.card]);
}
function chooseZone(){
  return new Promise((res,rej)=>{
    openSheet('<h2>Chergui</h2><div class="sub">Quelle zone souffle ?</div><div class="xbtns"><button class="btn" id="cz1">Souk</button><button class="btn" id="cz2">Médina</button></div>');
    $('#cz1').onclick=()=>{UI.rejectX=null;closeSheet();res('S');};
    $('#cz2').onclick=()=>{UI.rejectX=null;closeSheet();res('M');};
    UI.rejectX=()=>rej(ABORT);
  });
}
function botChergui(p){
  const R=G.R;
  return R.medina.some(x=>ent(x.owner===null?p:x.owner)!==ent(p))?'M':'S';
}
async function doChergui(p,cz){
  const R=G.R;let z;
  if(R.script&&cz)z=cz;
  else if(p===0)z=await chooseZone();
  else z=botChergui(p);
  await banner('Chergui ! '+(z==='S'?'Souk → Médina':'Médina → Souk'),kind(p),950);
  if(z==='S'){
    R.souk.splice(0).forEach(c=>R.medina.push({card:c,owner:c.own===undefined?null:c.own}));
  }else{
    R.medina.splice(0).forEach(x=>{x.card.own=x.owner;R.souk.push(x.card);});
  }
  render();await beat(500);
}
function showFal(){
  const R=G.R,pool=shuffle(R.discard.slice()).slice(0,3);
  return new Promise((res,rej)=>{
    openSheet('<h2>Fal</h2><div class="sub">Ton Zhar</div><div class="pgrid" style="justify-content:center">'+(pool.map(c=>cardHTML(c,'')).join('')||'<div class="sub">—</div>')+'</div><button class="btn pri" id="falOk" style="width:100%;background:var(--saf);color:#140908">Compris</button>');
    $('#falOk').onclick=()=>{UI.rejectX=null;closeSheet();res();};
    UI.rejectX=()=>rej(ABORT);
  });
}
function chooseQontra(cands,only){
  return new Promise((res,rej)=>{
    openSheet('<h2>Qontra</h2><div class="sub">Quelle Baroud éteindre ?</div><div class="tgt">'+cands.map(c=>`<button class="btn" data-q="${c.p}"><span>${BARS[c.nm].ar}</span><b>${seatName(c.p)} · ${c.nm}</b></button>`).join('')+'</div>');
    document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
      const q=+b.dataset.q;
      if(only!==undefined&&only!==null&&q!==only){nudge();return;}
      UI.rejectX=null;closeSheet();res(q);
    });
    UI.rejectX=()=>rej(ABORT);
  });
}
function botQontraTarget(p,cands){
  const R=G.R;
  let best=cands[0],bv=-1e9;
  for(const c of cands){const v=tot(ent(c.p))+Math.random();if(v>bv){bv=v;best=c;}}
  return best.p;
}

/* ---------- résolution d’un tour ---------- */
async function resolveTurn(pays){
  const R=G.R,N=R.N;
  const plays=[];
  for(let p=0;p<N;p++)pays[p].cards.forEach(c=>{
    R.hands[p]=R.hands[p].filter(y=>y.id!==c.card.id);
    plays.push({p,card:c.card,zone:c.zone,done:false});
  });
  UI.sel=null;UI.sel2=null;UI.picked=null;
  R.curPlays=plays;
  UI.reveal={plays,flip:false,order:null,active:null,bars:Array(N).fill(null)};
  // paiement des mèches
  const live=Array(N).fill(null);
  for(let p=0;p<N;p++){
    const nm=pays[p].bar;if(!nm)continue;
    const cost=mech(nm),e=ent(p);
    if(cost===0||tot(e)>=cost){
      R.bar[p]=R.bar[p].filter(x=>x!==nm);
      if(cost){R.sc[e].meche-=cost;R.pot+=cost;}
      live[p]=nm;UI.reveal.bars[p]={name:nm,x:false};
    }
  }
  render();await beat(120);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('#board .flip').forEach(x=>x.classList.add('on'));
    if(UI.reveal)UI.reveal.flip=true;
  }));
  vib(15);
  await banner('Wach !','wach',650);
  const tie=p=>(p-R.dealer-1+N)%N;
  const lastT=R.turn===R.total;
  const prio=p=>Math.max(...plays.filter(x=>x.p===p).map(x=>x.card.v));
  const cmp=(rk)=>(a,b)=>{
    if(lastT){if(a===R.dealer&&b!==R.dealer)return 1;if(b===R.dealer&&a!==R.dealer)return -1;}
    if(rk(a)!==rk(b))return rk(b)-rk(a);
    return tie(a)-tie(b);
  };
  for(let p=0;p<N;p++)if(live[p]){
    const c=mech(live[p]);if(c)pop(ent(p),'−'+c);
    await banner(live[p]+' !',kind(p),560);
  }
  // Qontra : choix simultanés
  const baseOrder=[...Array(N).keys()].sort(cmp(prio));
  const qs=baseOrder.filter(p=>live[p]==='Qontra');
  if(qs.length){
    const tg={};
    for(const q of qs){
      const cands=[];
      for(let r=0;r<N;r++)if(r!==q&&live[r]&&ent(r)!==ent(q))cands.push({p:r,nm:live[r]});
      if(!cands.length){tg[q]=null;continue;}
      if(cands.length===1&&q!==0){tg[q]=cands[0].p;continue;}
      if(q===0){
        const only=R.script&&pays[0].qt!==undefined?pays[0].qt:null;
        tg[q]=(cands.length===1)?cands[0].p:await chooseQontra(cands,only);
      }else tg[q]=botQontraTarget(q,cands);
    }
    const cancelled=new Set();
    for(const q of qs){
      const t=tg[q];
      if(t===null||t===undefined){await banner('Qontra… dans le vide','info',650);continue;}
      if(live[t]==='Qontra'&&tg[t]===q){
        cancelled.add(q);cancelled.add(t);
        await banner('Qontra × Qontra','info',800);continue;
      }
      if(cancelled.has(q))continue;
      cancelled.add(t);
      await banner('Qontra ! annule '+live[t],kind(q),900);
    }
    for(const x of cancelled){if(UI.reveal.bars[x])UI.reveal.bars[x].x=true;live[x]=null;}
    for(const q of qs)live[q]=null;
    render();
  }
  // effets immédiats
  for(let p=0;p<N;p++){
    if(live[p]==='Kelma'){
      R.kelma[p]={v:pays[p].kv,turn:R.turn,held:false};
      await banner('Kelma ! « '+pays[p].kv+' »',kind(p),1000);
    }
    if(live[p]==='Fal'){if(p===0)await showFal();else await banner('Fal !','bot',600);}
  }
  // initiative
  const rank=p=>live[p]==='Zerba'?99:(live[p]==='Sber'?-1:prio(p));
  const order=[...Array(N).keys()].sort(cmp(rank));
  UI.reveal.order={};order.forEach((p,i)=>UI.reveal.order[p]=i+1);
  render();await beat(520);
  // résolutions par créneau
  const fresh=[],exs=[],lastKind=Array(N).fill('free');
  for(const p of order){
    for(const m of plays.filter(x=>x.p===p)){
      UI.reveal.active=p;render();
      let ex=R.exch?exs.find(x=>x.zone===m.zone&&x.v===m.card.v&&x.pool.length<4&&ent(x.last)!==ent(p)):null;
      if(ex){
        ex.pool.push(m.card);ex.plays.push(m);if(!ex.parts.includes(p))ex.parts.push(p);ex.last=p;
        const pts=ex.pool.length===3?3:5;
        await banner((pts===3?'Btlata':'Bkhmsa')+' ! +'+pts,kind(p),800);
        continue;
      }
      const f=R.exch?fresh.find(x=>ent(x.p)!==ent(p)&&x.zone===m.zone&&x.card.v===m.card.v&&onBoard(x.card)):null;
      if(f){
        const ids=new Set([f.card.id]);
        if(f.zone==='S')remFrom(R.souk,ids);else remFrom(R.medina,ids);
        fresh.splice(fresh.indexOf(f),1);f.play.done=false;
        exs.push({zone:m.zone,v:m.card.v,pool:[f.card,m.card],plays:[f.play,m],parts:[f.p,p],last:p});
        render();
        await banner('Bouahd ! +1',kind(p),800);
        continue;
      }
      const r=calc(p,m.card,m.zone);r.play=m;
      await applyRes(r);
      if(r.kind==='free')fresh.push({p,card:m.card,zone:m.zone,play:m});
      lastKind[p]=r.kind;
    }
    if(live[p]==='Khatf')await doKhatf(p,pays[p].kt);
    if(live[p]==='Aoud'&&R.reserve.length){
      R.hands[p].push(R.reserve.pop());render();pop(ent(p),'+1 carte');await beat(320);
    }
  }
  for(const x of exs){const w=await finalizeExchange(x);lastKind[w]='exch';}
  for(const p of order){if(live[p]==='Chergui')await doChergui(p,pays[p].cz);}
  R.curPlays=null;UI.reveal=null;UI.hl=new Set();render();
  if(lastT&&R.qaa&&lastKind[R.dealer]!=='free'){
    addPts(ent(R.dealer),'qaa',2);
    await banner('Qaa ! +2',kind(R.dealer),900);
  }
}

/* ---------- IA ---------- */
function botPick(p){
  const R=G.R,hand=R.hands[p],e=ent(p);
  if(R.script){
    const sc=R.script.bot[p][R.turn-1];
    return {card:hand.find(x=>x.code===sc.code),zone:sc.zone};
  }
  const lvl=G.cfg.level;
  const wS=[1.35,.8,1][lvl],wM=[.5,1.4,1][lvl],noise=[.55,.4,.18][lvl];
  const lastT=R.turn===R.total;
  let best=null,bv=-1e9;
  for(const c of hand){
    for(const z of ['S','M']){
      const r=calc(p,c,z);let v=0;
      const same=hand.filter(h=>h.id!==c.id&&h.v===c.v).length;
      if(z==='S'){
        if(r.kind==='cap'){
          const n=r.taken.reduce((a,x)=>a+(x.pile!==undefined?R.pile[x.pile].length:1),0);
          v+=wS*0.9*(n+1);if(r.missa)v+=1.4;
        }else v+=-.25;
      }else{
        if(r.kind==='tringa')v+=(R.cap[p]>=4?.8:3.6)*wM;
        else if(r.kind==='ronda')v+=(R.cap[p]>=5?.6:2.6)*wM;
        else if(r.kind==='cap'){
          v+=.8*wM+.1*r.taken.length;
          for(const x of r.taken){if(x.owner!==undefined&&x.owner!==null&&ent(x.owner)===e)v-=2.2;}
        }
        else v+=wM*(same&&R.cap[p]<6?1:.15)-.6;
      }
      if(R.garee[p].some(g=>g.v===c.v)&&r.kind!=='tringa')v-=3;
      if(lastT&&R.qaa&&p===R.dealer&&r.kind!=='free')v+=2;
      v+=(Math.random()*2-1)*noise;
      if(v>bv){bv=v;best={card:c,zone:z};}
    }
  }
  return best;
}
function botEscalate(p){
  const R=G.R;
  if(R.script){const e=R.script.esc;return e===undefined?true:e;}
  return Math.random()<[.7,.85,1][G.cfg.level];
}
function botBaroud(p,pick){
  const R=G.R,hand=R.hands[p],e=ent(p);
  const base={cards:[{card:pick.card,zone:pick.zone}],bar:null};
  if(!R.baroud||!R.bar[p].length)return base;
  if(R.script){
    const x=(R.script.bb[p]||[])[R.turn-1]||{};
    return x.bar?{...base,bar:x.bar,kv:x.kv,kt:x.kt,cz:x.cz}:base;
  }
  const lvl=G.cfg.level,k=[.4,.65,.95][lvl],last=R.turn===R.total,sc=tot(e);
  const oppBar=R.bar.reduce((a,b,q)=>a+(q!==p&&ent(q)!==e?b.length:0),0);
  for(const n of shuffle(R.bar[p].slice())){
    const m=mech(n);if(sc<m)continue;
    if(n==='Kelma'&&!last&&R.turn<R.total-1){
      let best=null,bc=0;
      for(const v of SEQ){
        const c=hand.filter(x=>x.v===v&&x.id!==pick.card.id).length+R.souk.filter(x=>x.v===v).length+R.medina.filter(x=>x.card.v===v).length;
        if(c>bc){bc=c;best=v;}
      }
      if(best&&bc>=2&&Math.random()<.8*k+.1)return {...base,bar:'Kelma',kv:best};
    }
    if(n==='Qontra'&&oppBar&&Math.random()<.3*k)return {...base,bar:'Qontra'};
    if(n==='Zerba'){const r=calc(p,pick.card,pick.zone);if(r.kind!=='free'&&Math.random()<.45*k)return {...base,bar:'Zerba'};}
    if(n==='Sber'){const r=calc(p,pick.card,pick.zone);if(r.kind==='free'&&Math.random()<.3*k)return {...base,bar:'Sber'};}
    if(n==='Khatf'&&sc>=m+1&&freeTargets().length&&Math.random()<.5*k)return {...base,bar:'Khatf'};
    if(n==='Aoud'&&sc>=m+1&&canAoud(p)&&R.cap[p]<5){
      let pair=null;
      for(const a of hand)for(const c of hand)if(!pair&&a.id<c.id&&a.v===c.v)pair=[a,c];
      if(pair&&Math.random()<.85*k)return {cards:[{card:pair[0],zone:'M'},{card:pair[1],zone:'M'}],bar:'Aoud'};
    }
    if(n==='Fal'&&sc>=m+1&&Math.random()<.12*k)return {...base,bar:'Fal'};
    if(n==='Chergui'&&!last&&sc>=m+1&&R.medina.some(x=>x.owner!==null&&ent(x.owner)!==e)&&Math.random()<.4*k)return {...base,bar:'Chergui'};
  }
  return base;
}

/* ---------- déroulé ---------- */
async function doRefresh(){
  const R=G.R;
  UI.phase='busy';
  for(let p=0;p<R.N;p++)R.hands[p].push(...R.refDeck.splice(0,2));
  render();
  await banner('Refresh +2','info',700);
}
function waitHuman(){return new Promise((res,rej)=>{UI.resolveSel=res;UI.rejectSel=rej;});}
async function turn(){
  const R=G.R,N=R.N;FAST=false;
  if(R.refresh.includes(R.turn))await doRefresh();
  UI.phase='select';UI.sel=null;UI.sel2=null;UI.bar=null;UI.kv=null;UI.pick=null;UI.pickMsg='';UI.picked=null;UI.reveal=null;
  UI.ready=Array(N).fill(false);UI.ready[0]=true;
  UI.allow=R.script?R.script.allow[R.turn-1]:null;
  const bots={};
  for(let p=1;p<N;p++)bots[p]=botBaroud(p,botPick(p));UI.botPays=bots;
  const t=G.tok;
  const promises=[];
  for(let p=1;p<N;p++){
    const delay=R.script?400+p*120:500+Math.random()*1500;
    promises.push(new Promise(res=>setTimeout(()=>{if(t!==G.tok)return;UI.ready[p]=true;renderTop();res();},delay)));
  }
  render();
  const h=await waitHuman();
  UI.phase='busy';render();
  await Promise.all(promises);
  if(t!==G.tok)throw ABORT;
  const pays=[h];for(let p=1;p<N;p++)pays.push(bots[p]);
  await resolveTurn(pays);
}
async function runRound(){
  const R=G.R;
  for(R.turn=1;R.turn<=R.total;R.turn++){await turn();}
  UI.phase='busy';
  if(R.baroud){
    for(let p=0;p<R.N;p++){
      const k=R.kelma[p];if(!k)continue;
      const hold=R.poudre?3:1,brk=R.poudre?1:2;
      if(k.held){addPts(ent(p),'kelma',hold);await banner('Kelma tenue ! +'+hold,kind(p),900);}
      else{
        for(let e=0;e<R.E;e++)if(e!==ent(p))addPts(e,'kelma',brk);
        await banner('Kelma rompue ! +'+brk,kind(p)==='pt'?'bot':'pt',900);
      }
    }
  }
  if(R.moul){
    render();await beat(300);
    const sz=R.pile.map(a=>a.length),mx=Math.max(...sz);
    const tops=sz.map((s,e)=>s===mx?e:-1).filter(e=>e>=0);
    if(tops.length===1&&mx>0){addPts(tops[0],'moul',R.moul);await banner('Moul Souk ! +'+R.moul,tops[0]===0?'pt':'bot',1000);}
    else await banner('Moul Souk : égalité','info',800);
  }
  if(R.poudre&&R.pot>0){
    const ts=R.sc.map((_,e)=>tot(e)),mx=Math.max(...ts);
    const tops=ts.map((s,e)=>s===mx?e:-1).filter(e=>e>=0);
    if(tops.length===1){addPts(tops[0],'pot',R.pot);await banner('Poudrière ! +'+R.pot,tops[0]===0?'pt':'bot',1000);}
    else{if(G.match)G.match.potCarry=R.pot;await banner('Poudre mouillée','info',900);}
  }
  render();await beat(300);
  await roundSummary();
}
async function safe(fn){try{await fn();}catch(e){if(e!==ABORT)console.error(e);}}

/* ---------- match ---------- */
function roundCfg(dealer){
  const M=MODES[G.cfg.mode];
  const o={N:M.n,teams:M.teams,dealer,exch:G.cfg.exch,qaa:G.cfg.qaa,makla:G.cfg.makla,baroud:G.cfg.baroud};
  o.moul=moulValue({N:o.N,teams:o.teams,makla:o.makla,baroud:o.baroud});
  return o;
}
function startMatch(){
  G.tok++;G.tuto=null;
  const M=MODES[G.cfg.mode];
  G.match={round:1,rounds:M.rounds,dealer:Math.floor(Math.random()*M.n),hist:[],tie:false,potCarry:0};
  showGame();
  safe(playRound);
}
async function playRound(){
  const m=G.match;
  G.R=newRound({...roundCfg(m.dealer),pot:m.potCarry||0});m.potCarry=0;
  UI.sel=null;UI.reveal=null;UI.phase='busy';render();
  await banner(m.dealer===0?'Tu donnes':seatName(m.dealer)+' donne','info',900);
  await runRound();
}
function tableRows(){
  const R=G.R,rows=[];
  if(R.poudre)rows.push(['Départ','base']);
  rows.push(['Annonces','ann'],['Missa','missa']);
  if(R.exch)rows.push(['Échanges','exch']);
  if(R.qaa)rows.push(['Qaa','qaa']);
  if(R.baroud)rows.push(['Mèches','meche'],['Kelma','kelma']);
  if(R.moul)rows.push(['Moul Souk','moul']);
  if(R.poudre)rows.push(['Poudrière','pot']);
  return rows.map(([l,k])=>({l,k,v:R.sc.map(s=>s[k])}));
}
function headCols(){const R=G.R;return R.sc.map((_,e)=>`<th>${entName(e)}</th>`).join('');}
async function roundSummary(){
  const R=G.R,m=G.match;
  if(G.tuto)return lessonEnd();
  const rs=R.sc.map((_,e)=>tot(e));
  m.hist.push(rs);
  const cum=R.sc.map((_,e)=>m.hist.reduce((a,h)=>a+h[e],0));
  const isLast=m.round>=m.rounds;
  let rowsHTML=tableRows().map(r=>`<tr class="fade"><td>${r.l}${r.k==='moul'?'<small>piles '+R.pile.map(a=>a.length).join(' – ')+'</small>':''}</td>${r.v.map(x=>'<td>'+(x||'–')+'</td>').join('')}</tr>`).join('');
  rowsHTML+=`<tr class="tot"><td>Manche ${m.round}${m.tie?' · départage':''}</td>${rs.map(x=>'<td>'+x+'</td>').join('')}</tr>`;
  const mx=Math.max(...cum),tops=cum.map((s,e)=>s===mx?e:-1).filter(e=>e>=0);
  let btn,act;
  if(!isLast){btn='Manche '+(m.round+1);act='next';}
  else if(tops.length>1){btn='Départage';act='tie';}
  else{btn='Résultat';act='end';}
  openSheet(`<h2>Fin de manche</h2><table class="sum"><tr><th></th>${headCols()}</tr>${rowsHTML}</table><button class="btn pri" id="sNext" style="width:100%;background:var(--saf);color:#140908">${btn}</button>`);
  const t=G.tok;
  await new Promise(res=>{$('#sNext').onclick=res;});
  if(t!==G.tok)throw ABORT;
  closeSheet();
  if(act==='next'){m.round++;m.dealer=(m.dealer+1)%R.N;m.tie=false;await playRound();}
  else if(act==='tie'){
    m.round++;m.rounds=m.round;m.tie=true;
    const free=[...Array(R.N).keys()].filter(p=>!tops.includes(ent(p)));
    m.dealer=free.length?free[0]:Math.floor(Math.random()*R.N);
    await playRound();
  }else matchEnd(cum);
}
function matchEnd(cum){
  const m=G.match,R=G.R;
  const mx=Math.max(...cum),mine=cum[0]===mx;
  const w=mine?'Victoire':'Défaite';
  const lines=m.hist.map((h,i)=>`<tr><td>Manche ${i+1}</td>${h.map(x=>'<td>'+x+'</td>').join('')}</tr>`).join('');
  openSheet(`<div class="big" style="color:${mine?'var(--saf-d)':'var(--fg)'}">${w}</div><table class="sum"><tr><th></th>${headCols()}</tr>${lines}<tr class="tot"><td>Total</td>${cum.map(x=>'<td>'+x+'</td>').join('')}</tr></table>
    <div class="row"><button class="btn" id="sMenu" style="flex:1;background:var(--panel2);color:var(--fg)">Menu</button><button class="btn pri" id="sAgain" style="flex:1.6;background:var(--saf);color:#140908">Rejouer</button></div>`,true);
  $('#sMenu').onclick=()=>{closeSheet();goHome();};
  $('#sAgain').onclick=()=>{closeSheet();startMatch();};
}

async function banner(txt,kd,ms){

function pop(e,text){
  const sc=document.querySelector('[data-score="'+e+'"]');if(!sc)return;
  const r=sc.getBoundingClientRect(),a=$('#app').getBoundingClientRect();
  const d=document.createElement('div');d.className='pop'+(e?' bot':'');d.textContent=text;
  d.style.left=(r.left-a.left-(text.length>3?20:0))+'px';d.style.top=(r.top-a.top+22)+'px';
  $('#fx').appendChild(d);setTimeout(()=>d.remove(),1200);
  sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump');
}
function fly(ids,target){
  const fx=$('#fx'),ar=$('#app').getBoundingClientRect(),tr=target?target.getBoundingClientRect():null;
  const ps=[];
  ids.forEach(id=>{
    const el=document.querySelector('[data-cid="'+id+'"]');if(!el)return;
    const r=el.getBoundingClientRect();
    const g=el.cloneNode(true);
    g.removeAttribute('data-cid');
    Object.assign(g.style,{position:'absolute',left:(r.left-ar.left)+'px',top:(r.top-ar.top)+'px',width:r.width+'px',height:r.height+'px',margin:'0',pointerEvents:'none',animation:'none'});
    g.style.setProperty('--cw',r.width+'px');g.style.setProperty('--ch',r.height+'px');
    g.classList.remove('hl');
    fx.appendChild(g);el.style.visibility='hidden';
    const dx=tr?(tr.left+tr.width/2)-(r.left+r.width/2):0,dy=tr?(tr.top+tr.height/2)-(r.top+r.height/2):-16;
    const kf=[{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+(tr?.35:.5)+')',opacity:tr?.85:0}];
    try{const a=g.animate(kf,{duration:FAST?120:480,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});ps.push(a.finished.catch(()=>{}).then(()=>g.remove()));}
    catch(e){g.remove();}
  });
  return Promise.all(ps);
}

function tryPlace(cid,zone){
  const R=G.R;if(!R||UI.phase!=='select')return;
  const c=R.hands[0].find(x=>x.id===cid);if(!c)return;
  const A=UI.allow,second=UI.bar==='Aoud'&&!!UI.sel;
  if(A){
    const ec=second?A.c2:A.code,ez=second?A.z2:A.zone;

}

    UI.bar=null;UI.kv=null;UI.sel2=null;render();return;

function Tfly(e,text){

  const n=Math.min(+m[2],6),plus=m[1]==='+';
  const tray=document.querySelector('[data-score="'+e+'"]');
  const src=plus?$('#bank'):tray,dst=plus?tray:($('#poud')||$('#bank'));
  if(!tray||!src||!dst)return;
  const ar=$('#app').getBoundingClientRect(),sr=src.getBoundingClientRect(),dr=dst.getBoundingClientRect();
  for(let i=0;i<n;i++){
    const d=document.createElement('i');d.className='jt flyt';
    d.style.left=(sr.left-ar.left+sr.width/2)+'px';d.style.top=(sr.top-ar.top+sr.height/2)+'px';
    $('#fx').appendChild(d);
    const dx=dr.left+dr.width/2-(sr.left+sr.width/2),dy=dr.top+dr.height/2-(sr.top+sr.height/2);
    try{
      const a=d.animate([{transform:'translate(0,0) scale(1.3)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale(1)',opacity:.9}],{duration:FAST?120:600,delay:i*90,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
      a.finished.catch(()=>{}).then(()=>d.remove());
    }catch(x){d.remove();}
  }
}

    const tr=tg.getBoundingClientRect();

      d.style.left=(sr.left-ar.left+sr.width/2-17)+'px';d.style.top=(sr.top-ar.top)+'px';
      $('#fx').appendChild(d);

}

async function Tguide(){
  const R=G.R,N=AD.N(),g=$('#game'),cut=$('#cut'),deck=$('#deckc');
  T.skip=false;
  const top=[7,10,11,12][Math.floor(Math.random()*4)];
  const low=SEQ.filter(v=>v<top);
  const vals=[],suits=[];
  for(let p=0;p<N;p++){vals[p]=p===R.dealer?top:low[Math.floor(Math.random()*low.length)];suits[p]=SUITS[Math.floor(Math.random()*4)];}
  const gr=g.getBoundingClientRect(),br=$('#board').getBoundingClientRect();

  deck.className='on';

  try{
    cut.innerHTML=ct(false);cut.className='on';
    await Tstep(0,'Coupez le paquet : la plus haute carte donne.','Couper');
    if(!T.skip){cut.innerHTML=ct(true);}
    await Tstep(0,'Donneur : '+AD.name(R.dealer)+'. Il prend le jeton Donneur.','Suivant');
    cut.className='';cut.innerHTML='';
    await Tstep(0,'Mélangez. Donnez 4 cartes à chacun.','Donner');
    await Tstep(2,'4 cartes chacun, face cachée.','Suivant',()=>Tdeal('hands'));
    await Tstep(3,R.souk.length+' cartes au Souk, face visible. Médina vide.','Suivant',()=>Tdeal('souk'));
    deck.className='';
    if(R.refDeck.length)await Tstep(4,'Mettez '+R.refDeck.length+' cartes de côté : paquet du Donneur. Le reste : écartées.','Suivant');

    await Tstep(5,'Banque de jetons et 7bl. Jeton Moul Souk +'+R.moul+'. Jetons de couleur devant chacun.','Suivant');

  }finally{
    cut.className='';cut.innerHTML='';deck.className='';
    delete g.dataset.gs;UI.gmsg=null;T.next=null;T.rej=null;$('#coach').innerHTML='';
    render();
  }

   POSE PHYSIQUE : zone neutre → carte scellée → glissée sur sa zone → Wach !
   ===================================================================== */
tryPlace=function(cid){Tselect(cid);};
function Tselect(cid){
  if(UI.phase!=='select'||UI.stage!=='pick')return;
  const R=G.R,c=R.hands[0].find(x=>x.id===cid);if(!c)return;
  const A=UI.allow;
  if(UI.sel&&UI.sel.card.id===cid){UI.sel=UI.sel2;UI.sel2=null;render();return;}
  if(UI.sel2&&UI.sel2.card.id===cid){UI.sel2=null;render();return;}
  const second=UI.bar==='Aoud'&&!!UI.sel;
  if(A){const ec=second?A.c2:A.code;if(c.code!==ec){nudge();return;}}
  if(second)UI.sel2={card:c,zone:null};else UI.sel={card:c,zone:null};
  vib(10);render();
}
function TallReady(){for(let p=1;p<AD.N();p++)if(!AD.ready(p))return false;return true;}
async function Tseal(){
  if(UI.phase!=='select'||UI.stage!=='pick'||!readySel())return;
  UI.stage='seal';render();
  try{
    while(!TallReady())await beat(120);
    const el=$('#pose');
    for(const k of [3,2,1]){
      el.innerHTML=`<div class="num">${k}</div>`;
      await beat(430);
    }
    el.innerHTML='';
    const sealed=[];
    for(let p=0;p<AD.N();p++){
      const n=p===0?(UI.bar==='Aoud'?2:1):((UI.botPays&&UI.botPays[p])?UI.botPays[p].cards.length:1);
      for(let k=0;k<n;k++)sealed.push({p,k,mine:p===0});
    }
    UI.sealed=sealed;UI.slideIdx=0;UI.stage='slide';
    render();
  }catch(e){$('#pose').innerHTML='';if(e!==ABORT)throw e;}
}
async function Tglide(from,to,col){
  if(!from||!to)return;
  const ar=$('#app').getBoundingClientRect(),fr=from.getBoundingClientRect(),tr=to.getBoundingClientRect();
  const g=document.createElement('div');g.className='flyc own'+col;
  Object.assign(g.style,{left:(fr.left-ar.left)+'px',top:(fr.top-ar.top)+'px',width:fr.width+'px',height:fr.height+'px'});
  $('#fx').appendChild(g);
  const dx=tr.left+tr.width/2-(fr.left+fr.width/2),dy=tr.top+tr.height-fr.height/2-(fr.top+fr.height/2)-10;
  try{const a=g.animate([{transform:'translate(0,0)'},{transform:'translate('+dx+'px,'+dy+'px)'}],{duration:FAST?120:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});a.finished.catch(()=>{}).then(()=>g.remove());}
  catch(x){g.remove();}
}
async function Tslide(zone){
  if(UI.stage!=='slide'||UI.phase!=='select')return;
  const mine=[UI.sel,UI.sel2].filter(Boolean),idx=UI.slideIdx||0,cur=mine[idx];
  if(!cur)return;
  const A=UI.allow;
  if(A&&zone!==(idx===0?A.zone:A.z2)){nudge();return;}
  cur.zone=zone;UI.slideIdx=idx+1;
  UI.stage='gliding';
  Tglide(document.querySelector('#neutral .nc.mine[data-ns="'+idx+'"]'),document.querySelector(Ttarget(zone,0)),AD.col(0));
  await beat(300);
  UI.sealed=UI.sealed.filter(s=>!(s.mine&&s.k===idx));
  if(UI.slideIdx<mine.length){UI.stage='slide';render();return;}
  // glissement simultané des cartes des autres joueurs
  for(const s of UI.sealed){
    const bp=UI.botPays&&UI.botPays[s.p];
    const z=bp&&bp.cards[s.k]?bp.cards[s.k].zone:zone;
    Tglide(document.querySelector('#neutral .nc[data-p="'+s.p+'"][data-k="'+s.k+'"]'),document.querySelector(Ttarget(z,s.p)),AD.col(s.p));
  }
  await beat(420);
  const pay={cards:mine.map(m=>({card:m.card,zone:m.zone})),bar:UI.bar,kv:UI.kv,kt:A&&A.kt,cz:A&&A.cz,qt:A&&A.qt};
  UI.stage=null;UI.sealed=[];UI.slideIdx=0;
  UI.phase='busy';
  if(UI.resolveSel){const f=UI.resolveSel;UI.resolveSel=null;f(pay);}
}
function TdragStart(e,el,o){
  const d={x:e.clientX,y:e.clientY,moved:false,ghost:null};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.onpointermove=ev=>{
    if(!d.moved&&Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>9){d.moved=true;d.ghost=o.ghost();document.body.appendChild(d.ghost);el.style.opacity='.25';}
    if(d.moved){d.ghost.style.left=ev.clientX+'px';d.ghost.style.top=ev.clientY+'px';if(o.over)o.over(ev);}
  };
  const fin=ev=>{
    el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null;
    if(d.ghost)d.ghost.remove();
    el.style.opacity='';
    if(o.over)o.over(null);
    if(ev.type!=='pointerup')return;
    if(d.moved)o.drop(ev);else if(o.tap)o.tap(ev);
  };
  el.onpointerup=fin;el.onpointercancel=fin;
}

/* tutoriel : la Baroud demandée est obligatoire avant de poser */
readySel=function(){
  const A=UI.allow;
  if(A&&A.bar&&UI.bar!==A.bar)return false;
  if(A&&A.bar==='Kelma'&&A.kv&&UI.kv!==A.kv)return false;
  if(A&&A.c2&&!UI.sel2)return false;
  return !!(UI.sel&&(UI.bar!=='Aoud'||UI.sel2)&&(UI.bar!=='Kelma'||UI.kv));
};

/* notifications : le texte s'adapte à la largeur de sa pastille */
function Tfit(b){
  const max=Math.max(160,$('#app').clientWidth-28);
  b.style.maxWidth=max+'px';
  let fs=parseFloat(getComputedStyle(b).fontSize)||30,n=0;
  while(b.scrollWidth>b.clientWidth+1&&fs>17&&n++<30){fs-=1.5;b.style.setProperty('font-size',fs+'px','important');}
  if(b.scrollWidth>b.clientWidth+1){b.style.whiteSpace='normal';b.style.textAlign='center';b.style.lineHeight='1.1';b.style.paddingTop='8px';}
}

/* =====================================================================
   PLATEAU 1v1 : Médina à gauche, Souk à droite, bandeaux Ronda / pile de capture,
   carte « zone neutre » au centre (plateau de référence)
   ===================================================================== */
function TneutralDuel(){
  const pick=UI.stage==='pick';
  let up='',dn='';
  if(pick)dn='<div class="nc ph"></div>';
  else (UI.sealed||[]).forEach(sl=>{
    if(sl.mine)dn+=`<div class="nc mine own${AD.col(0)}" data-ns="${sl.k}" role="button" aria-label="Ta carte scellée">${sl.k===0&&UI.bar?'<span class="bb">'+BARS[UI.bar].ar+'</span>':''}</div>`;
    else up+=`<div class="nc own${AD.col(sl.p)}" data-p="${sl.p}" data-k="${sl.k}"></div>`;
  });
  const cd=(!pick&&UI.stage==='seal')?'<span class="nt cd">3·2·1</span>':'';
  return `<div id="neutral" class="nz ${UI.stage==='slide'?'active':''}"><div class="nh up"><span class="nt">ZONE<br>NEUTRE</span><div class="ncs">${up}</div></div><div class="ndiv"></div><div class="nh dn"><span class="nt">ZONE<br>NEUTRE</span><div class="ncs">${dn}</div>${cd}</div></div>`;
}
function TzoneDuel(z){
  const R=G.R,S=z==='S',arr=S?R.souk:R.medina;
  const cards=arr.map(x=>{
    const c=cOf(z,x),own=S?null:x.owner;
    const cls='zc'+(UI.hl.has(c.id)?' hl':'')+(UI.newId===c.id?' new':'')+(UI.pick?(UI.pick.ids.has(c.id)?' pickable':' dim'):'');
    return `<div class="card s${c.s} ${cls}" data-cid="${c.id}" style="--r:${Tr(c.id)}deg">${cardInner(c)}${(S||own===null||own===undefined)?'':'<span class="tok own'+AD.col(own)+'"></span>'}</div>`;
  }).join('');
  let top='',bot='';
  const rv=UI.reveal;
  if(rv){
    const seen={};
    rv.plays.forEach(pl=>{
      let bb='';
      if(!seen[pl.p]){seen[pl.p]=true;const b=rv.bars[pl.p];if(b&&rv.flip)bb='<span class="bb'+(b.x?' x':'')+'">'+BARS[b.name].ar+'</span>';}
      if(pl.zone!==z||pl.done)return;
      const ord=rv.order&&rv.order[pl.p],cur=rv.active===pl.p;
      const f=`<div class="flip own${AD.col(pl.p)} ${rv.flip?'on':''}" data-cid="${pl.card.id}"><div class="in"><div class="face f1"><div class="card back"></div></div><div class="face f2"><div class="card s${pl.card.s}">${cardInner(pl.card)}</div></div></div>${ord?'<span class="ord '+(cur?'cur':'')+'">'+ord+'</span>':''}<span class="wn">${AD.name(pl.p)}</span>${bb}</div>`;
      if(pl.p===0)bot+=f;else top+=f;
    });
  }
  const A=UI.allow,slide=UI.phase==='select'&&UI.stage==='slide';
  const ready=slide?' ready':'';
  const hint=A&&slide&&(((UI.slideIdx||0)===0)?A.zone:A.z2)===z?' hint':'';
  const nm=S?'SOUK':'MÉDINA';
  return `<div class="zone ${S?'souk':'med'}${ready}${hint}" data-zone="${z}" tabindex="0" role="button" aria-label="${S?'Souk':'Médina'}">
    <div class="zl up">ZONE<br>${nm}</div><div class="zl dn">ZONE<br>${nm}</div>
    <div class="rs top">${top}</div><div class="rs bot">${bot}</div>
    <div class="zfree v3 ${arr.length>8?'dense':''}">${cards}</div></div>`;
}
function TbandDuel(p,side){
  const R=G.R;
  const up=p===1?' up':'';
  if(side==='M'){
    let gp='';
    R.garee[p].forEach(g=>{gp+=`<span class="gpair own${AD.col(p)}"><span class="mc s${g.cards[0].s}">${Tface(g.v)}</span><span class="mc s${g.cards[1].s}">${Tface(g.v)}</span><i class="cj"></i></span>`;});
    return `<div class="band l ${p===1?'t':'b'}"><span class="bnd${up}">ZONE<br>RONDA</span><span class="v4 bpairs">${gp}</span></div>`;
  }
  return `<div class="band r ${p===1?'t':'b'}"><span class="v4">${Tstack(p)}</span><span class="bnd${up}">PILE DE<br>CAPTURE</span></div>`;
}
function TboardDuel(){
  return TbandDuel(1,'M')+TbandDuel(1,'S')+TzoneDuel('M')+TzoneDuel('S')+TbandDuel(0,'M')+TbandDuel(0,'S')+Tneutral();
}

/* =====================================================================
   PLATEAU 3-4 JOUEURS (référence) : 4 bandeaux, 4 quadrants, croix de zones neutres
   Médina = TL + BR · Souk = TR + BL — chaque joueur a une Médina et un Souk devant lui
   ===================================================================== */
const PARTQ={S:{0:'BL',1:'TR',2:'TR',3:'BL'},M:{0:'BR',1:'BR',2:'TL',3:'TL'}};
const QTYPE={TL:'M',TR:'S',BL:'S',BR:'M'};
T.alt=0;
function Ttarget(z,p){
  if(AD.N()===2)return '.zone[data-zone="'+z+'"] '+(p===0?'.rs.bot':'.rs.top');
  return '.zone[data-part="'+PARTQ[z][p]+'"] .rs.p'+p;
}
/* partie physique d'une carte libre : devant le joueur qui l'a posée (stable tant que la carte ne change pas de zone) */
function Tqp(c,z,seat){
  if(c.qz!==z||c.qp===undefined){
    c.qz=z;
    c.qp=(seat===null||seat===undefined)?(z==='S'?((T.alt++%2)?'TR':'BL'):((T.alt++%2)?'TL':'BR')):PARTQ[z][seat];
  }
  return c.qp;
}
function TfreeCard(c,z,own){
  const cls='zc'+(UI.hl.has(c.id)?' hl':'')+(UI.newId===c.id?' new':'')+(UI.pick?(UI.pick.ids.has(c.id)?' pickable':' dim'):'');
  return `<div class="card s${c.s} ${cls}" data-cid="${c.id}" style="--r:${Tr(c.id)}deg">${cardInner(c)}${(z==='S'||own===null||own===undefined)?'':'<span class="tok own'+AD.col(own)+'"></span>'}</div>`;
}
function TflipHTML(pl,rv){
  const ord=rv.order&&rv.order[pl.p],cur=rv.active===pl.p;
  const b=rv.bars[pl.p];
  const bb=(b&&rv.flip&&!pl.second)?'<span class="bb'+(b.x?' x':'')+'">'+BARS[b.name].ar+'</span>':'';
  return `<div class="flip own${AD.col(pl.p)} ${rv.flip?'on':''}" data-cid="${pl.card.id}"><div class="in"><div class="face f1"><div class="card back"></div></div><div class="face f2"><div class="card s${pl.card.s}">${cardInner(pl.card)}</div></div></div>${ord?'<span class="ord '+(cur?'cur':'')+'">'+ord+'</span>':''}${bb}</div>`;
}
const QLAB={TL:'ZONE<br>MÉDINA',BR:'ZONE<br>MÉDINA',TR:'ZONE<br>SOUK',BL:'ZONE<br>SOUK'};
function Tq(q,cards,rsm){
  const z=QTYPE[q],S=z==='S',R=G.R;
  const A=UI.allow,slide=UI.phase==='select'&&UI.stage==='slide';
  const ready=slide?' ready':'';
  const hint=A&&slide&&(((UI.slideIdx||0)===0)?A.zone:A.z2)===z?' hint':'';
  let rs='';
  for(let p=0;p<R.N;p++)rs+=`<div class="rs p${p}">${rsm[p]||''}</div>`;
  return `<div class="zone ${S?'souk':'med'} q${q}${ready}${hint}" data-zone="${z}" data-part="${q}" tabindex="0" role="button" aria-label="${S?'Souk':'Médina'}">
    <div class="zl ${q}">${QLAB[q]}</div>${rs}<div class="zfree v3 ${cards.length>6?'dense':''}">${cards.join('')}</div></div>`;
}
function Tcell(p,kind,cls){
  const R=G.R,free=p>=R.N;
  const orient=['b','r','t','l'][p];
  let objs='',lab=kind==='R'?'ZONE<br>RONDA':'PILE DE<br>CAPTURE';
  if(!free){
    if(kind==='R'){
      R.garee[p].forEach(g=>{objs+=`<span class="gpair own${AD.col(p)}"><span class="mc s${g.cards[0].s}">${Tface(g.v)}</span><span class="mc s${g.cards[1].s}">${Tface(g.v)}</span><i class="cj"></i></span>`;});
    }else if(!R.teams||p<2){
      objs=Tstack(AD.ent(p));
    }
  }
  const first=/^(tbR|bbR|lbB|rbB)$/.test(cls);   // le centre est avant l'étiquette
  const lb=`<span class="bnd o${orient}">${lab}</span>`;
  const ob=`<span class="objs v4">${objs}</span>`;
  return `<div class="qb ${cls} o${orient}${free?' free':''}">${first?lb+ob:ob+lb}</div>`;
}
function Tquad(){
  const R=G.R,rv=UI.reveal;
  const cards={TL:[],TR:[],BL:[],BR:[]},rsm={TL:{},TR:{},BL:{},BR:{}};
  R.souk.forEach(c=>{const q=Tqp(c,'S',c.own);cards[q].push(TfreeCard(c,'S',null));});
  R.medina.forEach(x=>{const q=Tqp(x.card,'M',x.owner);cards[q].push(TfreeCard(x.card,'M',x.owner));});
  if(rv){
    const seen={};
    rv.plays.forEach(pl=>{
      if(pl.done)return;
      const q=PARTQ[pl.zone][pl.p];
      pl.second=!!seen[pl.p];seen[pl.p]=true;
      rsm[q][pl.p]=(rsm[q][pl.p]||'')+TflipHTML(pl,rv);
    });
  }
  return Tcell(2,'R','tbL')+Tcell(2,'P','tbR')
    +Tcell(3,'R','lbT')+Tq('TL',cards.TL,rsm.TL)+Tq('TR',cards.TR,rsm.TR)+Tcell(1,'P','rbT')
    +Tcell(3,'P','lbB')+Tq('BL',cards.BL,rsm.BL)+Tq('BR',cards.BR,rsm.BR)+Tcell(1,'R','rbB')
    +Tcell(0,'P','bbL')+Tcell(0,'R','bbR')+Tneutral();
}
function Tneutral4(){
  if(UI.phase!=='select')return '';
  const R=G.R,N=R.N,pick=UI.stage==='pick';
  const pos={0:'b',1:'r',2:'t',3:'l'};
  let h='';
  for(const p of [2,0,3,1]){
    const free=p>=N;
    let cs='';
    if(p===0){
      if(pick)cs='<div class="nc ph"></div>';
      else (UI.sealed||[]).filter(x=>x.mine).forEach(x=>{cs+=`<div class="nc mine own${AD.col(0)}" data-ns="${x.k}" role="button" aria-label="Ta carte scellée">${x.k===0&&UI.bar?'<span class="bb">'+BARS[UI.bar].ar+'</span>':''}</div>`;});
    }else if(!pick){
      (UI.sealed||[]).filter(x=>x.p===p).forEach(x=>{cs+=`<div class="nc own${AD.col(p)}" data-p="${p}" data-k="${x.k}"></div>`;});
    }
    h+=`<div class="nzc ${pos[p]}${free?' free':''}" data-seat="${p}"><span class="nt">ZONE<br>NEUTRE</span><div class="ncs">${cs}</div></div>`;
  }
  return `<div id="neutral" class="nz4 ${UI.stage==='slide'?'active':''}">${h}</div>`;
}
/* plateau carré : la taille interne (--bs) suit le côté du plateau */
function Tsquare(){
  const bd=$('#board');if(!bd||!bd.classList.contains('quad'))return;
  bd.style.flex='1 1 0';bd.style.width='';bd.style.height='';
  const pw=bd.parentNode.clientWidth-12,h=bd.clientHeight;

}
window.addEventListener('resize',()=>{if(G.R)Tsquare();});

/* =====================================================================
   HISTORIQUE DES COUPS — depuis la pause, la fin de manche et la fin de match
   ===================================================================== */
const HL={log:[],pending:[],cur:null};
const HFR={B:'♣',C:'♥',E:'♠',D:'♦'},HFV={1:'A',10:'J',11:'Q',12:'K'},HSH={B:'Bât.',C:'Cou.',E:'Ép.',D:'Den.'};
function Hn(p){
  if(typeof seatName==='function')return seatName(p);
  return p===0?'Toi':(G.tuto?'Le Marchand':BOTS[G.cfg.level].n);
}
function HEn(e){return (typeof entName==='function')?entName(e):Hn(e);}
function Hcard(c){
  if(G.R&&G.R.baroud)return (HFV[c.v]||c.v)+HFR[c.s];
  return c.v+' '+HSH[c.s];
}
const HZ={S:'Souk',M:'Médina'};
const HK={ann:'annonce',missa:'Missa',exch:'échange',qaa:'Qaa',moul:'Moul Souk',meche:'mèche',kelma:'Kelma',pot:'Poudrière'};
function Hround(){return G.match?G.match.round:0;}
function Hesc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function HLpts(e,k,g){
  const t=(g>0?'+':'')+g+' '+(HK[k]||k)+(k==='ann'&&g===0?' (plafond)':'')+' — '+HEn(e);
  if(g===0&&k!=='ann')return;
  if(HL.cur)HL.cur.pts.push(t);else HL.pending.push({k:'pts',t});
}
const _Hap=addPts;
addPts=function(a,b,c){const g=_Hap(a,b,c);HLpts(a,b,g);return g;};
if(typeof addAnn==='function'){
  const _Haa=addAnn;
  addAnn=function(p,pts){const g=_Haa(p,pts);HLpts(ent(p),'ann',g);return g;};
}
const _Hap2=applyRes;
applyRes=async function(r){
  if(HL.cur){
    HL.cur.res.push({p:r.p,t:Hcard(r.c),z:r.z,kind:r.kind,missa:!!r.missa,
      taken:r.taken.map(x=>(x.pile!==undefined?'pile ('+Hcard(x.card)+')':Hcard(cOf(r.z,x))))});
  }
  return _Hap2(r);
};
const HSKIP=/^((Zerba|Sber|Aoud|Fal|Qontra|Khatf|Kelma|Chergui) !$)|^(Wach|Refresh|Le Donneur distribue|Tu donnes|.+ donne$|Ronda|Tringa|Missa|Qaa|Moul Souk|Kelma tenue|Kelma rompue|Poudrière|Poudre)/;
const _Hbn=banner;
banner=function(txt,kd,ms){
  try{
    const t=String(txt).replace(/<[^>]+>/g,'');
    if(kd!=='wach'&&!HSKIP.test(t)){
      if(HL.cur)HL.cur.notes.push(t);else HL.pending.push({k:'note',t});
    }
  }catch(e){}
  return _Hbn(txt,kd,ms);
};
const _Hrf=doRefresh;
doRefresh=async function(){HL.pending.push({k:'note',t:'Le Donneur distribue 2 cartes à chaque joueur'});return _Hrf();};
const _Hrt=resolveTurn;
resolveTurn=async function(...a){
  const pays=(a.length===1&&Array.isArray(a[0]))?a[0]:a,R=G.R;
  const e={round:Hround(),turn:R.turn,total:R.total,
    plays:pays.map((x,p)=>({p,n:Hn(p),cards:x.cards.map(c=>({t:Hcard(c.card),z:c.zone})),bar:x.bar||null,kv:x.kv||null})),
    res:[],pts:[],notes:[],pre:HL.pending.filter(x=>x.k==='note').map(x=>x.t),done:false};
  HL.pending=HL.pending.filter(x=>x.k==='pts');
  HL.cur=e;HL.log.push(e);
  try{return await _Hrt(...a);}finally{e.done=true;HL.cur=null;}
};
const _Hrs=roundSummary;
roundSummary=async function(){
  const R=G.R;
  if(HL.pending.length||true){
    const e={round:Hround(),turn:null,end:true,res:[],pts:HL.pending.filter(x=>x.k==='pts').map(x=>x.t),
      notes:HL.pending.filter(x=>x.k==='note').map(x=>x.t),plays:[],pre:[],done:true};
    HL.pending=[];
    if(e.pts.length||e.notes.length)HL.log.push(e);
  }
  return _Hrs();
};
const _Hsm=startMatch;
startMatch=function(){HL.log=[];HL.pending=[];HL.cur=null;_Hsm();};
if(typeof startLesson==='function'){
  const _Hsl=startLesson;
  startLesson=function(i){HL.log=[];HL.pending=[];HL.cur=null;_Hsl(i);};
}
function Hhtml(round){
  const rounds=[...new Set(HL.log.map(e=>e.round))].sort((a,b)=>a-b);
  if(!rounds.length)return '<div class="sub">Aucun coup joué pour l’instant.</div>';
  if(round===undefined||!rounds.includes(round))round=rounds[rounds.length-1];
  const chips=rounds.length>1?'<div class="hchips">'+rounds.map(r=>`<button class="hchip${r===round?' on':''}" data-r="${r}">Manche ${r||1}</button>`).join('')+'</div>':'';
  const body=HL.log.filter(e=>e.round===round&&(e.done||e.end)).map(e=>{
    if(e.end)return `<div class="he"><div class="hh">Fin de manche</div>${e.pts.map(t=>'<div class="hp">'+Hesc(t)+'</div>').join('')}${e.notes.map(t=>'<div class="hn">'+Hesc(t)+'</div>').join('')}</div>`;
    const pl=e.plays.map(p=>`<div class="hl"><b>${Hesc(p.n)}</b> · ${p.cards.map(c=>Hesc(c.t)+' → '+HZ[c.z]).join(' et ')}${p.bar?' · <i>✦ '+Hesc(p.bar)+(p.kv?' '+p.kv:'')+'</i>':''}</div>`).join('');
    const rs=e.res.map(r=>{
      const who=Hesc(Hn(r.p)),z=HZ[r.z];
      let t;
      if(r.kind==='free')t=`${Hesc(r.t)} reste libre (${z})`;
      else if(r.kind==='ronda')t=`${Hesc(r.t)} fait une Ronda (${z})`;
      else if(r.kind==='tringa')t=`${Hesc(r.t)} fait une Tringa (${z})`;
      else t=`${Hesc(r.t)} capture ${r.taken.length?Hesc(r.taken.join(', ')):'—'} (${z})${r.missa?' · Missa':''}`;
      return `<div class="hr"><b>${who}</b> : ${t}</div>`;
    }).join('');
    const pts=e.pts.map(t=>'<div class="hp">'+Hesc(t)+'</div>').join('');
    const nt=e.pre.concat(e.notes).map(t=>'<div class="hn">'+Hesc(t)+'</div>').join('');
    return `<div class="he"><div class="hh">Tour ${e.turn}/${e.total}</div>${nt?nt:''}${pl}${rs}${pts}</div>`;
  }).join('')||'<div class="sub">Aucun coup terminé dans cette manche.</div>';
  return chips+'<div class="hbody">'+body+'</div>';
}
function Hopen(round){
  let el=document.getElementById('hist');
  if(!el){el=document.createElement('div');el.id='hist';el.className='sheet on';$('#app').appendChild(el);}
  const draw=r=>{
    el.innerHTML='<div class="sc"><h2>Historique des coups</h2>'+Hhtml(r)+'<button class="btn" id="hX" style="width:100%;margin-top:12px;background:var(--panel2);color:var(--fg)">Fermer</button></div>';
    el.querySelectorAll('.hchip').forEach(b=>b.onclick=()=>draw(+b.dataset.r));
    el.querySelector('#hX').onclick=()=>el.remove();
    const bd=el.querySelector('.hbody');if(bd)bd.scrollTop=bd.scrollHeight;
  };
  draw(round);
}
const _Hos=openSheet;
openSheet=function(html,mid){
  _Hos(html,mid);
  try{
    const sc=document.querySelector('#sheet .sc');if(!sc)return;
    const mk=()=>{const b=document.createElement('button');b.className='btn';b.id='histBtn';b.style.cssText='width:100%;background:var(--panel2);color:var(--fg);margin-bottom:10px';b.textContent='Historique des coups';b.onclick=()=>Hopen(Hround());return b;};
    if(html.indexOf('<h2>Pause</h2>')===0){sc.insertBefore(mk(),sc.querySelector('.xbtns'));}
    else if(html.indexOf('<h2>Fin de manche</h2>')===0){const n=sc.querySelector('#sNext');n.parentNode.insertBefore(mk(),n);}
    else if(html.indexOf('id="sAgain"')>0){const r=sc.querySelector('.row');r.parentNode.insertBefore(mk(),r);}
  }catch(e){}
};

/* ===== affichage adaptatif : tablette et ordinateur ===== */
(function(){
  let last=0,lw=0;
  function apply(){
    const vw=window.innerWidth,vh=window.innerHeight;
    let u=Math.min(vh/780,vw/400);u=Math.max(1,Math.min(u,1.7));u=Math.round(u*100)/100;
    let wf=Math.max(1,Math.min(1.7,(vw/vh)/0.72));wf=Math.round(wf*100)/100;
    if(Math.abs(u-last)<0.02&&Math.abs(wf-lw)<0.03)return;
