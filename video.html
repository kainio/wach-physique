<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wach?! — vidéo explicative</title>
<meta name="theme-color" content="#C85B1D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#140908;color:#F1E7D5;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
#vid{position:fixed;inset:0;display:flex;flex-direction:column;background:#140908}
header{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 8px}
h1{margin:0;flex:1;font-family:'Reem Kufi',sans-serif;font-size:24px;line-height:1.1}
.b{height:42px;padding:0 14px;border:0;border-radius:13px;background:#F1E7D522;color:#F1E7D5;font:700 14px system-ui;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.vb{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 0 max(12px,env(safe-area-inset-bottom))}
video{width:100%;flex:1;min-height:0;background:#000;display:block;object-fit:contain}
</style>
</head>
<body>
<div id="vid" data-k="">
  <header><a class="b" href="index.html" aria-label="Menu principal">&larr;</a><h1>Vidéo explicative</h1><button class="b" id="vidSw"></button></header>
  <div class="vb"><video id="v" controls playsinline preload="metadata"></video></div>
</div>
<script>
/* même lecteur que la fenêtre « Vidéo explicative » du jeu : verticale en portrait, horizontale en paysage, bouton pour basculer */
const VID={v:{src:'explainer-vertical.mp4',poster:'explainer-vertical-poster.jpg'},h:{src:'explainer.mp4',poster:'explainer-poster.jpg'}};
const v=document.getElementById('v'),el=document.getElementById('vid'),sw=document.getElementById('vidSw');
let snd=true;try{snd=localStorage.getItem('wach_snd')!=='0';}catch(e){}
function play(k){
  const o=VID[k];v.muted=!snd;v.setAttribute('poster',o.poster);v.src=o.src;v.load();
  const p=v.play();if(p&&p.catch)p.catch(()=>{});
  el.setAttribute('data-k',k);sw.textContent=k==='v'?'Passer en horizontal':'Passer en vertical';
}
sw.onclick=()=>play(el.getAttribute('data-k')==='v'?'h':'v');
play(innerHeight>innerWidth*1.05?'v':'h');
</script>
</body>
</html>
