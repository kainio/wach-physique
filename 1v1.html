  <div id="banner"></div>
  <div id="sheet" class="sheet"></div>
</div>

<script>
'use strict';
/* =====================================================================
   WACH?! — prototype mobile · duel vs bot · Standard Bo2 · Échanges + Qaa
   ===================================================================== */
const SEQ=[1,2,3,4,5,6,7,10,11,12];
const SUITS=['B','C','E','D'];
const SN={B:'Trèfle',C:'Cœur',E:'Pique',D:'Carreau'};
const NAMES={10:'Valet',11:'Dame',12:'Roi'};
const BOTS=[
  {n:'Louis',l:'Facile',a:'L'},
  {n:'Emma',l:'Moyen',a:'E'},
  {n:'Hugo',l:'Difficile',a:'H'}
];
const BARS={
  Premier:{ar:'8♣',m:0,d:'Tu résous en premier.'},
  Dernier:{ar:'8♥',m:0,d:'Tu résous en dernier.'},
  Encore:{ar:'9♣',m:1,d:'Deux cartes ce tour. +1 carte.'},
  Indice:{ar:'9♥',m:0,d:'Vois 3 cartes écartées.'},
  Contre:{ar:'8♠',m:0,d:'Annule sa carte.'},
  Vol:{ar:'9♠',m:1,d:'Prends une carte libre.'},
  Pari:{ar:'8♦',m:0,d:'Annonce une valeur, capture-la plus tard.'},
  Bouclier:{ar:'9♦',m:0,d:'Protège une carte libre pour le tour.'}
};
const ABORT=Symbol('abort');
const $=s=>document.querySelector(s);
const G={cfg:{level:0,exch:false,qaa:false,fmt:'light',makla:false,baroud:false},tok:0,match:null,R:null,tuto:null};
const UI={phase:'idle',sel:null,picked:null,oppReady:false,reveal:null,hl:new Set(),newId:null,allow:null,dragOver:null,sel2:null,bar:null,kv:null,pick:null,pickMsg:''};
let FAST=false,UID=0;

/* ---------- utilitaires ---------- */
function beat(ms){
  const t=G.tok;
  return new Promise(r=>setTimeout(r,FAST?Math.min(ms*.25,140):ms)).then(()=>{if(t!==G.tok)throw ABORT;});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mk(v,s){return {id:++UID,v,s,code:v+s};}
function mkCode(code){const m=/^(\d+)([BCED])$/.exec(code);return mk(+m[1],m[2]);}
function fullDeck(){const d=[];for(const s of SUITS)for(const v of SEQ)d.push(mk(v,s));return d;}
function tot(p){const s=G.R.sc[p];let t=0;for(const k in s)t+=s[k];return t;}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- moteur ---------- */
function newRound(o){
  const z=()=>({base:o.baroud?3:0,ann:0,missa:0,exch:0,qaa:0,moul:0,meche:0,kelma:0,pot:0});
  const R={total:o.total,refresh:o.refresh,exch:o.exch,qaa:o.qaa,moul:o.moul,dealer:o.dealer,turn:1,
    hands:[[],[]],souk:[],medina:[],pile:[[],[]],garee:[[],[]],discard:[],refDeck:[],reserve:[],
    cap:[0,0],sc:[z(),z()],script:o.script||null,makla:!!o.makla,pt:[0,0],
    baroud:!!o.baroud,bar:[[],[]],pot:o.pot||0,kelma:[null,null]};
  if(o.rig){
    const L=o.rig;
    R.hands[0]=L.me.map(mkCode);R.hands[1]=L.bot.map(mkCode);
    R.souk=L.souk.map(mkCode);R.reserve=(L.reserve||[]).map(mkCode);
    if(o.baroud&&L.bar)R.bar=[L.bar[0].slice(),L.bar[1].slice()];
  }else{
    const d=shuffle(fullDeck());
    R.hands[0]=d.splice(0,4);R.hands[1]=d.splice(0,4);R.souk=d.splice(0,4);
    R.refDeck=d.splice(0,R.refresh.length*4);
    R.reserve=(R.exch||R.baroud)?d.splice(0,5):[];
    R.discard=d; // écartées : jamais regardées
    if(R.baroud){const n=shuffle(Object.keys(BARS));R.bar=[n.slice(0,2),n.slice(2,4)];}
  }
  return R;
}
const cOf=(z,x)=>z==='S'?(x.pile!==undefined?x.card:x):x.card;
function soukArr(p){
  const R=G.R;if(!R.makla)return R.souk;
  const ps=[];
  for(const q of [0,1]){if(q!==p&&R.pile[q].length&&R.pt[q]<R.turn)ps.push({pile:q,card:R.pile[q][R.pile[q].length-1]});}
  return [...R.souk,...ps];
}
function canEsc(p){
  const R=G.R;if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (R.hands[p].length-1+comp)+futR>=futT;
}
function calc(p,c,z){
  const R=G.R,S=z==='S',arr=(S?soukArr(p):R.medina).filter(x=>!veilOn(cOf(z,x)));
  const eq=arr.filter(x=>cOf(z,x).v===c.v);
  const groups=[];let taken=[];
  if(eq.length){
    groups.push(eq);taken=eq.slice();
    const i=SEQ.indexOf(c.v);
    for(let k=1;k<=2;k++){
      const nv=SEQ[i+k];if(nv===undefined)break;
      const g=arr.filter(x=>cOf(z,x).v===nv);
      if(!g.length)break;
      groups.push(g);taken.push(...g);
    }
  }
  const r={p,c,z,taken,groups,kind:'free',ann:0,missa:false,pair:null,trio:null,gi:-1,own:null};
  if(S){
    if(taken.length){r.kind='cap';const pl=taken.filter(x=>x.pile===undefined).length;r.missa=pl>0&&pl===R.souk.length;}
  }else{
    const gi=R.garee[p].findIndex(g=>g.v===c.v);
    const own=eq.find(x=>x.owner===p);
    // jeu défensif : une carte de même valeur déjà en Médina (ou jouée ce tour avec l’échange) bloque la Tringa
    const simul=!!(R.exch&&R.curPlays&&R.curPlays.some(pl=>!pl.done&&pl.card.id!==c.id&&pl.zone==='M'&&pl.card.v===c.v&&pl.p!==p));
    if(gi>=0&&eq.length===0&&!simul){r.kind='tringa';r.gi=gi;r.ann=3;}
    else if(own){r.kind='ronda';r.own=own;r.ann=2;}
    else if(taken.length){r.kind='cap';}
  }
  return r;
}
function addPts(p,kind,pts){
  const R=G.R;let g=pts;
  if(kind==='ann'){g=Math.min(pts,6-R.cap[p]);R.cap[p]+=g;}
  R.sc[p][kind]+=g;
  pop(p,g>0?'+'+g:'plafond');
  if(g>0)vib(p===0?25:0);
  return g;
}
function remFrom(arr,ids){for(let i=arr.length-1;i>=0;i--){const x=arr[i];if(ids.has(x.card?x.card.id:x.id))arr.splice(i,1);}}

async function applyRes(r){
  const R=G.R,p=r.p,S=r.z==='S';
  const tkCards=r.taken.map(x=>cOf(r.z,x));
  const done=()=>{if(r.play)r.play.done=true;};
  noteCap(p,[...tkCards,...((r.kind==='ronda'||r.kind==='tringa')?[r.c]:[])]);
  if(r.groups.length){
    UI.hl=new Set();
    for(const g of r.groups){g.forEach(x=>UI.hl.add(cOf(r.z,x).id));render();await beat(430);}
  }
  if(r.kind==='free'){
    r.c.own=p;if(S)R.souk.push(r.c);else R.medina.push({card:r.c,owner:tokUse(p)<TOKMAX?p:null,by:p});
    UI.newId=r.c.id;done();render();await beat(420);UI.newId=null;return;
  }
  const idsAll=new Set(tkCards.map(c=>c.id));
  if(S){
    const plainE=r.taken.filter(x=>x.pile===undefined),pileE=r.taken.filter(x=>x.pile!==undefined);
    await fly([...idsAll,r.c.id],document.querySelector('[data-pile="'+p+'"]'));
    remFrom(R.souk,new Set(plainE.map(c=>c.id)));
    const stolen=pileE.flatMap(e=>R.pile[e.pile].splice(0));
    R.pile[p].push(...stolen,...plainE,r.c);R.pt[p]=R.turn;
    if(stolen.length)pop(p,'+'+stolen.length+' pile');
    UI.hl=new Set();done();UI.bump=p;render();UI.bump=null;
    if(r.missa){addPts(p,'missa',1);await banner('Missa ! +1',p?'bot':'pt');}
    else await beat(250);
    return;
  }
  // Médina : les captures sortent du jeu (sauf paire garée / trio)
  if(r.kind==='ronda'){
    const exit=tkCards.filter(c=>c.id!==r.own.card.id);
    await fly([...exit.map(c=>c.id)],null);
    remFrom(R.medina,idsAll);R.discard.push(...exit);
    R.garee[p].push({v:r.c.v,cards:[r.own.card,r.c]});
    UI.hl=new Set();done();render();
    const g=addPts(p,'ann',2);
    await banner(g<2?'Ronda ! plafond':'Ronda ! +2',p?'bot':'pt');return;
  }
  if(r.kind==='tringa'){
    const pr=R.garee[p][r.gi];
    await fly([...idsAll],null);
    remFrom(R.medina,idsAll);R.discard.push(...tkCards);
    R.garee[p].splice(r.gi,1);
    await fly([r.c.id],document.querySelector('[data-pile="'+p+'"]'));
    R.pile[p].push(...pr.cards,r.c);R.pt[p]=R.turn;
    UI.hl=new Set();done();UI.bump=p;render();UI.bump=null;
    const g=addPts(p,'ann',3);
    await banner(g<3?'Tringa ! plafond':'Tringa ! +3',p?'bot':'pt',900);return;
  }
  // capture défensive en Médina
  await fly([...idsAll,r.c.id],null);
  remFrom(R.medina,idsAll);R.discard.push(...tkCards,r.c);
  UI.hl=new Set();done();render();await beat(300);
}

async function doExchange(f,s){
  const R=G.R,S=f.zone==='S';
  // la carte libre du premier quitte la zone
  const fid=new Set([f.card.id]);
  if(S)remFrom(R.souk,fid);else remFrom(R.medina,fid);
  const pool=[f.card,s.card];
  let last=s.p,pts=1,name='Un';
  render();
  await banner('Un ! +1',s.p?'bot':'ex',800);
  const stages=[{p:f.p,name:'Trois',pts:3},{p:s.p,name:'Cinq',pts:5}];
  for(const st of stages){
    const extra=R.hands[st.p].find(c=>c.v===f.card.v);
    if(!extra||!canEsc(st.p))break;
    let yes;
    if(st.p===0)yes=await promptEscalate(extra,st);
    else yes=botEscalate(S);
    if(!yes)break;
    R.hands[st.p]=R.hands[st.p].filter(c=>c.id!==extra.id);
    pool.push(extra);last=st.p;pts=st.pts;name=st.name;
    let comp=false;
    if(R.reserve.length){R.hands[st.p].push(R.reserve.pop());comp=true;}
    render();
    await banner(name+' ! +'+pts,st.p?'bot':'ex',850);
    if(comp)pop(st.p,'+1 carte');
  }
  addPts(last,'exch',pts);noteCap(last,pool);
  const ids=pool.map(c=>c.id);
  if(S){
    if(f.play)f.play.done=true;if(s.play)s.play.done=true;
    await fly(ids,document.querySelector('[data-pile="'+last+'"]'));
    R.pile[last].push(...pool);R.pt[last]=R.turn;UI.bump=last;
  }else{
    if(f.play)f.play.done=true;if(s.play)s.play.done=true;
    await fly(ids,null);R.discard.push(...pool);
  }
  render();UI.bump=null;
  await banner((last?'Il':'Tu')+' prend l’échange',last?'bot':'ex',650);
  return last;
}

function noteCap(p,cards){
  const R=G.R,k=R.kelma&&R.kelma[p];
  if(!k||R.turn<=k.turn)return;
  if(cards.some(c=>c.v===k.v))k.held=true;
}
function onBoard(card){
  const R=G.R;return R.souk.some(c=>c.id===card.id)||R.medina.some(x=>x.card.id===card.id);
}
function freeTargets(){
  const R=G.R,t=[];
  R.souk.forEach(c=>{if(!veilOn(c))t.push({card:c,zone:'S',owner:c.own===undefined?null:c.own});});
  R.medina.forEach(x=>{if(!veilOn(x.card))t.push({card:x.card,zone:'M',owner:x.owner});});
  return t;
}
function canAoud(p){
  const R=G.R,h=R.hands[p].length;
  if(h<2)return false;
  if(R.script)return true;
  const comp=R.reserve.length>0?1:0;
  const futT=R.total-R.turn,futR=2*R.refresh.filter(t=>t>R.turn).length;
  return (h-2+comp)+futR>=futT;
}
function pickTarget(T,only){
  return new Promise((res,rej)=>{
    UI.pick={ids:new Set(T.filter(t=>!only||t.card.code===only).map(t=>t.card.id)),res,list:T};
    UI.pickMsg='Vol : touche une carte libre.';
    UI.rejectP=rej;render();
  });
}
function botKhatfTarget(bi,T){
  let best=null,bv=0;
  for(const t of T){
    let v;
    if(t.zone==='S')v=t.owner===bi?.2:1;
    else v=t.owner===bi?-5:(t.owner===null?.6:1.4);
    v+=Math.random()*.3;
    if(v>bv){bv=v;best=t;}
  }
  return best;
}
async function doKhatf(p,kt){
  const R=G.R,T=freeTargets();
  if(!T.length){await banner('Vol : rien à prendre','info',700);return;}
  let tgt=null;
  if(R.script&&kt)tgt=T.find(t=>t.card.code===kt)||null;
  if(!tgt&&p===0){
    tgt=await pickTarget(T,null);
    UI.pick=null;UI.pickMsg='';
  }
  if(!tgt)tgt=botKhatfTarget(p,T)||T[0];
  await banner('Vol !',p?'bot':'ex',600);
  UI.hl=new Set([tgt.card.id]);render();await beat(380);
  const ids=new Set([tgt.card.id]);
  if(tgt.zone==='S'){
    await fly([tgt.card.id],document.querySelector('[data-pile="'+p+'"]'));
    remFrom(R.souk,ids);R.pile[p].push(tgt.card);R.pt[p]=R.turn;UI.bump=p;
  }else{
    await fly([tgt.card.id],null);remFrom(R.medina,ids);R.discard.push(tgt.card);
  }
  UI.hl=new Set();render();UI.bump=null;
  noteCap(p,[tgt.card]);
}
/* Bouclier (le voile) : protège une carte libre du plateau jusqu’à la fin du tour ; rien ne bouge, aucun jeton n’est posé */
function veilOn(c){const R=G.R;return !!(R&&R.veil&&R.veil.id===c.id);}
function veilCls(c){return (veilOn(c)||(UI.phase==='select'&&UI.vt&&UI.vt.id===c.id))?' veiled':'';}
function veilTargets(){
  const R=G.R,t=[];
  R.souk.forEach(c=>t.push({id:c.id,z:'S',card:c}));
  R.medina.forEach(x=>t.push({id:x.card.id,z:'M',card:x.card}));
  return t;
}
function botVeil(p){
  const R=G.R,T=veilTargets();if(!T.length)return null;
  const hand=R.hands[p];
  // priorité : protéger une base de Ronda dont il tient la seconde carte
  const own=T.filter(t=>t.z==='M'&&R.medina.some(x=>x.card.id===t.id&&x.owner===p)&&hand.some(h=>h.v===t.card.v));
  if(own.length)return {id:own[0].id,z:own[0].z};
  // sinon une carte du Souk dont il garde la valeur en main (pour la prendre au tour suivant)
  const sk=T.filter(t=>t.z==='S'&&hand.some(h=>h.v===t.card.v));
  if(sk.length&&Math.random()<.5)return {id:sk[0].id,z:'S'};
  return null;
}
async function applyVeil(p,vt,fx){
  const R=G.R,T=veilTargets();
  let t=null;
  if(vt&&typeof vt==='object')t=T.find(x=>x.id===vt.id)||null;
  else if(typeof vt==='string')t=T.find(x=>x.card.code===vt)||null;
  if(!t){await banner('Bouclier : rien à protéger','info',700);return;}
  R.veil={id:t.id,z:t.z,by:p};
  await banner('Bouclier !',fx,700);
  UI.hl=new Set([t.id]);render();await beat(520);UI.hl=new Set();render();
}
function endVeil(){const R=G.R;if(R&&R.veil){R.veil=null;render();}}
function pickVeil(){
  const T=veilTargets();
  const mk=t=>`<button class="vc" data-vi="${t.id}"><div class="card s${t.card.s}" style="--cw:46px;--ch:64px">${cardInner(t.card)}</div><small>${t.z==='S'?'Souk':'Médina'}</small></button>`;
  openSheet('<h2>Bouclier</h2><div class="sub">Quelle carte protéger ?</div><div class="vcg">'+T.map(mk).join('')+'</div><button class="btn" id="vNo" style="width:100%;background:var(--panel2);color:var(--fg);margin-top:10px">Annuler</button>');
  document.querySelectorAll('[data-vi]').forEach(b=>b.onclick=()=>{
    const t=T.find(x=>String(x.id)===b.dataset.vi);if(!t)return;
    UI.vt={id:t.id,z:t.z};closeSheet();render();
  });
  $('#vNo').onclick=()=>{UI.bar=null;UI.vt=null;closeSheet();render();};
}
/* jetons de couleur : 6 par joueur ; sans jeton disponible, la carte libre reste sans jeton (pas de Ronda possible) */
const TOKMAX=6;
function tokUse(p){const R=G.R;return R.medina.filter(x=>x.owner===p).length+((R.garee&&R.garee[p])?R.garee[p].length:0);}
function showFal(){
  const R=G.R,pool=shuffle(R.discard.slice()).slice(0,3);
  return new Promise((res,rej)=>{
    openSheet('<h2>Indice</h2><div class="sub">Ta chance</div><div class="pgrid" style="justify-content:center">'+(pool.map(c=>cardHTML(c,'')).join('')||'<div class="sub">—</div>')+'</div><button class="btn pri" id="falOk" style="width:100%;background:var(--saf);color:#140908">Compris</button>');
    $('#falOk').onclick=()=>{UI.rejectX=null;closeSheet();res();};
    UI.rejectX=()=>rej(ABORT);
  });
}

async function resolveTurn(h,b){
  const R=G.R,pk=[h,b];R.veil=null;
  const plays=[];
  pk.forEach((x,p)=>x.cards.forEach(c=>{
    R.hands[p]=R.hands[p].filter(y=>y.id!==c.card.id);
    plays.push({p,card:c.card,zone:c.zone,done:false});
  }));
  UI.sel=null;UI.sel2=null;UI.picked=null;
  R.curPlays=plays;
  UI.reveal={plays,flip:false,order:null,active:null,bars:[null,null]};
  // Baroud : paiement de la mèche
  const live=[null,null];
  for(const p of [0,1]){
    const nm=pk[p].bar;if(!nm)continue;
    const cost=BARS[nm].m;
    if(tot(p)>=cost){
      R.bar[p]=R.bar[p].filter(x=>x!==nm);
      if(cost){R.sc[p].meche-=cost;R.pot+=cost;}
      live[p]=nm;UI.reveal.bars[p]={name:nm,x:false};
    }
  }
  render();
  await beat(120);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('#board .flip').forEach(e=>e.classList.add('on'));
    if(UI.reveal)UI.reveal.flip=true;
  }));
  vib(15);
  await banner('Retournez !','wach',650);
  for(const p of [0,1]){
    if(live[p]){
      const cost=BARS[live[p]].m;
      if(cost)pop(p,'−'+cost);
      await banner(live[p]+' !',p?'bot':'ex',700);
    }
  }
  // Contre d'abord
  const qs=[0,1].filter(p=>live[p]==='Contre');
  if(qs.length===2){
    UI.reveal.bars[0].x=UI.reveal.bars[1].x=true;live[0]=live[1]=null;render();
    await banner('Contre × Contre','info',800);
  }else if(qs.length===1){
    const q=qs[0],o=1-q;
    if(live[o]){UI.reveal.bars[o].x=true;const nm=live[o];live[o]=null;render();await banner('Contre ! annule '+nm,q?'bot':'ex',950);}
    else await banner('Contre… dans le vide','info',700);
    live[q]=null;
  }
  // effets immédiats
  for(const p of [0,1]){
    if(live[p]==='Pari'){
      R.kelma[p]={v:pk[p].kv,turn:R.turn,held:false};
      await banner('Pari ! « '+pk[p].kv+' »',p?'bot':'ex',1000);
    }
    if(live[p]==='Indice'){
      if(p===0)await showFal();else await banner('Indice !','bot',600);
    }
    if(live[p]==='Bouclier')await applyVeil(p,pk[p].vt,p?'bot':'ex');
  }
  // initiative
  const last=R.turn===R.total;
  const prio=p=>Math.max(...plays.filter(x=>x.p===p).map(x=>x.card.v));
  let zr=[0,1].find(p=>live[p]==='Premier'),sb=[0,1].find(p=>live[p]==='Dernier');
  if(zr!==undefined&&sb!==undefined&&zr!==sb){
    await banner('Premier × Dernier','info',800);zr=sb=undefined;
  }
  let first;
  if(zr!==undefined)first=zr;
  else if(sb!==undefined)first=1-sb;
  else if(last)first=1-R.dealer;
  else{
    const v0=prio(0),v1=prio(1);
    first=v0!==v1?(v0>v1?0:1):1-R.dealer;
  }
  UI.reveal.order={[first]:1,[1-first]:2};
  render();await beat(520);
  // résolutions par créneau
  const fresh=[],lastKind={0:'free',1:'free'};
  for(const p of [first,1-first]){
    for(const m of plays.filter(x=>x.p===p)){
      UI.reveal.active=p;render();

function botPick(bi){
  const R=G.R,hand=R.hands[bi];
  if(R.script){
    const sc=R.script.bot[R.turn-1];
    const c=hand.find(x=>x.code===sc.code);
    return {card:c,zone:sc.zone};
  }
  const lvl=G.cfg.level;
  const wS=[1.35,.8,1][lvl],wM=[.5,1.4,1][lvl],noise=[.55,.4,.18][lvl];
  const lastT=R.turn===R.total;
  let best=null,bv=-1e9;
  for(const c of hand){
    for(const z of ['S','M']){
      const r=calc(bi,c,z);let v=0;
      const same=hand.filter(h=>h.id!==c.id&&h.v===c.v).length;
      if(z==='S'){
        if(r.kind==='cap'){const n=r.taken.reduce((a,x)=>a+(x.pile!==undefined?R.pile[x.pile].length:1),0);v+=wS*0.9*(n+1);if(r.missa)v+=1.4;}
        else v+=-.25;
        if(lvl===2&&R.turn>=R.total-3&&R.pile[1-bi].length>R.pile[bi].length+2)v+=.35*wS;
      }else{
        if(r.kind==='tringa')v+=(R.cap[bi]>=4?.8:3.6)*wM;
        else if(r.kind==='ronda')v+=(R.cap[bi]>=5?.6:2.6)*wM;
        else if(r.kind==='cap'){v+=.8*wM+.1*r.taken.length;}
        else v+=wM*(same&&R.cap[bi]<6?1:.15)-.6;
        if(r.kind==='free'&&lvl===2&&R.medina.some(x=>x.owner!==bi&&x.card.v===c.v))v-=.2;
      }
      // garder le 3e exemplaire pour la Tringa
      if(R.garee[bi].some(g=>g.v===c.v)&&r.kind!=='tringa')v-=3;
      if(lastT&&R.qaa&&bi===R.dealer&&r.kind!=='free')v+=2;
      v+=(Math.random()*2-1)*noise;
      if(v>bv){bv=v;best={card:c,zone:z};}
    }
  }
  return best;
}
function botBaroud(bi,pick){
  const R=G.R,hand=R.hands[bi];
  const base={cards:[{card:pick.card,zone:pick.zone}],bar:null};
  if(!R.baroud||!R.bar[bi].length)return base;
  if(R.script){
    const e=R.script.bb[R.turn-1]||{};
    return e.bar?{...base,bar:e.bar,kv:e.kv,kt:e.kt,vt:e.vt}:base;
  }
  const lvl=G.cfg.level,k=[.4,.65,.95][lvl],last=R.turn===R.total,sc=tot(bi);
  for(const n of shuffle(R.bar[bi].slice())){
    const m=BARS[n].m;if(sc<m)continue;
    if(n==='Pari'&&!last&&R.turn<R.total-1){
      let best=null,bc=0;
      for(const v of SEQ){
        const c=hand.filter(x=>x.v===v&&x.id!==pick.card.id).length+R.souk.filter(x=>x.v===v).length+R.medina.filter(x=>x.card.v===v).length;
        if(c>bc){bc=c;best=v;}
      }
      if(best&&bc>=2&&Math.random()<.8*k+.1)return {...base,bar:'Pari',kv:best};
    }
    if(n==='Contre'&&R.bar[1-bi].length&&Math.random()<.2*k)return {...base,bar:'Contre'};
    if(n==='Premier'){const r=calc(bi,pick.card,pick.zone);if(r.kind!=='free'&&Math.random()<.45*k)return {...base,bar:'Premier'};}
    if(n==='Dernier'){const r=calc(bi,pick.card,pick.zone);if(r.kind==='free'&&Math.random()<.3*k)return {...base,bar:'Dernier'};}
    if(n==='Vol'&&sc>=m+2&&freeTargets().length&&Math.random()<.5*k)return {...base,bar:'Vol'};
    if(n==='Encore'&&sc>=m+1&&canAoud(bi)&&R.cap[bi]<5){
      let pair=null;
      for(const a of hand)for(const c of hand)if(!pair&&a.id<c.id&&a.v===c.v)pair=[a,c];
      if(pair&&Math.random()<.85*k)return {cards:[{card:pair[0],zone:'M'},{card:pair[1],zone:'M'}],bar:'Encore'};
    }
    if(n==='Indice'&&Math.random()<.12*k)return {...base,bar:'Indice'};
    if(n==='Bouclier'&&!last&&Math.random()<.45*k){const vt=botVeil(bi);if(vt)return {...base,bar:'Bouclier',vt};}
  }
  return base;
}
function botEscalate(isSouk){
  const R=G.R;
  if(R.script){const e=R.script.esc;return e===undefined?true:e;}
  const pr=[.7,.85,1][G.cfg.level];
  return Math.random()<pr;
}

async function roundSummary(){
  const R=G.R,m=G.match;
  if(G.tuto)return lessonEnd();
  const t0=tot(0),t1=tot(1);
  m.hist.push([t0,t1]);
  const cum=m.hist.reduce((a,h)=>[a[0]+h[0],a[1]+h[1]],[0,0]);
  const over=m.round>=m.rounds&&cum[0]!==cum[1]&&!(m.tie&&false);
  const isLast=m.round>=m.rounds;
  let rowsHTML=tableRows().map(r=>`<tr class="fade"><td>${r.l}${r.k==='moul'?'<small>pile '+R.pile[0].length+' – '+R.pile[1].length+'</small>':''}</td><td>${r.a||'–'}</td><td>${r.b||'–'}</td></tr>`).join('');
  rowsHTML+=`<tr class="tot"><td>Manche ${m.round}${m.tie?' · départage':''}</td><td>${t0}</td><td>${t1}</td></tr>`;
  let btn,act;
  if(!isLast){btn='Manche '+(m.round+1);act='next';}
  else if(cum[0]===cum[1]){btn='Départage';act='tie';}
  else{btn='Résultat';act='end';}
  openSheet(`<h2>Fin de manche</h2><table class="sum"><tr><th></th><th>Toi</th><th>${BOTS[G.cfg.level].n}</th></tr>${rowsHTML}</table><button class="btn pri" id="sNext" style="width:100%;background:var(--saf);color:#140908">${btn}</button>`);

  closeSheet();

    await playRound();}
  else{matchEnd(cum);}
}

function zoneHTML(z){

  }).join('');
  let ptiles='';

  }
  // emplacements
  let mine='',opp='';
  const rv=UI.reveal;
  let placed=false;
  if(rv){
    const ord=rv.order,seen=[false,false];
    rv.plays.forEach(pl=>{
      let bb='';
      if(!seen[pl.p]){seen[pl.p]=true;const b=rv.bars[pl.p];if(b&&rv.flip)bb='<span class="bb'+(b.x?' x':'')+'">'+BARS[b.name].ar+'</span>';}
      if(pl.zone!==z||pl.done)return;

    });
  }else if(UI.phase==='select'){
    [[1,UI.sel],[2,UI.sel2]].forEach(([i,s])=>{
      if(s&&s.zone===z){

        mine+=`<div class="sealed" data-placed="${i}" role="button" tabindex="0" aria-label="Reprendre la carte"><div class="card back"></div>${bb}</div>`;
      }
    });

  const mineCls='slot mine'+(placed?' placed':'')+(UI.phase==='select'&&!placed?' target':'');
  const ready=UI.phase==='select'&&(UI.picked||UI.dragOver)&&(!UI.sel||(UI.bar==='Encore'&&!UI.sel2))?' ready':'';
  const over=UI.dragOver===z?' over':'';
  const hint=UI.allow&&UI.allow.zone===z&&UI.phase==='select'?' hint':'';
  return `<div class="zone ${S?'souk':'med'}${ready}${over}${hint}" data-zone="${z}" tabindex="0" role="button" aria-label="${S?'Souk':'Médina'}">
    <div class="zh"><span>${S?'Souk':'Médina'}</span><span class="cnt">${arr.length}</span></div>
    <div class="zfree ${arr.length+(ptiles?2:0)>8?'dense':''}">${cards}${ptiles}</div>${corner}
    <div class="slots"><div class="slot opp">${opp}</div><div class="${mineCls}">${mine}</div></div></div>`;
}

async function banner(txt,kind,ms){

function pop(p,text){
  const sc=document.querySelector('[data-score="'+p+'"]');if(!sc)return;
  const r=sc.getBoundingClientRect(),a=$('#app').getBoundingClientRect();
  const d=document.createElement('div');d.className='pop'+(p?' bot':'');d.textContent=text;
  d.style.left=(r.left-a.left-(text.length>3?30:0))+'px';d.style.top=(r.top-a.top-4)+'px';
  $('#fx').appendChild(d);setTimeout(()=>d.remove(),1200);
  sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump');
}
function fly(ids,target){
  const fx=$('#fx'),ar=$('#app').getBoundingClientRect(),tr=target?target.getBoundingClientRect():null;
  const ps=[];
  ids.forEach(id=>{
    const el=document.querySelector('[data-cid="'+id+'"]');if(!el)return;
    const r=el.getBoundingClientRect();
    const g=el.cloneNode(true);
    g.removeAttribute('data-cid');
    Object.assign(g.style,{position:'absolute',left:(r.left-ar.left)+'px',top:(r.top-ar.top)+'px',width:r.width+'px',height:r.height+'px',margin:'0',pointerEvents:'none',animation:'none'});
    g.style.setProperty('--cw',r.width+'px');g.style.setProperty('--ch',r.height+'px');
    g.classList.remove('hl');
    fx.appendChild(g);el.style.visibility='hidden';
    const dx=tr?(tr.left+tr.width/2)-(r.left+r.width/2):0,dy=tr?(tr.top+tr.height/2)-(r.top+r.height/2):-16;
    const kf=[{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+(tr?.35:.5)+')',opacity:tr?.85:0}];
    let a;
    try{a=g.animate(kf,{duration:FAST?120:480,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});ps.push(a.finished.catch(()=>{}).then(()=>g.remove()));}
    catch(e){g.remove();}
  });
  return Promise.all(ps);
}

function nudge(){const el=$('#coach');if(el.hidden)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function tryPlace(cid,zone){
  const R=G.R;if(!R||UI.phase!=='select')return;
  const c=R.hands[0].find(x=>x.id===cid);if(!c)return;
  const A=UI.allow,second=UI.bar==='Encore'&&!!UI.sel;
  if(A){
    const ec=second?A.c2:A.code,ez=second?A.z2:A.zone;
    if(c.code!==ec||zone!==ez){UI.picked=null;render();nudge();return;}
  }
  if(second)UI.sel2={card:c,zone};else UI.sel={card:c,zone};
  UI.picked=null;UI.dragOver=null;render();vib(10);
}
function toggleBar(n){
  if(UI.phase!=='select')return;
  const R=G.R,B=BARS[n],A=UI.allow,last=R.turn===R.total;
  const dis=tot(0)<B.m||(last&&(n==='Pari'||n==='Bouclier'))||(n==='Bouclier'&&!veilTargets().length)||(n==='Encore'&&!canAoud(0))||!!(A&&A.bar!==n);
  if(dis){nudge();return;}
  if(UI.bar===n){
    if(n==='Pari'){pickValue();return;}
    if(n==='Bouclier'){pickVeil();return;}
    UI.bar=null;UI.kv=null;UI.vt=null;UI.sel2=null;render();return;
  }
  UI.bar=n;UI.kv=null;UI.vt=null;UI.sel2=null;render();
  if(n==='Pari')pickValue();
  if(n==='Bouclier')pickVeil();
}
function pickValue(){
  const A=UI.allow;

  });

}

let drag=null;
$('#me').addEventListener('pointerdown-x',e=>{
  if(UI.phase!=='select')return;
  const el=e.target.closest('.hcard');if(!el)return;
  drag={id:+el.dataset.cid,el,x:e.clientX,y:e.clientY,moved:false,ghost:null,pid:e.pointerId};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.onpointermove=ev=>{
    if(!drag)return;
    if(!drag.moved&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>9){
      drag.moved=true;
      const g=el.cloneNode(true);g.classList.remove('picked','hint');g.classList.add('dragging-ghost');
      g.style.setProperty('--cw','68px');g.style.setProperty('--ch','96px');g.style.width='68px';g.style.height='96px';
      document.body.appendChild(g);drag.ghost=g;el.style.opacity='.25';
      UI.picked=null;
    }
    if(drag.moved){
      drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';
      const z=document.elementFromPoint(ev.clientX,ev.clientY);
      const zn=z&&z.closest?z.closest('.zone'):null;
      const zk=zn?zn.dataset.zone:null;
      if(zk!==UI.dragOver){
        UI.dragOver=zk;
        document.querySelectorAll('#board .zone').forEach(n=>n.classList.toggle('over',n.dataset.zone===zk));
      }
    }
  };
  const fin=ev=>{
    if(!drag)return;
    const d=drag;drag=null;el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null;
    if(d.ghost)d.ghost.remove();
    el.style.opacity='';
    if(d.moved){
      const z=document.elementFromPoint(ev.clientX,ev.clientY);
      const zn=z&&z.closest?z.closest('.zone'):null;
      UI.dragOver=null;
      if(zn&&ev.type==='pointerup')tryPlace(d.id,zn.dataset.zone);else render();
    }else{
      UI.picked=UI.picked===d.id?null:d.id;render();
    }
  };
  el.onpointerup=fin;el.onpointercancel=fin;
});

/* =====================================================================
   JEU FRANÇAIS UNIQUEMENT : As, 2 à 7, Valet, Dame, Roi · ♣ ♥ ♠ ♦

function Tselect(cid){
  if(UI.phase!=='select'||UI.stage!=='pick')return;

function TallReady(){for(let p=1;p<AD.N();p++)if(!AD.ready(p))return false;return true;}
async function Tseal(){

async function Tglide(from,to,col){
  if(!from||!to)return;
  const ar=$('#app').getBoundingClientRect(),fr=from.getBoundingClientRect(),tr=to.getBoundingClientRect();
  const g=document.createElement('div');g.className='flyc own'+col;
  Object.assign(g.style,{left:(fr.left-ar.left)+'px',top:(fr.top-ar.top)+'px',width:fr.width+'px',height:fr.height+'px'});
  $('#fx').appendChild(g);
  const dx=tr.left+tr.width/2-(fr.left+fr.width/2),dy=tr.top+tr.height-fr.height/2-(fr.top+fr.height/2)-10;
  try{const a=g.animate([{transform:'translate(0,0)'},{transform:'translate('+dx+'px,'+dy+'px)'}],{duration:FAST?120:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});a.finished.catch(()=>{}).then(()=>g.remove());}
  catch(x){g.remove();}

async function Tslide(zone){
  if(UI.stage!=='slide'||UI.phase!=='select')return;
  const mine=[UI.sel,UI.sel2].filter(Boolean),idx=UI.slideIdx||0,cur=mine[idx];
  if(!cur)return;
  const A=UI.allow;
  if(A&&zone!==(idx===0?A.zone:A.z2)){nudge();return;}
  cur.zone=zone;UI.slideIdx=idx+1;
  UI.stage='gliding';
  Tglide(document.querySelector('#neutral .nc.mine[data-ns="'+idx+'"]'),document.querySelector(Ttarget(zone,0)),AD.col(0));
  await beat(300);
  UI.sealed=UI.sealed.filter(s=>!(s.mine&&s.k===idx));
  if(UI.slideIdx<mine.length){UI.stage='slide';render();return;}
  // glissement simultané des cartes des autres joueurs
  for(const s of UI.sealed){
    const bp=UI.botPays&&UI.botPays[s.p];
    const z=bp&&bp.cards[s.k]?bp.cards[s.k].zone:zone;
    Tglide(document.querySelector('#neutral .nc[data-p="'+s.p+'"][data-k="'+s.k+'"]'),document.querySelector(Ttarget(z,s.p)),AD.col(s.p));
  }
  await beat(420);
  const pay={cards:mine.map(m=>({card:m.card,zone:m.zone})),bar:UI.bar,kv:UI.kv,kt:A&&A.kt,cz:A&&A.cz,qt:A&&A.qt};
  UI.stage=null;UI.sealed=[];UI.slideIdx=0;
  UI.phase='busy';
  if(UI.resolveSel){const f=UI.resolveSel;UI.resolveSel=null;f(pay);}
}
function TdragStart(e,el,o){
  const d={x:e.clientX,y:e.clientY,moved:false,ghost:null};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.onpointermove=ev=>{
    if(!d.moved&&Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>9){d.moved=true;d.ghost=o.ghost();document.body.appendChild(d.ghost);el.style.opacity='.25';}
    if(d.moved){d.ghost.style.left=ev.clientX+'px';d.ghost.style.top=ev.clientY+'px';if(o.over)o.over(ev);}
  };
  const fin=ev=>{
    el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null;
    if(d.ghost)d.ghost.remove();
    el.style.opacity='';
    if(o.over)o.over(null);
    if(ev.type!=='pointerup')return;
    if(d.moved)o.drop(ev);else if(o.tap)o.tap(ev);
  };
  el.onpointerup=fin;el.onpointercancel=fin;
}

function TneutralDuel(){

    else up+=`<div class="nc own${AD.col(sl.p)}" data-p="${sl.p}" data-k="${sl.k}"></div>`;
  });

}
function TzoneDuel(z){
  const R=G.R,S=z==='S',arr=S?R.souk:R.medina;
  const cards=arr.map(x=>{
    const c=cOf(z,x),own=S?null:x.owner,who=S?c.own:(x.owner!=null?x.owner:x.by);
    const onm=(who!==null&&who!==undefined)?'<span class="onm own'+AD.col(who)+'">'+AD.name(who)+'</span>':'';
    const cls='zc'+veilCls(c)+(UI.hl.has(c.id)?' hl':'')+(UI.newId===c.id?' new':'')+(UI.pick?(UI.pick.ids.has(c.id)?' pickable':' dim'):'');
    return `<div class="card s${c.s} ${cls}" data-cid="${c.id}" style="--r:${Tr(c.id)}deg">${cardInner(c)}${(S||own===null||own===undefined)?'':'<span class="tok own'+AD.col(own)+'"></span>'}${onm}</div>`;
  }).join('');
  let top='',bot='';
  const rv=UI.reveal;
  if(rv){
    const seen={};
    rv.plays.forEach(pl=>{
      let bb='';
      if(!seen[pl.p]){seen[pl.p]=true;const b=rv.bars[pl.p];if(b&&rv.flip)bb='<span class="bb'+(b.x?' x':'')+'">'+BARS[b.name].ar+'</span>';}
      if(pl.zone!==z||pl.done)return;
      const ord=rv.order&&rv.order[pl.p],cur=rv.active===pl.p;
      const f=`<div class="flip own${AD.col(pl.p)} ${rv.flip?'on':''}${rv.active===pl.p?' act':''}" data-cid="${pl.card.id}"><div class="in"><div class="face f1"><div class="card back"></div></div><div class="face f2"><div class="card s${pl.card.s}">${cardInner(pl.card)}</div></div></div>${ord?'<span class="ord '+(cur?'cur':'')+'">'+ord+'</span>':''}<span class="wn">${AD.name(pl.p)}</span>${bb}</div>`;
      if(pl.p===0)bot+=f;else top+=f;
    });
  }
  const A=UI.allow,slide=UI.phase==='select'&&UI.stage==='slide';
  const ready=slide?' ready':'';
  const hint=A&&slide&&(((UI.slideIdx||0)===0)?A.zone:A.z2)===z?' hint':'';
  const nm=S?'SOUK':'MÉDINA';
  return `<div class="zone ${S?'souk':'med'}${ready}${hint}" data-zone="${z}" tabindex="0" role="button" aria-label="${S?'Souk':'Médina'}">
    <div class="zl up">ZONE<br>${nm}</div><div class="zl dn">ZONE<br>${nm}</div>
    <div class="rs top">${top}</div><div class="rs bot">${bot}</div>
    <div class="zfree v3 ${arr.length>8?'dense':''}">${cards}</div></div>`;
}
function TbandDuel(p,side){

  const up=p===1?' up':'';
  if(side==='M'){
    let gp='';
    R.garee[p].forEach(g=>{gp+=`<span class="gpair own${AD.col(p)}"><span class="mc s${g.cards[0].s}">${Tface(g.v)}</span><span class="mc s${g.cards[1].s}">${Tface(g.v)}</span><i class="cj"></i></span>`;});
    return `<div class="band l ${p===1?'t':'b'}"><span class="bnd${up}">ZONE<br>RONDA</span><span class="v4 bpairs">${gp}</span></div>`;
  }

}
function TboardDuel(){

}

/* =====================================================================
   PLATEAU 3-4 JOUEURS (référence) : 4 bandeaux, 4 quadrants, croix de zones neutres
   Médina = TL + BR · Souk = TR + BL — chaque joueur a une Médina et un Souk devant lui
   ===================================================================== */
const PARTQ={S:{0:'BL',1:'TR',2:'TR',3:'BL'},M:{0:'BR',1:'BR',2:'TL',3:'TL'}};
const QTYPE={TL:'M',TR:'S',BL:'S',BR:'M'};
T.alt=0;
function Ttarget(z,p){
  if(AD.N()===2)return '.zone[data-zone="'+z+'"] '+(p===0?'.rs.bot':'.rs.top');
  return '.zone[data-part="'+PARTQ[z][p]+'"] .rs.p'+p;
}
/* partie physique d'une carte libre : devant le joueur qui l'a posée (stable tant que la carte ne change pas de zone) */
function Tqp(c,z,seat){
  if(c.qz!==z||c.qp===undefined){
    c.qz=z;
    c.qp=(seat===null||seat===undefined)?(z==='S'?((T.alt++%2)?'TR':'BL'):((T.alt++%2)?'TL':'BR')):PARTQ[z][seat];
  }
  return c.qp;
}
function TfreeCard(c,z,own,by){
  const who=z==='S'?c.own:(own!==null&&own!==undefined?own:by),onm=(who!==null&&who!==undefined)?'<span class="onm own'+AD.col(who)+'">'+AD.name(who)+'</span>':'';
  const cls='zc'+veilCls(c)+(UI.hl.has(c.id)?' hl':'')+(UI.newId===c.id?' new':'')+(UI.pick?(UI.pick.ids.has(c.id)?' pickable':' dim'):'');
  return `<div class="card s${c.s} ${cls}" data-cid="${c.id}" style="--r:${Tr(c.id)}deg">${cardInner(c)}${(z==='S'||own===null||own===undefined)?'':'<span class="tok own'+AD.col(own)+'"></span>'}${onm}</div>`;
}
function TflipHTML(pl,rv){
  const ord=rv.order&&rv.order[pl.p],cur=rv.active===pl.p;
  const b=rv.bars[pl.p];
  const bb=(b&&rv.flip&&!pl.second)?'<span class="bb'+(b.x?' x':'')+'">'+BARS[b.name].ar+'</span>':'';
  return `<div class="flip own${AD.col(pl.p)} ${rv.flip?'on':''}${rv.active===pl.p?' act':''}" data-cid="${pl.card.id}"><div class="in"><div class="face f1"><div class="card back"></div></div><div class="face f2"><div class="card s${pl.card.s}">${cardInner(pl.card)}</div></div></div>${ord?'<span class="ord '+(cur?'cur':'')+'">'+ord+'</span>':''}<span class="wn">${AD.name(pl.p)}</span>${bb}</div>`;
}
const QLAB={TL:'ZONE<br>MÉDINA',BR:'ZONE<br>MÉDINA',TR:'ZONE<br>SOUK',BL:'ZONE<br>SOUK'};
function Tq(q,cards,rsm){
  const z=QTYPE[q],S=z==='S',R=G.R;
  const A=UI.allow,slide=UI.phase==='select'&&UI.stage==='slide';
  const ready=slide?' ready':'';
  const hint=A&&slide&&(((UI.slideIdx||0)===0)?A.zone:A.z2)===z?' hint':'';
  let rs='';
  for(let p=0;p<R.N;p++)rs+=`<div class="rs p${p}">${rsm[p]||''}</div>`;
  return `<div class="zone ${S?'souk':'med'} q${q}${ready}${hint}" data-zone="${z}" data-part="${q}" tabindex="0" role="button" aria-label="${S?'Souk':'Médina'}">
    <div class="zl ${q}">${QLAB[q]}</div>${rs}<div class="zfree v3 ${cards.length>6?'dense':''}">${cards.join('')}</div></div>`;
}
function Tcell(p,kind,cls){
  const R=G.R,free=p>=R.N;
  const orient=['b','r','t','l'][p];
  let objs='',lab=kind==='R'?'ZONE<br>RONDA':'PILE DE<br>CAPTURE';
  if(!free){
    if(kind==='R'){
      R.garee[p].forEach(g=>{objs+=`<span class="gpair own${AD.col(p)}"><span class="mc s${g.cards[0].s}">${Tface(g.v)}</span><span class="mc s${g.cards[1].s}">${Tface(g.v)}</span><i class="cj"></i></span>`;});
    }else if(!R.teams||p<2){
      objs=Tstack(AD.ent(p));
    }
  }
  const first=/^(tbR|bbR|lbB|rbB)$/.test(cls);   // le centre est avant l'étiquette
  const lb=`<span class="bnd o${orient}">${lab}</span>`;
  const ob=`<span class="objs v4">${objs}</span>`;
  return `<div class="qb ${cls} o${orient}${free?' free':''}">${first?lb+ob:ob+lb}</div>`;
}
function Tquad(){
  const R=G.R,rv=UI.reveal;
  const cards={TL:[],TR:[],BL:[],BR:[]},rsm={TL:{},TR:{},BL:{},BR:{}};
  R.souk.forEach(c=>{const q=Tqp(c,'S',c.own);cards[q].push(TfreeCard(c,'S',null));});
  R.medina.forEach(x=>{const q=Tqp(x.card,'M',x.owner!=null?x.owner:x.by);cards[q].push(TfreeCard(x.card,'M',x.owner,x.by));});
  if(rv){
    const seen={};
    rv.plays.forEach(pl=>{
      if(pl.done)return;
      const q=PARTQ[pl.zone][pl.p];
      pl.second=!!seen[pl.p];seen[pl.p]=true;
      rsm[q][pl.p]=(rsm[q][pl.p]||'')+TflipHTML(pl,rv);
    });
  }
  return Tcell(2,'R','tbL')+Tcell(2,'P','tbR')
    +Tcell(3,'R','lbT')+Tq('TL',cards.TL,rsm.TL)+Tq('TR',cards.TR,rsm.TR)+Tcell(1,'P','rbT')
    +Tcell(3,'P','lbB')+Tq('BL',cards.BL,rsm.BL)+Tq('BR',cards.BR,rsm.BR)+Tcell(1,'R','rbB')
    +Tcell(0,'P','bbL')+Tcell(0,'R','bbR')+Tneutral();
}
function Tneutral4(){
  if(UI.phase!=='select')return '';
  const R=G.R,N=R.N,pick=UI.stage==='pick';
  const pos={0:'b',1:'r',2:'t',3:'l'};
  let h='';
  for(const p of [2,0,3,1]){
    const free=p>=N;
    let cs='';
    if(p===0){
      if(pick)cs='<div class="nc ph"></div>';
      else (UI.sealed||[]).filter(x=>x.mine).forEach(x=>{cs+=`<div class="nc mine own${AD.col(0)}" data-ns="${x.k}" role="button" aria-label="Ta carte scellée">${x.k===0&&UI.bar?'<span class="bb">'+BARS[UI.bar].ar+'</span>':''}</div>`;});
    }else if(!pick){
      (UI.sealed||[]).filter(x=>x.p===p).forEach(x=>{cs+=`<div class="nc own${AD.col(p)}" data-p="${p}" data-k="${x.k}"></div>`;});
    }
    h+=`<div class="nzc ${pos[p]}${free?' free':''}" data-seat="${p}"><span class="nt">ZONE<br>NEUTRE</span><div class="ncs">${cs}</div></div>`;
  }
  return `<div id="neutral" class="nz4 ${UI.stage==='slide'?'active':''}">${h}</div>`;
}
/* plateau carré : la taille interne (--bs) suit le côté du plateau */
function Tsquare(){
  const bd=$('#board');if(!bd||!bd.classList.contains('quad'))return;
  bd.style.flex='1 1 0';bd.style.width='';bd.style.height='';
  const pw=bd.parentNode.clientWidth-12,h=bd.clientHeight;
  if(!pw||!h)return;
  const sz=Math.max(220,Math.min(pw,h));
  bd.style.width=sz+'px';
  if(h>pw){bd.style.flex='none';bd.style.height=sz+'px';}
  bd.style.setProperty('--bs',sz+'px');
}
window.addEventListener('resize',()=>{if(G.R)Tsquare();});

/* =====================================================================
   HISTORIQUE DES COUPS — depuis la pause, la fin de manche et la fin de match
   ===================================================================== */
const HL={log:[],pending:[],cur:null};
const HFR={B:'♣',C:'♥',E:'♠',D:'♦'},HFV={1:'A',10:'J',11:'Q',12:'K'},HSH={B:'Bât.',C:'Cou.',E:'Ép.',D:'Den.'};
function Hn(p){
  if(typeof seatName==='function')return seatName(p);
  return p===0?'Toi':(G.tuto?'Louis':BOTS[G.cfg.level].n);
}
function HEn(e){return (typeof entName==='function')?entName(e):Hn(e);}
function Hcard(c){return (HFV[c.v]||c.v)+HFR[c.s];}
const HZ={S:'Souk',M:'Médina'};
const HK={ann:'annonce',missa:'Missa',exch:'échange',qaa:'Dernière capture',moul:'Moul Souk',meche:'mèche',kelma:'Pari',pot:'Poudrière'};
function Hround(){return G.match?G.match.round:0;}
function Hesc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function HLpts(e,k,g){
  const t=(g>0?'+':'')+g+' '+(HK[k]||k)+(k==='ann'&&g===0?' (plafond)':'')+' — '+HEn(e);
  if(g===0&&k!=='ann')return;
  if(HL.step)HL.step.pts.push((g>0?'+':'')+g+' '+(HK[k]||k)+(k==='ann'&&g===0?' (plafond)':''));
  else if(HL.cur)HL.cur.pts.push(t);else HL.pending.push({k:'pts',t});
}
const _Hap=addPts;
addPts=function(a,b,c){const g=_Hap(a,b,c);HLpts(a,b,g);return g;};
if(typeof addAnn==='function'){
  const _Haa=addAnn;
  addAnn=function(p,pts){const g=_Haa(p,pts);HLpts(ent(p),'ann',g);return g;};
}
const _Hap2=applyRes;
function Hpl(p){return (typeof entName==='function'&&G.R.teams&&typeof ent==='function')?entName(ent(p)):Hn(p);}
function Hdesc(r,x){return x.pile!==undefined?'pile de '+HEn(x.pile)+' ('+Hcard(x.card)+')':Hcard(cOf(r.z,x));}
applyRes=async function(r){
  const e=HL.cur;let rec=null;
  if(e){
    if(!e.ord&&UI.reveal&&UI.reveal.order){
      const o=UI.reveal.order,ps=Object.keys(o).map(Number).sort((x,y)=>o[x]-o[y]);
      e.ord=ps;e.rk=o;e.eff={};
      ps.forEach(p=>{const b=UI.reveal.bars&&UI.reveal.bars[p];e.eff[p]=(b&&!b.x&&(b.name==='Premier'||b.name==='Dernier'))?b.name:null;});
    }
    rec={p:r.p,t:Hcard(r.c),z:r.z,kind:r.kind,missa:!!r.missa,second:e.res.some(x=>x.p===r.p),
      taken:r.taken.map(x=>Hdesc(r,x)),groups:r.groups.map(g=>g.map(x=>Hdesc(r,x))),pts:[],rk:e.rk?e.rk[r.p]:0};
    e.res.push(rec);HL.step=rec;
  }
  try{const out=await _Hap2(r);if(rec&&rec.kind==='free'&&rec.z==='M'){const x=G.R.medina.find(y=>y.card.id===r.c.id);rec.noTok=!!(x&&x.owner==null);}return out;}finally{HL.step=null;}
};
const HSKIP=/^((Premier|Dernier|Encore|Indice|Contre|Vol|Pari|Bouclier) !$)|^(Retournez|Refresh|Le Donneur distribue|Tu donnes|.+ donne$|Ronda|Tringa|Missa|Dernière capture|Moul Souk|Pari tenu|Pari perdu|Poudrière|Baroud)/;
const _Hbn=banner;
banner=function(txt,kd,ms){
  try{
    const t=String(txt).replace(/<[^>]+>/g,'');
    if(kd!=='wach'&&!HSKIP.test(t)){
      if(HL.cur)HL.cur.notes.push(t);else HL.pending.push({k:'note',t});
    }
  }catch(e){}
  return _Hbn(txt,kd,ms);
};
const _Hrf=doRefresh;
doRefresh=async function(){HL.pending.push({k:'note',t:'Le Donneur distribue 2 cartes à chaque joueur'});return _Hrf();};
const _Hrt=resolveTurn;
resolveTurn=async function(...a){
  const pays=(a.length===1&&Array.isArray(a[0]))?a[0]:a,R=G.R;
  const e={round:Hround(),turn:R.turn,total:R.total,
    plays:pays.map((x,p)=>({p,n:Hn(p),cards:x.cards.map(c=>({t:Hcard(c.card),z:c.zone})),bar:x.bar||null,kv:x.kv||null})),
    res:[],pts:[],notes:[],pre:HL.pending.filter(x=>x.k==='note').map(x=>x.t),done:false,ord:null,rk:null,eff:{},
    dealer:R.dealer,last:R.turn===R.total,val:{}};
  pays.forEach((x,p)=>{e.val[p]=Math.max(...x.cards.map(c=>c.card.v));});
  HL.pending=HL.pending.filter(x=>x.k==='pts');
  HL.cur=e;HL.log.push(e);
  try{return await _Hrt(...a);}finally{e.done=true;HL.cur=null;}
};
const _Hrs=roundSummary;
roundSummary=async function(){
  const R=G.R,m=G.match;
  let fin=null;
  try{
    if(!G.tuto){
      const N=R.sc?R.sc.length:2,idx=[...Array(N).keys()],rs=idx.map(i=>tot(i)),prev=(m&&m.hist)||[];
      fin={names:idx.map(i=>HEn(i)),rs,cum:rs.map((x,i)=>prev.reduce((a,h)=>a+h[i],0)+x),tie:!!(m&&m.tie),
        rows:tableRows().map(r=>({l:r.l,v:r.v?r.v.slice():[r.a,r.b]})).filter(r=>r.v.some(x=>x))};
    }
  }catch(x){fin=null;}
  if(HL.pending.length||fin){
    const e={round:Hround(),turn:null,end:true,res:[],pts:HL.pending.filter(x=>x.k==='pts').map(x=>x.t),
      notes:HL.pending.filter(x=>x.k==='note').map(x=>x.t),plays:[],pre:[],done:true,fin};
    HL.pending=[];
    if(e.pts.length||e.notes.length||fin)HL.log.push(e);
  }
  return _Hrs();
};
const _Hsm=startMatch;
startMatch=function(){HL.log=[];HL.pending=[];HL.cur=null;_Hsm();};
if(typeof startLesson==='function'){
  const _Hsl=startLesson;
  startLesson=function(i){HL.log=[];HL.pending=[];HL.cur=null;_Hsl(i);};
}
function Hv(v){return HFV[v]||v;}
function Hwhy(e,i){
  const p=e.ord[i],f=e.eff[p],v=e.val[p];
  if(f==='Premier')return 'Premier : il passe en premier';
  if(f==='Dernier')return 'Dernier : il passe en dernier';
  if(e.last&&p===e.dealer)return 'dernier tour : le Donneur passe toujours en dernier';
  if(i===0)return 'valeur la plus haute ('+Hv(v)+')';
  const q=e.ord[i-1];
  if(!e.eff[q]&&e.val[q]===v)return p===e.dealer?'à égalité ('+Hv(v)+') le Donneur passe en dernier':'à égalité ('+Hv(v)+') : rotation à partir du Donneur';
  return 'valeur plus basse ('+Hv(v)+')';
}
function Hpile(p){const tm=typeof G!=='undefined'&&G.R&&G.R.teams;return p===0?(tm?'notre pile':'ta pile'):'la pile de '+Hesc(Hpl(p));}
function Hexp(r){
  const z=HZ[r.z],who=Hpile(r.p);
  if(r.kind==='free')return r.z==='M'?`${Hesc(r.t)} reste libre en Médina ${r.noTok?'(sans jeton : jetons de couleur épuisés, pas de Ronda possible)':'(avec '+(r.p===0?'ton jeton':'le jeton de '+Hesc(Hn(r.p)))+')'} : aucune carte de même valeur à prendre.`:`${Hesc(r.t)} reste libre au Souk : aucune carte de même valeur à prendre.`;
  if(r.kind==='ronda')return `${Hesc(r.t)} rejoint sa carte libre de même valeur : Ronda +2, la paire est mise de côté.`;
  if(r.kind==='tringa')return `${Hesc(r.t)} est la 3ᵉ carte de même valeur : Tringa +3, le trio rejoint ${who}.`;
  const g=r.groups||[];let t=`${Hesc(r.t)} capture ${g[0]?Hesc(g[0].join(' + ')):'—'} (même valeur)`;
  for(let i=1;i<g.length;i++)t+=` puis ${Hesc(g[i].join(' + '))} (chaîne)`;
  t+=r.z==='S'?` → dans ${who}.`:' → ces cartes sortent du jeu, sans point.';
  if(r.missa)t+=' Souk vidé : Missa +1.';
  return t;
}
function Hhtml(round){
  const rounds=[...new Set(HL.log.map(e=>e.round))].sort((a,b)=>a-b);
  if(!rounds.length)return '<div class="sub">Aucun coup joué pour l’instant.</div>';
  if(round===undefined||!rounds.includes(round))round=rounds[rounds.length-1];
  const fin=r=>{const e=HL.log.find(x=>x.round===r&&x.end&&x.fin);return e&&e.fin;};
  const chips=rounds.length>1?'<div class="hchips">'+rounds.map(r=>{const f=fin(r);return `<button class="hchip${r===round?' on':''}" data-r="${r}">Manche ${r||1}${f?' · '+f.rs.join('–'):''}</button>`;}).join('')+'</div>':'';
  const body=HL.log.filter(e=>e.round===round&&(e.done||e.end)).map(e=>{
    if(e.end){
      let t='';
      if(e.fin){
        const f=e.fin;
        t=`<div class="hfin"><div class="hh">Score final de la manche${f.tie?' (départage)':''}</div><table class="sum"><tr><th></th>${f.names.map(n=>'<th>'+Hesc(n)+'</th>').join('')}</tr>`+
          f.rows.map(r=>`<tr><td>${Hesc(r.l)}</td>${r.v.map(x=>'<td>'+(x||'–')+'</td>').join('')}</tr>`).join('')+
          `<tr class="tot"><td>Manche</td>${f.rs.map(x=>'<td>'+x+'</td>').join('')}</tr><tr class="tot"><td>Cumul</td>${f.cum.map(x=>'<td>'+x+'</td>').join('')}</tr></table></div>`;
      }
      return `<div class="he"><div class="hh">Fin de manche</div>${e.pts.map(x=>'<div class="hp">'+Hesc(x)+'</div>').join('')}${e.notes.map(x=>'<div class="hn">'+Hesc(x)+'</div>').join('')}${t}</div>`;
    }
    const pl=e.plays.map(p=>`<span class="hrv"><b>${Hesc(p.n)}</b> ${p.cards.map(c=>Hesc(c.t)+'→'+HZ[c.z]).join(' + ')}${p.bar?' <i>✦ '+Hesc(p.bar)+(p.kv?' '+p.kv:'')+'</i>':''}</span>`).join('');
    const rs=e.res.map(r=>{
      const why=(!r.second&&e.ord)?(e.ord.indexOf(r.p)>=0?Hwhy(e,e.ord.indexOf(r.p)):''):'';
      const head=r.second?'':`<span class="hk">${r.rk||''}</span><b>${Hesc(Hn(r.p))}</b>${why?' <small>'+Hesc(why)+'</small>':''}`;
      return `<div class="hs">${head}<div class="hx">${Hexp(r)}${r.pts&&r.pts.length?' <em>'+r.pts.map(Hesc).join(' · ')+'</em>':''}</div></div>`;
    }).join('');
    const pts=e.pts.map(t=>'<div class="hp">'+Hesc(t)+'</div>').join('');
    const nt=e.pre.concat(e.notes).map(t=>'<div class="hn">'+Hesc(t)+'</div>').join('');
    return `<div class="he"><div class="hh">Tour ${e.turn}/${e.total}</div>${nt}<div class="hrevs">${pl}</div>${rs}${pts}</div>`;
  }).join('')||'<div class="sub">Aucun coup terminé dans cette manche.</div>';
  return chips+'<div class="hbody">'+body+'</div>';
}
function Hopen(round){
